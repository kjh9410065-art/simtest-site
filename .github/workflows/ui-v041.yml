name: Apply v0.00.41 home quick cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject v0.00.41 styles and script
        shell: python
        run: |
          from pathlib import Path
          import re
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = re.sub(r'\n?<link[^>]*assets/ui-v041\.css[^>]*>', '', text)
          text = re.sub(r'\n?<script[^>]*assets/ui-v041\.js[^>]*></script>', '', text)
          text = text.replace('</head>', '<link rel="stylesheet" href="assets/ui-v041.css?v=0.00.41">\n</head>', 1)
          text = text.replace('</body>', '<script defer src="assets/ui-v041.js?v=0.00.41"></script>\n</body>', 1)
          index.write_text(text, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: refine home quick cards v0.00.41 [skip ci]"
          git push
