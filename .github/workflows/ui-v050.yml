name: Validate responsive UI runtime

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/ui-v052.css'
      - 'assets/ui-v052.js'
      - '.github/workflows/ui-v050.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate runtime and test flow
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('assets/ui-v052.js').read_text(encoding='utf-8')
          css = Path('assets/ui-v052.css').read_text(encoding='utf-8')

          # 현재 런타임이 실제 저장된 결과 JPG를 기준으로 동작하는지 확인한다.
          assert 'stableResultImagePath' in js
          assert 'assets/results/'+"'"+'+match[1]' in js
          assert 'result-hero.png' not in js
          assert "localStorage.removeItem('fortuneBirthDate')" in js

          # 테스트 시작, 답변 선택, 이전/다음, 결과, 다시하기가 모두 존재해야 한다.
          for fn in ('startTest','renderQ','pick','prevQ','nextQ','showResult','restart'):
              assert f'function {fn}(' in html, fn

          # 테스트 6종이 모두 등록되어 있는지 확인한다.
          ids = re.findall(r'id:\"([a-z]+)\"', html[html.find('const TESTS='):])
          expected = {'love','personality','stress','soulmate','leadership','first'}
          assert expected.issubset(set(ids))

          # 결과에 사용하는 24개 JPG가 모두 실제 저장소에 존재하는지 확인한다.
          result_dir = Path('assets/results')
          for test_id in expected:
              for n in range(1,5):
                  assert (result_dir / f'{test_id}-{n}.jpg').exists(), f'{test_id}-{n}.jpg'

          # 모든 인라인 JavaScript의 문법을 검사한다.
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          with tempfile.TemporaryDirectory() as td:
              for i, source in enumerate(scripts):
                  if not source.strip():
                      continue
                  p = Path(td) / f'script_{i}.js'
                  p.write_text(source, encoding='utf-8')
                  subprocess.run(['node','--check',str(p)], check=True)

          # 외부 런타임 자체의 JavaScript 문법도 검사한다.
          with tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False) as f:
              f.write(js)
              runtime = f.name
          try:
              subprocess.run(['node','--check',runtime], check=True)
          finally:
              Path(runtime).unlink(missing_ok=True)

          # 프로젝트에서 금지한 이모지와 장식용 유니코드 기호가 새 UI 파일에 없는지 확인한다.
          forbidden = re.compile(r'[\U0001F000-\U0001FFFF\u2190-\u21FF\u2200-\u22FF\u2300-\u23FF\u25A0-\u25FF\u2600-\u27BF\u2900-\u297F\u2B00-\u2BFF]')
          assert not forbidden.search(css)
          assert not forbidden.search(js)

          print('Responsive runtime and test-flow validation passed.')
