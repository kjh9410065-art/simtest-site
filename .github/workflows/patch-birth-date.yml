name: Patch zodiac detail navigation
on:
  push:
    paths:
      - .github/workflows/patch-birth-date.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load zodiac detail script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="/assets/test-data.js"></script>'
          new=old+'<script src="/assets/zodiac-links.js"></script>'
          if old not in s:
              raise SystemExit('script insertion point not found')
          if '/assets/zodiac-links.js' not in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: 띠·별자리 목록을 상세 페이지로 연결'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/patch-birth-date.yml
          git commit -m 'chore: remove temporary patch workflow'
          git push