name: Replace static images with Workers AI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace static image references
        run: |
          sed -i 's#src="assets/hero-night.svg"#data-ai-image="hero"#g' index.html
          sed -i "s#src='assets/hero-night.svg'#data-ai-image='hero'#g" index.html
          sed -i 's#src="assets/art-zodiac.svg"#data-ai-image="zodiac"#g' index.html
          sed -i "s#src='assets/art-zodiac.svg'#data-ai-image='zodiac'#g" index.html
          sed -i 's#src="assets/art-stars.svg"#data-ai-image="stars"#g' index.html
          sed -i "s#src='assets/art-stars.svg'#data-ai-image='stars'#g" index.html
          sed -i 's#src="assets/art-test.svg"#data-ai-image="test"#g' index.html
          sed -i "s#src='assets/art-test.svg'#data-ai-image='test'#g" index.html
          sed -i 's#src="assets/art-lucky.svg"#data-ai-image="lucky"#g' index.html
          sed -i "s#src='assets/art-lucky.svg'#data-ai-image='lucky'#g" index.html
          sed -i 's#assets/hero-night.svg#/api/image?type=hero#g' index.html
          sed -i 's#assets/art-zodiac.svg#/api/image?type=zodiac#g' index.html
          sed -i 's#assets/art-stars.svg#/api/image?type=stars#g' index.html
          sed -i 's#assets/art-test.svg#/api/image?type=test#g' index.html
          sed -i 's#assets/art-lucky.svg#/api/image?type=lucky#g' index.html
          sed -i 's#</body>#<script src="ai-images.js"></script></body>#' index.html

      - name: Create AI image loader
        run: |
          cat > ai-images.js <<'EOF'
          // 페이지의 이미지 파일을 사용하지 않고 Workers AI에서 이미지를 받아옵니다.
          (() => {
            const date = new Date().toISOString().slice(0, 10);
            document.querySelectorAll("[data-ai-image]").forEach((image) => {
              const type = image.dataset.aiImage;
              if (!type) return;
              image.loading = type === "hero" ? "eager" : "lazy";
              image.decoding = "async";
              image.src = `/api/image?type=${encodeURIComponent(type)}&date=${date}`;
            });
          })();
          EOF

      - name: Remove static image files
        run: rm -f assets/art-zodiac.svg assets/art-stars.svg assets/art-test.svg assets/art-lucky.svg assets/hero-night.svg

      - name: Verify no static SVG references remain
        run: |
          if grep -n "assets/.*\.svg" index.html; then
            echo "Static SVG image reference remains in index.html"
            exit 1
          fi

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ai-images.js assets
          if git diff --cached --quiet; then
            echo "No migration changes needed"
            exit 0
          fi
          git commit -m "Use Workers AI for site illustrations"
          git push
