name: Replace static images with Workers AI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace image files with AI image endpoints
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          # 기존 정적 SVG의 src 속성을 Workers AI 이미지 표시자로 바꿉니다.
          replacements = {
              "hero-night.svg": "hero",
              "art-zodiac.svg": "zodiac",
              "art-stars.svg": "stars",
              "art-test.svg": "test",
              "art-lucky.svg": "lucky",
          }

          for filename, image_type in replacements.items():
              pattern = rf'src=(["\\\'])assets/{re.escape(filename)}\\1'
              html = re.sub(pattern, f'data-ai-image="{image_type}"', html)

              # 다른 위치에 같은 정적 파일 경로가 남아 있으면 API 경로로 바꿉니다.
              html = html.replace(f"assets/{filename}", f"/api/image?type={image_type}")

          # 날짜를 URL에 포함해 날짜가 바뀌면 새 이미지를 만들고, 같은 날짜에는 캐시된 이미지를 사용합니다.
          loader = r'''<script>
  // 정적 이미지 파일 대신 Cloudflare Workers AI에서 오늘의 이미지를 가져옵니다.
  (() => {
    const date = new Date().toISOString().slice(0, 10);
    document.querySelectorAll("[data-ai-image]").forEach((image) => {
      const type = image.dataset.aiImage;
      if (!type) return;
      image.loading = type === "hero" ? "eager" : "lazy";
      image.decoding = "async";
      image.src = `/api/image?type=${encodeURIComponent(type)}&date=${date}`;
    });
  })();
  </script>'''

          if "[data-ai-image]" not in html:
              html = html.replace("</body>", loader + "\n</body>")

          path.write_text(html, encoding="utf-8")

      - name: Remove static image files
        run: rm -f assets/art-zodiac.svg assets/art-stars.svg assets/art-test.svg assets/art-lucky.svg assets/hero-night.svg

      - name: Verify no static image references remain
        shell: bash
        run: |
          if grep -n "assets/.*\.svg" index.html; then
            echo "Static SVG image reference remains in index.html"
            exit 1
          fi

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          if git diff --cached --quiet; then
            echo "No migration changes needed"
            exit 0
          fi
          git commit -m "Use Workers AI for site illustrations"
          git push
