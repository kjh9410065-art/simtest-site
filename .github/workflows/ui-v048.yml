name: Apply v0.00.48 compact home layout

on:
  push:
    branches: [main]
    paths:
      - 'assets/ui-v048.css'
      - 'assets/ui-v048.js'
      - '.github/workflows/ui-v048.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Attach runtime compact layout
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # 기존 v0.00.48 실행 스크립트가 있다면 중복으로 넣지 않는다.
          text = re.sub(r'\n?<script[^>]*assets/ui-v048\.js[^>]*></script>', '', text)

          # body가 끝나기 직전에 최신 보정 스크립트를 넣어 오래된 스타일보다 늦게 실행되게 한다.
          js = '<script src="assets/ui-v048.js?v=0.00.48"></script>'
          if '</body>' in text:
              text = text.replace('</body>', js + '\n</body>', 1)
          else:
              text += '\n' + js

          path.write_text(text, encoding='utf-8')

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('assets/ui-v048.css').read_text(encoding='utf-8')
          js = Path('assets/ui-v048.js').read_text(encoding='utf-8')

          assert html.count('assets/ui-v048.js?v=0.00.48') == 1
          assert 'height:330px!important' in css
          assert 'side-menu-panel{width:360px!important' in css

          # 이 프로젝트는 이모지와 이모지처럼 보이는 장식용 유니코드 문자를 사용하지 않는다.
          blocked = re.compile(r'[\U0001F000-\U0001FFFF\u2190-\u21FF\u2200-\u22FF\u2300-\u23FF\u25A0-\u25FF\u2600-\u27BF\u2900-\u297F\u2B00-\u2BFF]')
          assert not blocked.search(css)
          assert not blocked.search(js)

      - name: Commit index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes needed'
            exit 0
          fi
          git commit -m 'fix: apply compact home layout v0.00.48 [skip ci]'
          git push
