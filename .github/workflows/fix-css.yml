name: Fix CSS
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct selectors
        run: |
          sed -i 's/\.\.choice-grid/\.choice-grid/g; s/\.\.choice{/\.choice{/g' index.html
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: correct fortune choice selectors"
          git push