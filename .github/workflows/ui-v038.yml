name: Apply v0.00.38 UI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply UI assets and clean blocked symbols
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          # 소스에 남아 있는 이모지와 장식용 유니코드 기호를 제거합니다.
          blocked = re.compile(
              r'[\U0001F000-\U0001FFFF\u00D7\u203A\u2190-\u21FF\u2200-\u22FF\u2300-\u23FF\u25A0-\u25FF\u2600-\u27BF\u2900-\u297F\u2B00-\u2BFF]'
          )
          cleaned = blocked.sub('', text)

          # 이전 패치에서 잘못 기록된 정규식 치환 문자열을 실제 버전 문자열로 복구합니다.
          cleaned = cleaned.replace('\\g<1>0.00.38\\g<2>/>', '0.00.38/>')
          cleaned = cleaned.replace('\\g<1>0.00.38\\g<2>', '0.00.38')

          # 중복 리소스를 제거한 뒤 최신 UI 리소스를 한 번만 연결합니다.
          cleaned = re.sub(r'\n?<link[^>]+assets/ui-v038\.css[^>]*>', '', cleaned)
          cleaned = re.sub(r'\n?<script[^>]+assets/ui-v038\.js[^>]*></script>', '', cleaned)

          css_tag = '<link rel="stylesheet" href="assets/ui-v038.css?v=0.00.38">'
          js_tag = '<script defer src="assets/ui-v038.js?v=0.00.38"></script>'

          if '</head>' in cleaned:
              cleaned = cleaned.replace('</head>', css_tag + '\n</head>', 1)
          else:
              cleaned += '\n' + css_tag

          if '</body>' in cleaned:
              cleaned = cleaned.replace('</body>', js_tag + '\n</body>', 1)
          else:
              cleaned += '\n' + js_tag

          if cleaned != text:
              index.write_text(cleaned, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "chore: finish v0.00.38 source cleanup [skip ci]"
          git push
