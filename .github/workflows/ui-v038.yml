name: Apply v0.00.38 UI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply UI assets and clean blocked symbols
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          # 소스에 남아 있는 이모지와 장식용 유니코드 기호를 제거합니다.
          blocked = re.compile(
              r'[\U0001F000-\U0001FFFF\u2190-\u21FF\u2200-\u22FF\u2300-\u23FF\u25A0-\u25FF\u2600-\u27BF\u2900-\u297F\u2B00-\u2BFF]'
          )
          cleaned = blocked.sub('', text)

          # 같은 리소스가 여러 번 삽입되는 것을 막습니다.
          cleaned = re.sub(r'\n?<link[^>]+assets/ui-v038\\.css[^>]*>', '', cleaned)
          cleaned = re.sub(r'\n?<script[^>]+assets/ui-v038\\.js[^>]*></script>', '', cleaned)

          css_tag = '<link rel="stylesheet" href="assets/ui-v038.css?v=0.00.38">'
          js_tag = '<script defer src="assets/ui-v038.js?v=0.00.38"></script>'

          if '</head>' in cleaned:
              cleaned = cleaned.replace('</head>', css_tag + '\n</head>', 1)
          else:
              cleaned += '\n' + css_tag

          if '</body>' in cleaned:
              cleaned = cleaned.replace('</body>', js_tag + '\n</body>', 1)
          else:
              cleaned += '\n' + js_tag

          # 버전 표시를 0.00.38로 통일합니다.
          cleaned = re.sub(r'(<meta[^>]+name=["\']app-version["\'][^>]+content=["\'])[^"\']+(["\'])', r'\\g<1>0.00.38\\g<2>', cleaned)
          cleaned = re.sub(r'(<meta[^>]+content=["\'])[^"\']+(["\'][^>]+name=["\']app-version["\'])', r'\\g<1>0.00.38\\g<2>', cleaned)

          if cleaned != text:
              index.write_text(cleaned, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "chore: apply v0.00.38 source cleanup [skip ci]"
          git push
