name: Install generated result artwork

on:
  push:
    branches: [main]

jobs:
  install-artwork:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install result artwork
        env:
          IMAGE_B64: |
            PLACEHOLDER
        run: |
          printf '%s' "$IMAGE_B64" | base64 -d > assets/results/result-main.jpg
      - name: Commit artwork and remove installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/results/result-main.jpg
          git rm -f .github/workflows/install-result-artwork.yml
          git commit -m "feat: add new result artwork [skip ci]"
          git push
