name: Inject site images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Rebuild homepage presentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          html = re.sub(r'<style>\s*/\* FLICK_HOME_REDESIGN \*/.*?</style>', '', html, flags=re.S)
          html = re.sub(r'<script>\s*/\* FLICK_HOME_REDESIGN_JS \*/.*?</script>', '', html, flags=re.S)
          for version in ('V1','V2','V3','V4','V5','V6','V7','V8'):
              html = re.sub(r'<style>\s*/\* DIRECT_SITE_IMAGE_FIX_' + version + r' \*/.*?</style>', '', html, flags=re.S)

          css = r'''<style>
          /* FLICK_HOME_REDESIGN */
          :root{--fr-ink:#19342b;--fr-muted:#71827b;--fr-green:#2f8f70;--fr-bg:#f5f9f6;--fr-line:#dfece5;--fr-shadow:0 10px 28px rgba(39,86,68,.07)}
          body{background:var(--fr-bg)!important;color:var(--fr-ink)!important}
          .hero,.hero-inner,.quick-grid,.quick-card,.test-card{background-image:none!important}
          .hero{background:linear-gradient(135deg,#eaf6f0,#f8fbf9 52%,#e6f3ec)!important;border:0!important}
          .hero-inner{grid-template-columns:1fr!important;max-width:980px!important;min-height:0!important;padding:18px 20px 22px!important;gap:12px!important}
          .hero-inner>div:first-child{display:none!important}
          .hero-art{height:155px!important;border-radius:20px!important;background:linear-gradient(135deg,#cce9da,#f2f8f4 50%,#c5e3d3)!important;box-shadow:var(--fr-shadow)!important;display:flex!important;align-items:flex-end;justify-content:flex-end;padding:0 7% 18px!important}
          .hero-art:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 24%,rgba(255,255,255,.9) 0 7%,transparent 8%),radial-gradient(circle at 14% 78%,rgba(255,255,255,.55) 0 9%,transparent 10%)}
          .hero-art:after{content:"오늘도, 좋은 하루가 될 거예요";position:absolute;left:7%;top:28%;font-size:clamp(21px,3.2vw,32px);line-height:1.2;font-weight:900;letter-spacing:-1.8px;color:#193d31;max-width:430px}
          .hero-art>*{display:none!important}

          .quick-grid{display:grid!important;grid-template-columns:repeat(4,1fr)!important;gap:10px!important;max-width:980px!important;margin:0 auto!important;padding:16px 20px!important;background:transparent!important}
          .quick-card{min-height:125px!important;border:1px solid var(--fr-line)!important;border-radius:18px!important;background:#fff!important;box-shadow:var(--fr-shadow)!important;padding:16px!important;display:flex!important;flex-direction:column!important;justify-content:flex-end!important;overflow:hidden!important;position:relative!important}
          .quick-card:before{content:"";position:absolute;width:66px;height:66px;border-radius:50%;right:-17px;top:-17px;background:linear-gradient(135deg,#e0f2e8,#f5faf7)}
          .quick-card:nth-child(1):after{content:"○ ○ ○ ○ ○ ○"}.quick-card:nth-child(2):after{content:"◇ ◇ ◇ ◇"}.quick-card:nth-child(3):after{content:"— ○ — ○"}.quick-card:nth-child(4):after{content:"+ · + · +"}
          .quick-card:after{display:block;position:absolute;right:8px;top:10px;width:65px;color:#4b9a79;font-size:12px;line-height:1.7;text-align:center;letter-spacing:1px;opacity:.75}
          .quick-card>*{position:relative;z-index:2}.quick-card h3,.quick-card strong{font-size:16px!important;font-weight:900!important;color:var(--fr-ink)!important;margin:0 0 5px!important}.quick-card p{font-size:10px!important;color:var(--fr-muted)!important;line-height:1.45!important;margin:0!important}.quick-card button,.quick-card .btn{background:#e8f5ee!important;color:#2f805f!important;border-radius:10px!important;height:32px!important;font-size:11px!important;font-weight:900!important;margin-top:8px!important}

          .test-card{background:#fff!important;border:1px solid var(--fr-line)!important;border-radius:18px!important;box-shadow:var(--fr-shadow)!important;overflow:hidden!important;position:relative!important}.test-card:before{content:"";display:block;height:72px;background:linear-gradient(135deg,#e6f4ed,#f7fbf9)}.test-card:after{position:absolute;top:20px;left:20px;font-size:32px;font-weight:300;color:#3e9473}.test-card:nth-child(1):after{content:"○"}.test-card:nth-child(2):after{content:"⌁"}.test-card:nth-child(3):after{content:"◇"}.test-card:nth-child(4):after{content:"+"}.test-card:nth-child(5):after{content:"□"}.test-card>*{position:relative;z-index:2}

          .flick-new-intro{max-width:980px;margin:5px auto 0;padding:0 20px 8px;display:flex;align-items:end;justify-content:space-between}.flick-new-intro strong{font-size:20px;letter-spacing:-1px}.flick-new-intro span{font-size:10px;color:var(--fr-muted)}
          .flick-new-strip{max-width:980px;margin:0 auto 22px;padding:0 20px;display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:10px}.flick-new-strip>div{min-height:66px;border-radius:16px;padding:13px 15px;background:#fff;border:1px solid var(--fr-line);box-shadow:var(--fr-shadow)}.flick-new-strip b{display:block;font-size:12px;margin-bottom:4px}.flick-new-strip small{color:var(--fr-muted);font-size:9px}.flick-new-strip .featured{background:linear-gradient(135deg,#318c6d,#5cae8b);color:#fff}.flick-new-strip .featured small{color:#e9f6ef}
          @media(max-width:760px){.hero-inner{padding:14px 14px 18px!important}.hero-art{height:135px!important;border-radius:17px!important}.hero-art:after{left:7%;top:27%;font-size:22px;max-width:280px}.quick-grid{grid-template-columns:repeat(2,1fr)!important;padding:13px 14px!important;gap:9px!important}.quick-card{min-height:118px!important;padding:14px!important}.quick-card h3,.quick-card strong{font-size:15px!important}.flick-new-intro{padding:0 14px 7px}.flick-new-intro strong{font-size:18px}.flick-new-strip{grid-template-columns:1fr 1fr;padding:0 14px;margin-bottom:18px;gap:9px}.flick-new-strip>div:first-child{grid-column:1/-1}}
          @media(max-width:420px){.quick-grid{gap:7px}.quick-card{min-height:108px!important;padding:12px!important}.quick-card:after{font-size:10px;width:58px}.flick-new-strip>div{padding:12px}}
          </style>'''

          js = r'''<script>
          /* FLICK_HOME_REDESIGN_JS */
          (()=>{
            const root=document.querySelector('.view.active')||document.querySelector('.view');
            if(!root)return;
            if(!root.querySelector('.flick-new-intro')){const intro=document.createElement('div');intro.className='flick-new-intro';intro.innerHTML='<strong>오늘은 어떤 하루일까요?</strong><span>작은 선택이 오늘의 분위기를 바꿔요</span>';const q=root.querySelector('.quick-grid');if(q)q.before(intro)}
            if(!root.querySelector('.flick-new-strip')){const strip=document.createElement('div');strip.className='flick-new-strip';strip.innerHTML='<div class="featured"><b>오늘의 한마디</b><small>서두르지 않아도 괜찮아요. 오늘의 속도로 충분합니다.</small></div><div><b>오늘의 기운</b><small>차분함 · 집중 · 작은 행운</small></div><div><b>행운 포인트</b><small>초록색 · 오후 3시 · 새로운 대화</small></div>';const tests=root.querySelector('.test-card')?.closest('section')||root.querySelector('.test-card')?.parentElement;if(tests)tests.before(strip);else root.appendChild(strip)}
          })();
          </script>'''

          html = html.replace('</head>', css + '</head>', 1)
          html = html.replace('</body>', js + '</body>', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit generated homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Reduce homepage scale and tighten layout"
            git push
          fi
