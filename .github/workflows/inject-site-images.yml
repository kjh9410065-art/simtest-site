name: Inject site images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Remove remaining purple accents
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # 이전 보라색 제거 블록이 있으면 먼저 삭제해 중복 삽입을 막습니다.
          html = re.sub(r'<style>\s*/\* FLICK_PURPLE_FIX \*/.*?</style>', '', html, flags=re.S)

          # 기존 카드 내부의 보라색 아이콘/배경까지 강제로 그린 계열로 통일합니다.
          css = r'''<style>
          /* FLICK_PURPLE_FIX */
          .quick-card:before,
          .quick-card:after,
          .quick-card .icon,
          .quick-card [class*="icon"],
          .quick-card [class*="Icon"]{
            background:#edf4ee!important;
            color:#2f7158!important;
            border-color:#d9e8dd!important;
          }

          .quick-card svg,
          .quick-card svg *{
            color:#2f7158!important;
            stroke:#2f7158!important;
            fill:none!important;
          }

          .quick-card [style*="#7658d8"],
          .quick-card [style*="#7658D8"],
          .quick-card [style*="#f0ebff"],
          .quick-card [style*="#F0EBFF"]{
            background:#edf4ee!important;
            color:#2f7158!important;
            border-color:#d9e8dd!important;
          }

          .quick-card h3,
          .quick-card strong{
            color:#173d30!important;
          }

          .quick-card button,
          .quick-card .btn{
            background:#edf4ee!important;
            color:#2f7158!important;
            border-color:#d9e8dd!important;
          }
          </style>'''

          html = html.replace('</head>', css + '</head>', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit generated homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove remaining purple card accents"
            git push
          fi
