name: Inject site images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Replace homepage image CSS directly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # 이전 이미지 고정 CSS가 있으면 제거해 새 매핑으로 교체합니다.
          html = re.sub(r'<style>\s*/\* DIRECT_SITE_IMAGE_FIX_V1 \*/.*?</style>', '', html, flags=re.S)
          html = re.sub(r'<style>\s*/\* DIRECT_SITE_IMAGE_FIX_V2 \*/.*?</style>', '', html, flags=re.S)
          html = re.sub(r'<style>\s*/\* DIRECT_SITE_IMAGE_FIX_V3 \*/.*?</style>', '', html, flags=re.S)

          css = '''<style>
          /* DIRECT_SITE_IMAGE_FIX_V3 */
          .hero-art{background-image:url("/꿈결%20같은%20태양%20오라클%20카드%20정원.png") !important;background-size:cover !important;background-position:center !important;background-repeat:no-repeat !important;}
          .quick-card{background-size:cover !important;background-position:center !important;background-repeat:no-repeat !important;}
          .quick-card:nth-child(1){background-image:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)),url("/햇살%20가득한%20카페의%20즐거운%20모임.png") !important;}
          .quick-card:nth-child(2){background-image:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)),url("/꽃잎%20흩날리는%20호숫가의%20봄%20풍경.png") !important;}
          .quick-card:nth-child(3){background-image:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)),url("/햇살%20머무는%20바닷가%20작업%20공간.png") !important;}
          .quick-card:nth-child(4){background-image:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)),url("/따뜻한%20햇살%20아래%20온라인%20커뮤니티%20카페.png") !important;}
          </style>'''

          # 실제 존재하는 홈 화면 요소에만 이미지를 적용합니다.
          html = html.replace('</head>', css + '</head>', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove unused community image injection"
            git push
          fi
