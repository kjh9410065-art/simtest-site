name: Inject site images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply unified homepage image styling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # 과거 자동 삽입 버전을 모두 제거해 CSS 충돌을 막습니다.
          for version in ('V1','V2','V3','V4','V5','V6','V7','V8'):
              html = re.sub(r'<style>\s*/\* DIRECT_SITE_IMAGE_FIX_' + version + r' \*/.*?</style>', '', html, flags=re.S)

          # 기존 히어로 문구가 여러 번 들어갔다면 전부 정리합니다.
          html = re.sub(r'<div class="flick-hero-copy">.*?</div>', '', html, flags=re.S)

          css = '''<style>
          /* DIRECT_SITE_IMAGE_FIX_V8 */
          /* 실제 카드 이미지 자체의 색과 선명도를 그대로 보여줍니다. */
          .quick-card,.test-card{
            background-size:cover !important;
            background-position:center !important;
            background-repeat:no-repeat !important;
            filter:none !important;
          }

          /* 홈의 4개 바로가기 카드 매칭 */
          .quick-card:nth-child(1){background-image:url("/file_000000000bac8209a8781428bf1685be.png") !important;}
          .quick-card:nth-child(2){background-image:url("/꽃잎%20흩날리는%20호숫가의%20봄%20풍경.png") !important;}
          .quick-card:nth-child(3){background-image:url("/햇살%20머무는%20바닷가%20작업%20공간.png") !important;}
          .quick-card:nth-child(4){background-image:url("/꿈결%20같은%20태양%20오라클%20카드%20정원.png") !important;}

          /* 메인 영역: 기존 일러스트를 선명하게 사용하고 실제 HTML 문구를 겹칩니다. */
          .hero-art{
            position:relative !important;
            overflow:hidden !important;
            background-image:url("/바다를%20품은%20아늑한%20카페%20공간.png") !important;
            background-size:cover !important;
            background-position:center !important;
            background-repeat:no-repeat !important;
            filter:none !important;
          }
          .flick-hero-copy{
            position:absolute;
            inset:0;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:flex-start;
            padding:30px 42px;
            pointer-events:none;
            z-index:5;
          }
          .flick-hero-copy strong{
            font-size:clamp(24px,3.1vw,40px);
            line-height:1.22;
            letter-spacing:-1.8px;
            color:#28243a;
            font-weight:900;
            max-width:390px;
            text-shadow:0 2px 12px rgba(255,255,255,.75);
          }
          .flick-hero-copy strong em{font-style:normal;color:#7658d8;}
          .flick-hero-copy span{
            margin-top:10px;
            font-size:14px;
            font-weight:700;
            color:#625c70;
            text-shadow:0 1px 8px rgba(255,255,255,.8);
          }
          @media(max-width:700px){
            .flick-hero-copy{padding:24px 28px;justify-content:center;}
            .flick-hero-copy strong{font-size:25px;max-width:250px;}
            .flick-hero-copy span{font-size:12px;max-width:220px;line-height:1.5;}
          }
          </style>'''

          html = html.replace('</head>', css + '</head>', 1)

          # 이미지 안에 글자를 굽지 않고 실제 HTML 요소로 문구를 표시합니다.
          marker = '<div class="hero-art">'
          if marker in html:
              html = html.replace(
                  marker,
                  marker + '<div class="flick-hero-copy"><strong>오늘도, <em>좋은 하루</em>가 될 거예요 ♡</strong><span>작은 변화가 특별한 하루를 만듭니다.</span></div>',
                  1
              )

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unify homepage illustrations and hero copy"
            git push
          fi
