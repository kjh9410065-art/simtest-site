name: Inject site images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply unified image styling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # 기존에 자동 삽입한 이미지 CSS를 모두 제거하고 하나의 기준으로 다시 적용합니다.
          for version in ('V1', 'V2', 'V3', 'V4', 'V5', 'V6'):
              html = re.sub(r'<style>\s*/\* DIRECT_SITE_IMAGE_FIX_' + version + r' \*/.*?</style>', '', html, flags=re.S)

          css = '''<style>
          /* DIRECT_SITE_IMAGE_FIX_V6 */
          /* 모든 카드 이미지는 같은 선명도로 표시합니다. 이미지 위 흰색 막을 최소화합니다. */
          .quick-card,.test-card{
            background-size:cover !important;
            background-position:center !important;
            background-repeat:no-repeat !important;
          }

          /* 메인 히어로 */
          .hero-art{
            background-image:url("/바다를%20품은%20아늑한%20카페%20공간.png") !important;
            background-size:cover !important;
            background-position:center !important;
            background-repeat:no-repeat !important;
          }

          /* 홈 4개 기능 카드: 선명도 통일 */
          .quick-card:nth-child(1){background-image:linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,.15)),url("/file_000000000bac8209a8781428bf1685be.png") !important;}
          .quick-card:nth-child(2){background-image:linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,.15)),url("/꽃잎%20흩날리는%20호숫가의%20봄%20풍경.png") !important;}
          .quick-card:nth-child(3){background-image:linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,.15)),url("/햇살%20머무는%20바닷가%20작업%20공간.png") !important;}
          .quick-card:nth-child(4){background-image:linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,.15)),url("/따뜻한%20햇살%20아래%20온라인%20커뮤니티%20카페.png") !important;}
          </style>'''

          html = html.replace('</head>', css + '</head>', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unify site image clarity"
            git push
          fi
