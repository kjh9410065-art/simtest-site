name: Inject site images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply compact fortune portal styling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('index.html')
          html=path.read_text(encoding='utf-8')
          html=re.sub(r'<style>\s*/\* FLICK_COMPACT_PORTAL \*/.*?</style>','',html,flags=re.S)
          css=r'''<style>
          /* FLICK_COMPACT_PORTAL */
          /* 섹션 사이와 카드 사이의 불필요한 공백을 전체적으로 줄입니다. */
          .flick-fortune-wrap{padding-top:18px!important;padding-bottom:22px!important}
          .fortune-heading{padding-bottom:10px!important;margin-bottom:8px!important}
          .fortune-main{margin-bottom:7px!important;gap:7px!important}
          .fortune-summary{min-height:145px!important;padding:17px 19px!important}
          .fortune-summary h2{margin:5px 0 4px!important;font-size:22px!important}
          .fortune-summary p{line-height:1.5!important}
          .fortune-score{margin-top:9px!important}
          .fortune-luck{min-height:145px!important;padding:14px 16px!important}
          .fortune-luck h3{margin-bottom:6px!important}
          .luck-list{gap:3px!important}
          .luck-item{padding:5px 2px!important}
          .fortune-section-title{margin:10px 0 6px!important}
          .fortune-section-title b{font-size:14px!important}
          .fortune-metrics{gap:6px!important}
          .metric{padding:10px 11px!important;border-radius:12px!important}
          .metric b{margin-top:3px!important;font-size:12px!important}
          .metric i{margin-top:1px!important;font-size:8px!important}
          .quick-grid{gap:6px!important}
          .quick-card{min-height:104px!important;padding:12px!important;border-radius:14px!important}
          .quick-card .card-mark{width:34px!important;height:34px!important;margin-bottom:6px!important}
          .quick-card .card-mark:before{left:8px!important;top:8px!important;width:17px!important;height:17px!important}
          .quick-card .card-mark.dot:after{left:15px!important;top:15px!important}
          .quick-card strong{font-size:13px!important;margin-bottom:2px!important}
          .quick-card span{font-size:8px!important;line-height:1.35!important}
          .quick-card .card-action{height:26px!important;margin-top:5px!important;font-size:9px!important}
          .zodiac-panel{padding:9px!important;gap:2px!important}
          .zodiac-item{padding:5px 1px!important}
          .zodiac-item b{font-size:14px!important;margin-bottom:1px!important}
          .keyword-panel{gap:5px!important}
          .keyword{padding:5px 8px!important;font-size:8px!important}
          .test-grid{gap:6px!important}
          .test-card{min-height:145px!important;padding:13px!important}
          .section{padding-top:30px!important;padding-bottom:30px!important}
          .section-head{margin-bottom:9px!important}
          .section-head h2{font-size:20px!important}
          .section-head p{margin-top:3px!important}
          .fortune-grid{gap:7px!important}
          .fortune-card{min-height:135px!important;padding:17px!important}
          .lucky-banner{padding:22px!important}
          @media(max-width:760px){
            .flick-fortune-wrap{padding:13px 12px 16px!important}
            .fortune-heading{padding-bottom:7px!important;margin-bottom:6px!important}
            .fortune-heading h1{font-size:22px!important}
            .fortune-date{padding:4px 7px!important}
            .fortune-summary,.fortune-luck{min-height:0!important}
            .fortune-summary{padding:14px 15px!important}
            .fortune-summary h2{font-size:19px!important}
            .fortune-score{margin-top:7px!important}
            .score-ring{width:40px!important;height:40px!important}
            .fortune-luck{padding:12px 14px!important}
            .fortune-section-title{margin:8px 0 5px!important}
            .fortune-metrics{gap:5px!important}
            .metric{padding:9px!important}
            .quick-grid{gap:5px!important}
            .quick-card{min-height:96px!important;padding:10px!important}
            .quick-card .card-mark{width:31px!important;height:31px!important}
            .quick-card .card-mark:before{left:7px!important;top:7px!important;width:15px!important;height:15px!important}
            .quick-card .card-mark.dot:after{left:13px!important;top:13px!important}
            .quick-card strong{font-size:12px!important}
            .quick-card span{font-size:7.5px!important}
            .quick-card .card-action{height:24px!important;margin-top:4px!important;font-size:8px!important}
            .zodiac-panel{padding:7px!important}
            .zodiac-item{padding:4px 1px!important}
            .zodiac-item b{font-size:13px!important}
            .keyword{padding:4px 7px!important}
          }
          </style>'''
          html=html.replace('</head>',css+'</head>',1)
          path.write_text(html,encoding='utf-8')
          PY

      - name: Commit generated homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Tighten homepage spacing"
            git push
          fi
