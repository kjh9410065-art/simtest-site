name: Inject site images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Rearrange existing site images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # 이전에 자동으로 삽입한 이미지 매핑을 제거한 뒤 현재 홈 구조에 맞춰 다시 배치합니다.
          for version in ('V1', 'V2', 'V3', 'V4'):
              html = re.sub(r'<style>\s*/\* DIRECT_SITE_IMAGE_FIX_' + version + r' \*/.*?</style>', '', html, flags=re.S)

          css = '''<style>
          /* DIRECT_SITE_IMAGE_FIX_V4 */
          /* 메인 히어로: 밝고 편안한 카페 풍경을 사용합니다. */
          .hero-art{background-image:url("/바다를%20품은%20아늑한%20카페%20공간.png") !important;background-size:cover !important;background-position:center !important;background-repeat:no-repeat !important;}

          /* 홈의 4개 기능 카드: 기존 이미지 중 각 기능의 분위기에 맞춰 재배치합니다. */
          .quick-card{background-size:cover !important;background-position:center !important;background-repeat:no-repeat !important;}
          .quick-card:nth-child(1){background-image:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)),url("/햇살%20가득한%20카페의%20즐거운%20모임.png") !important;}
          .quick-card:nth-child(2){background-image:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)),url("/꽃잎%20흩날리는%20호숫가의%20봄%20풍경.png") !important;}
          .quick-card:nth-child(3){background-image:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)),url("/햇살%20머무는%20바닷가%20작업%20공간.png") !important;}
          .quick-card:nth-child(4){background-image:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)),url("/따뜻한%20햇살%20아래%20온라인%20커뮤니티%20카페.png") !important;}
          </style>'''

          html = html.replace('</head>', css + '</head>', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Rearrange existing images for homepage"
            git push
          fi
