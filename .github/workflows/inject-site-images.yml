name: Inject site images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply compact fortune portal styling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('index.html')
          html=path.read_text(encoding='utf-8')
          html=re.sub(r'<style>\s*/\* FLICK_COMPACT_PORTAL \*/.*?</style>','',html,flags=re.S)
          html=re.sub(r'<style>\s*/\* FLICK_PSYCHOLOGY_RICH \*/.*?</style>','',html,flags=re.S)
          html=re.sub(r'<script>\s*/\* FLICK_PSYCHOLOGY_RICH_JS \*/.*?</script>','',html,flags=re.S)
          css=r'''<style>
          /* FLICK_COMPACT_PORTAL */
          .flick-fortune-wrap{padding-top:18px!important;padding-bottom:22px!important}.fortune-heading{padding-bottom:10px!important;margin-bottom:8px!important}.fortune-main{margin-bottom:7px!important;gap:7px!important}.fortune-summary{min-height:145px!important;padding:17px 19px!important}.fortune-summary h2{margin:5px 0 4px!important;font-size:22px!important}.fortune-summary p{line-height:1.5!important}.fortune-score{margin-top:9px!important}.fortune-luck{min-height:145px!important;padding:14px 16px!important}.fortune-luck h3{margin-bottom:6px!important}.luck-list{gap:3px!important}.luck-item{padding:5px 2px!important}.fortune-section-title{margin:10px 0 6px!important}.fortune-section-title b{font-size:14px!important}.fortune-metrics{gap:6px!important}.metric{padding:10px 11px!important;border-radius:12px!important}.metric b{margin-top:3px!important;font-size:12px!important}.metric i{margin-top:1px!important;font-size:8px!important}.quick-grid{gap:6px!important}.quick-card{min-height:104px!important;padding:12px!important;border-radius:14px!important}.quick-card .card-mark{width:34px!important;height:34px!important;margin-bottom:6px!important}.quick-card .card-mark:before{left:8px!important;top:8px!important;width:17px!important;height:17px!important}.quick-card .card-mark.dot:after{left:15px!important;top:15px!important}.quick-card strong{font-size:13px!important;margin-bottom:2px!important}.quick-card span{font-size:8px!important;line-height:1.35!important}.quick-card .card-action{height:26px!important;margin-top:5px!important;font-size:9px!important}.zodiac-panel{padding:9px!important;gap:2px!important}.zodiac-item{padding:5px 1px!important}.zodiac-item b{font-size:14px!important;margin-bottom:1px!important}.keyword-panel{gap:5px!important}.keyword{padding:5px 8px!important;font-size:8px!important}.test-grid{gap:6px!important}.test-card{min-height:145px!important;padding:13px!important}.section{padding-top:30px!important;padding-bottom:30px!important}.section-head{margin-bottom:9px!important}.section-head h2{font-size:20px!important}.section-head p{margin-top:3px!important}.fortune-grid{gap:7px!important}.fortune-card{min-height:135px!important;padding:17px!important}.lucky-banner{padding:22px!important}
          @media(max-width:760px){.flick-fortune-wrap{padding:13px 12px 16px!important}.fortune-heading{padding-bottom:7px!important;margin-bottom:6px!important}.fortune-heading h1{font-size:22px!important}.fortune-date{padding:4px 7px!important}.fortune-summary,.fortune-luck{min-height:0!important}.fortune-summary{padding:14px 15px!important}.fortune-summary h2{font-size:19px!important}.fortune-score{margin-top:7px!important}.score-ring{width:40px!important;height:40px!important}.fortune-luck{padding:12px 14px!important}.fortune-section-title{margin:8px 0 5px!important}.fortune-metrics{gap:5px!important}.metric{padding:9px!important}.quick-grid{gap:5px!important}.quick-card{min-height:96px!important;padding:10px!important}.quick-card .card-mark{width:31px!important;height:31px!important}.quick-card .card-mark:before{left:7px!important;top:7px!important;width:15px!important;height:15px!important}.quick-card .card-mark.dot:after{left:13px!important;top:13px!important}.quick-card strong{font-size:12px!important}.quick-card span{font-size:7.5px!important}.quick-card .card-action{height:24px!important;margin-top:4px!important;font-size:8px!important}.zodiac-panel{padding:7px!important}.zodiac-item{padding:4px 1px!important}.zodiac-item b{font-size:13px!important}.keyword{padding:4px 7px!important}}
          </style>'''
          psychology=r'''<section class="flick-psychology-rich" aria-label="심리테스트">
            <div class="psych-rich-head"><div><span class="psych-eyebrow">PSYCHOLOGY TEST</span><h2>심리테스트</h2><p>가볍게 골라보는 나의 성향과 마음</p></div><span class="psych-count">13가지 테스트</span></div>
            <div class="psych-category-tabs"><button class="active" data-psych-filter="all">전체</button><button data-psych-filter="love">연애</button><button data-psych-filter="personality">성격</button><button data-psych-filter="mind">마음</button><button data-psych-filter="life">생활</button><button data-psych-filter="fun">재미</button></div>
            <div class="psych-rich-grid">
              <button class="psych-rich-card" data-psych-cat="love"><span class="psych-no">01</span><b>연애할 때 나는?</b><small>사랑 앞에서 드러나는 나의 연애 성향</small><em>연애 · 3분</em></button>
              <button class="psych-rich-card" data-psych-cat="personality"><span class="psych-no">02</span><b>나도 몰랐던 성격</b><small>평소 선택으로 알아보는 숨은 성격</small><em>성격 · 3분</em></button>
              <button class="psych-rich-card" data-psych-cat="mind"><span class="psych-no">03</span><b>지금 내 마음의 온도</b><small>최근 감정 상태와 마음의 여유를 확인</small><em>마음 · 2분</em></button>
              <button class="psych-rich-card" data-psych-cat="love"><span class="psych-no">04</span><b>나는 어떤 사람에게 끌릴까?</b><small>나의 이상형과 관계 취향을 살펴보기</small><em>연애 · 3분</em></button>
              <button class="psych-rich-card" data-psych-cat="personality"><span class="psych-no">05</span><b>갈등이 생겼을 때 나는?</b><small>관계 속에서 나타나는 나의 대처 방식</small><em>성격 · 3분</em></button>
              <button class="psych-rich-card" data-psych-cat="mind"><span class="psych-no">06</span><b>나의 스트레스 신호</b><small>무심코 하는 행동으로 알아보는 스트레스 유형</small><em>마음 · 2분</em></button>
              <button class="psych-rich-card" data-psych-cat="life"><span class="psych-no">07</span><b>나의 소비 성향은?</b><small>돈을 쓸 때 드러나는 나만의 선택 패턴</small><em>생활 · 3분</em></button>
              <button class="psych-rich-card" data-psych-cat="life"><span class="psych-no">08</span><b>나는 계획형일까 즉흥형일까?</b><small>일상 속 선택으로 알아보는 행동 스타일</small><em>생활 · 2분</em></button>
              <button class="psych-rich-card" data-psych-cat="fun"><span class="psych-no">09</span><b>좀비가 나타난다면 나는?</b><small>갑작스러운 위기에서 드러나는 생존 스타일</small><em>재미 · 2분</em></button>
              <button class="psych-rich-card" data-psych-cat="fun"><span class="psych-no">10</span><b>갑자기 100억이 생긴다면?</b><small>돈이 생겼을 때 가장 먼저 드러나는 욕망</small><em>재미 · 2분</em></button>
              <button class="psych-rich-card" data-psych-cat="fun"><span class="psych-no">11</span><b>내가 판타지 세계에 떨어진다면?</b><small>선택으로 알아보는 나의 판타지 직업 유형</small><em>재미 · 3분</em></button>
              <button class="psych-rich-card" data-psych-cat="fun"><span class="psych-no">12</span><b>내가 악당이라면 어떤 타입?</b><small>숨겨진 성격으로 알아보는 나만의 빌런 유형</small><em>재미 · 2분</em></button>
              <button class="psych-rich-card" data-psych-cat="fun"><span class="psych-no">13</span><b>로또 1등 당첨 후 첫 행동은?</b><small>첫 선택으로 알아보는 현실 욕망 테스트</small><em>재미 · 2분</em></button>
            </div>
          </section>'''
          psych_css=r'''<style>
          /* FLICK_PSYCHOLOGY_RICH */
          .flick-psychology-rich{max-width:1180px;margin:0 auto;padding:25px 28px 30px;position:relative}.psych-rich-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;padding-bottom:10px;border-bottom:1px solid #e5dfd1}.psych-eyebrow{display:block;color:#559579;font-size:8px;font-weight:900;letter-spacing:2px;margin-bottom:4px}.psych-rich-head h2{margin:0;color:#173d30;font-size:24px;letter-spacing:-1.2px}.psych-rich-head p{margin:3px 0 0;color:#8a8d87;font-size:10px}.psych-count{font-size:9px;font-weight:800;color:#7c735f;background:#f4efe3;border:1px solid #e4dccb;border-radius:20px;padding:6px 9px}.psych-category-tabs{display:flex;gap:5px;padding:9px 0 10px;overflow:auto}.psych-category-tabs button{flex:0 0 auto;height:27px;padding:0 11px;border-radius:15px;background:#faf7ee;border:1px solid #e4dfd3;color:#85867e;font-size:9px;font-weight:800}.psych-category-tabs button.active{background:#edf4ee;border-color:#d4e4d9;color:#2f7158}.psych-rich-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.psych-rich-card{position:relative;text-align:left;min-height:128px;padding:15px;border:1px solid #e5e0d5;border-radius:15px;background:linear-gradient(145deg,#fffdf8,#faf7ee);box-shadow:0 8px 20px rgba(50,68,56,.045);transition:transform .18s,box-shadow .18s,border-color .18s}.psych-rich-card:after{content:"";position:absolute;right:11px;top:11px;width:25px;height:25px;border:1px solid #d9e8dd;border-radius:50%;opacity:.8}.psych-rich-card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(50,68,56,.09);border-color:#cddfd3}.psych-no{display:inline-block;color:#b89a5b;font-size:8px;font-weight:900;letter-spacing:1.2px;margin-bottom:17px}.psych-rich-card b{display:block;color:#173d30;font-size:14px;letter-spacing:-.5px;margin-bottom:5px}.psych-rich-card small{display:block;color:#85877f;font-size:9px;line-height:1.5;padding-right:8px}.psych-rich-card em{display:inline-block;margin-top:10px;color:#559579;font-size:8px;font-style:normal;font-weight:800}.psych-rich-card.is-hidden{display:none}@media(max-width:760px){.flick-psychology-rich{padding:20px 12px 24px}.psych-rich-head h2{font-size:20px}.psych-rich-grid{grid-template-columns:repeat(2,1fr);gap:6px}.psych-rich-card{min-height:120px;padding:12px;border-radius:13px}.psych-no{margin-bottom:13px}.psych-rich-card b{font-size:12px}.psych-rich-card small{font-size:8px}.psych-rich-card em{margin-top:8px}}
          </style>'''
          psych_js=r'''<script>
          /* FLICK_PSYCHOLOGY_RICH_JS */
          document.addEventListener('DOMContentLoaded',()=>{const grid=document.querySelector('.quick-grid');if(!grid)return;grid.insertAdjacentHTML('afterend',`''' + psychology.replace('`','\\`') + r'''`);const root=document.querySelector('.flick-psychology-rich');if(!root)return;root.querySelectorAll('[data-psych-filter]').forEach(tab=>tab.addEventListener('click',()=>{root.querySelectorAll('[data-psych-filter]').forEach(x=>x.classList.remove('active'));tab.classList.add('active');const f=tab.dataset.psychFilter;root.querySelectorAll('.psych-rich-card').forEach(card=>card.classList.toggle('is-hidden',f!=='all'&&card.dataset.psychCat!==f));}));});
          </script>'''
          html=html.replace('</head>',css+psych_css+'</head>',1)
          html=html.replace('</body>',psych_js+'</body>',1)
          path.write_text(html,encoding='utf-8')
          PY

      - name: Commit generated homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add fun psychology tests"
            git push
          fi
