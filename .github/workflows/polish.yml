name: One-time UI polish

on:
  push:
    paths:
      - '.github/workflows/polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply responsive polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
/* 최종 반응형 보정입니다. 실제 기기에서 발생하는 안전 영역과 터치 환경을 고려합니다. */
html{min-height:100%;scroll-padding-top:76px}
body{-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{touch-action:manipulation}
.home-hero,.fortune-page,.lucky-page{min-height:calc(100svh - 76px)}
.hero-art,.hero-copy{min-width:0}
.hero-art img{aspect-ratio:16/10;object-fit:cover}
.quick-card,.test-card,.test-select,.fortune-card,.choice,.answer,.result-card,.lucky-main{min-width:0}
@media (hover:hover) and (pointer:fine){.primary-btn,.secondary-btn,.more,.back,.nav button,.head-actions button,.menu-list button,.test-body button,.test-select button{transition:transform .16s,opacity .16s,background .16s}.primary-btn:hover,.secondary-btn:hover,.more:hover{transform:translateY(-1px)}}
@media (min-width:721px) and (max-width:1180px){.header{padding-left:24px;padding-right:24px}.nav{gap:11px}.nav button{font-size:12px}.hero-inner{padding-left:34px;padding-right:34px;gap:26px}.section,.quick{padding-left:34px;padding-right:34px}}
@media (max-width:720px){html{scroll-padding-top:64px}.home-hero,.fortune-page,.lucky-page{min-height:calc(100svh - 64px)}.header{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}.hero-inner,.section,.quick,.fortune-inner,.subview,.lucky-wrap{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}.hero-art img{aspect-ratio:16/10}.quick-card,.test-card{border-radius:18px}.quick-copy .card-action,.test-body button{min-height:40px}.fortune-card{align-items:flex-start}.fortune-card .date-art{margin-top:1px}.panel{width:100%;max-height:calc(100svh - 24px);margin-top:max(12px,env(safe-area-inset-top));border-radius:20px}.overlay{padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}}
@media (max-width:900px) and (orientation:landscape) and (max-height:600px){.home-hero,.fortune-page,.lucky-page{min-height:calc(100svh - 58px)}.hero-inner{padding-left:30px;padding-right:30px}.quick,.section,.fortune-inner,.subview,.lucky-wrap{padding-left:30px;padding-right:30px}.fortune-inner,.subview,.lucky-wrap{padding-top:24px;padding-bottom:50px}.quick-grid{grid-template-columns:repeat(4,1fr)}.test-grid{grid-template-columns:repeat(4,1fr)}.test-card img{height:110px}}
@media (min-width:1400px){.header{padding-left:64px;padding-right:64px}.section-title h2{font-size:28px}.quick-card img{height:170px}.test-card img{height:185px}}
@media (max-width:390px){.brand small{display:none}.hero h1{font-size:clamp(34px,11vw,46px)}.section-title{gap:12px}.section-title p{font-size:11px}.fortune-card .date-art{width:92px;height:74px;flex-basis:92px}.question h2{font-size:18px}}
'''
          js = r'''
/* 최종 사용성 보정입니다. 카드 터치, 검색 키보드 사용, 현재 메뉴 상태를 보강합니다. */
(function(){
  document.querySelectorAll('.nav button').forEach(function(btn){btn.setAttribute('aria-current',btn.classList.contains('active')?'page':'false')});
  const originalShowView=showView;
  showView=function(id){originalShowView(id);document.querySelectorAll('.nav button').forEach(function(btn){btn.setAttribute('aria-current',btn.dataset.view===id?'page':'false')})};
  document.addEventListener('click',function(e){const card=e.target.closest('.quick-card,.test-card');if(!card||e.target.closest('button,a'))return;const action=card.querySelector('[data-view],[data-start]');if(action)action.click()});
  const searchInput=document.getElementById('searchInput');
  if(searchInput)searchInput.addEventListener('keydown',function(e){if(e.key==='Enter'){const first=document.querySelector('#searchResults [data-search-index]');if(first)first.click()}});
})();
'''
          if '/* 최종 반응형 보정입니다.' not in s: s=s.replace('</style>',css+'\n</style>',1)
          if '/* 최종 사용성 보정입니다.' not in s: s=s.replace('</script>',js+'\n</script>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit polished site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: polish responsive experience"
          git push
