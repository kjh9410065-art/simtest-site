name: Mira final visual polish

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Decorate fortune portal"]
    types: [completed]

permissions:
  contents: write

jobs:
  polish:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message != 'Apply Mira final visual polish') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Apply final Mira portal design
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # 같은 패치가 여러 번 쌓이지 않도록 기존 최종 디자인을 먼저 제거한다.
          html = re.sub(r'<style>\s*/\* MIRA_FINAL_VISUAL \*/.*?</style>', '', html, flags=re.S)

          css = r'''<style>
          /* MIRA_FINAL_VISUAL */
          :root{
            --mira-bg:#f7f3e9;--mira-paper:#fffdf8;--mira-green:#5d9478;--mira-deep:#214a3a;
            --mira-soft:#edf5ef;--mira-gold:#b49a62;--mira-border:#e0dacb;
          }
          body{background:var(--mira-bg)!important;color:var(--mira-deep)!important}
          .header{height:66px!important;background:rgba(255,253,248,.97)!important;border-bottom:1px solid #e4dece!important;box-shadow:0 3px 18px rgba(45,65,51,.035)!important}
          .brand strong{font-family:Georgia,'Times New Roman',serif!important;font-size:22px!important;letter-spacing:-1.4px!important;color:var(--mira-deep)!important}
          .brand small{font-size:8px!important;color:#849188!important;letter-spacing:0!important}
          .nav{gap:25px!important}.nav button{font-size:11px!important;color:#78857d!important}.nav button.active{color:var(--mira-deep)!important;border-bottom-color:var(--mira-green)!important}
          .head-actions button{background:#fffdf8!important;border-color:#e2ddcf!important;border-radius:50%!important}

          .hero{background:#f1f4e9!important;border-bottom:0!important}
          .hero-inner{max-width:1160px!important;min-height:300px!important;padding:30px 22px 30px!important;gap:30px!important}
          .eyebrow{color:#6a927c!important;font-size:9px!important;letter-spacing:2px!important;margin-bottom:10px!important}
          .hero h1{font-family:Georgia,'Noto Serif KR',serif!important;color:var(--mira-deep)!important;font-size:clamp(36px,4.3vw,56px)!important;line-height:1.14!important;letter-spacing:-3px!important;margin-bottom:12px!important}
          .hero h1 em{color:var(--mira-green)!important}.hero p{color:#68766d!important;font-size:13px!important;line-height:1.65!important;margin-bottom:17px!important}
          .primary{background:#5a9276!important;border-radius:12px!important;height:43px!important;box-shadow:0 7px 16px rgba(67,115,89,.13)!important}.secondary{height:43px!important;border-radius:12px!important;background:#fffdf8!important;color:#466b59!important}
          .hero-art{height:245px!important;border-radius:24px!important;border:1px solid #dce4d8!important;box-shadow:0 12px 28px rgba(52,75,59,.08)!important;background-size:cover!important;background-position:center!important}

          .flick-fortune-wrap{background:var(--mira-bg)!important}
          .fortune-heading{padding-top:24px!important;border-bottom-color:#ddd7c8!important}.fortune-heading h1{color:var(--mira-deep)!important}
          .fortune-date{background:#edf5ef!important;border-color:#d5e5d9!important;color:#5a806c!important}
          .fortune-summary,.fortune-luck{background:var(--mira-paper)!important;border:1px solid var(--mira-border)!important;border-radius:18px!important;box-shadow:0 7px 20px rgba(50,67,55,.045)!important}
          .fortune-summary:after{display:none!important}.fortune-summary h2,.fortune-luck h3{color:var(--mira-deep)!important}.fortune-summary p{color:#718078!important}
          .metric{background:#f3f7f1!important;border-color:#e1e1d6!important}.metric b{color:#4c8369!important}.metric i{color:#a18d61!important}

          .quick-grid{gap:10px!important;margin-top:12px!important}
          .quick-card{position:relative!important;overflow:hidden!important;min-height:116px!important;background:var(--mira-paper)!important;border:1px solid var(--mira-border)!important;border-radius:18px!important;box-shadow:0 7px 18px rgba(50,67,55,.05)!important;padding:15px!important}
          .quick-card:before{content:''!important;position:absolute!important;right:0!important;top:0!important;width:39%!important;height:100%!important;background:#eef5ef!important;border-left:1px solid #e0e8df!important;opacity:1!important;z-index:0!important}
          .quick-card:after{content:''!important;position:absolute!important;right:8%!important;top:17%!important;width:27%!important;height:66%!important;border-radius:15px!important;background-repeat:no-repeat!important;background-position:center!important;background-size:cover!important;opacity:.96!important;z-index:1!important;box-shadow:0 5px 12px rgba(57,78,62,.06)!important}
          .quick-card:nth-child(1):after{background-image:url('/assets/fortune-orbit.svg')!important}
          .quick-card:nth-child(2):after{background-image:url('/assets/바다를 품은 아늑한 카페 공간.png')!important}
          .quick-card:nth-child(3):after{background-image:url('/assets/햇살 가득한 MBTI 아지트.png')!important}
          .quick-card:nth-child(4):after{background-image:url('/assets/따뜻한 햇살 아래 온라인 커뮤니티 카페.png')!important}
          .quick-card>*{position:relative!important;z-index:3!important}.quick-card strong{color:var(--mira-deep)!important}.quick-card span{color:#78837d!important}
          .quick-card .card-action{height:27px!important;border-radius:9px!important;background:#eaf3ed!important;border:1px solid #d1e2d7!important;color:#4e8068!important;font-weight:900!important}

          .zodiac-panel{background:var(--mira-paper)!important;border:1px solid var(--mira-border)!important;border-radius:18px!important;box-shadow:0 7px 18px rgba(50,67,55,.04)!important}
          .zodiac-item{border-radius:14px!important}.zodiac-item b{color:#4f7e68!important}.zodiac-item span{color:#69776f!important}
          .keyword-panel{border-top-color:#ddd7c8!important}.keyword{background:#eef5ef!important;border-color:#d8e5dc!important;color:#527c67!important}

          .flick-psychology-rich{background:#faf7ef!important;border-top:1px solid #dfd9cb!important;border-bottom:1px solid #dfd9cb!important}
          .psych-rich-head h2{font-family:Georgia,'Noto Serif KR',serif!important;color:var(--mira-deep)!important}.psych-rich-head p{color:#78847c!important}
          .psych-count{background:#f3ead8!important;border-color:#dfd1b5!important;color:#8a7345!important}
          .psych-category-tabs{gap:7px!important}.psych-category-tabs button{background:#fffdf8!important;border-color:#ddd8cc!important;color:#7a847d!important;border-radius:999px!important}.psych-category-tabs button.active{background:#eaf4ee!important;border-color:#cfe0d5!important;color:#44765e!important}
          .psych-rich-card{background:var(--mira-paper)!important;border:1px solid var(--mira-border)!important;border-radius:17px!important;box-shadow:0 7px 18px rgba(50,67,55,.045)!important;overflow:hidden!important}
          .psych-rich-card:hover{border-color:#bfd7c7!important}.psych-rich-card b{color:var(--mira-deep)!important}.psych-rich-card small{color:#77827b!important}.psych-rich-card em{color:#4e8268!important}
          .psych-rich-card:after{display:none!important}.psych-rich-card:before{opacity:.11!important}
          .flick-visual-divider{margin:10px auto!important}.flick-visual-divider>div{background:#edf5ef!important;border-color:#d6e3da!important}.flick-visual-divider b{color:#2f5e4a!important}

          /* 카드에 남아 있는 추상 도형은 줄이고 실제 이미지 영역을 살린다. */
          .metric:before,.metric:after{opacity:.08!important}
          @media(max-width:760px){
            .header{height:58px!important;padding:0 12px!important}.brand strong{font-size:18px!important}.brand small{font-size:7px!important}.nav{gap:9px!important}.nav button{font-size:9px!important}.head-actions{gap:5px!important}.head-actions button{width:33px!important;height:33px!important}
            .hero-inner{display:block!important;padding:17px 14px 20px!important;min-height:0!important}.eyebrow{margin-bottom:7px!important}.hero h1{font-size:31px!important;letter-spacing:-2.3px!important;margin-bottom:8px!important}.hero p{font-size:11px!important;line-height:1.55!important;margin-bottom:12px!important}.primary,.secondary{height:38px!important;padding:0 13px!important;font-size:10px!important}.hero-art{height:168px!important;margin-top:13px!important;border-radius:17px!important}
            .fortune-heading{padding-top:17px!important}.quick-grid{gap:8px!important}.quick-card{min-height:112px!important;padding:12px!important;border-radius:16px!important}.quick-card:before{width:38%!important}.quick-card:after{right:5%!important;width:27%!important;height:60%!important;top:20%!important}.quick-card .card-action{height:26px!important;font-size:10px!important}
            .zodiac-panel{border-radius:16px!important}.zodiac-item{padding:7px 2px!important}.keyword{font-size:10px!important;padding:7px 10px!important}
            .psych-rich-card{min-height:116px!important;border-radius:16px!important}.psych-category-tabs{overflow-x:auto!important;flex-wrap:nowrap!important;padding-bottom:4px!important}
          }
          </style>'''

          html = html.replace('</head>', css + '</head>', 1)
          # 사이트의 실제 브랜드는 Mira로 통일하고 내부 장식 문구만 정리한다.
          html = html.replace('FLICK FORTUNE GUIDE','FORTUNE GUIDE').replace('FLiCK 오늘의 운세','오늘의 운세')
          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit Mira final visual polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No final visual changes"
          else
            git commit -m "Apply Mira final visual polish"
            git push
          fi
