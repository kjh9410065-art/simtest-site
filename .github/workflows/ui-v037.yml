name: Apply UI polish v0.00.37

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ui-v037:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject v0.00.37 stylesheet
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          href = 'assets/ui-v037.css?v=0.00.37'
          tag = f'<link rel="stylesheet" href="{href}">'
          if href not in s:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('ERROR: </head> not found')
              s = s.replace(marker, tag + '\n' + marker, 1)
              p.write_text(s, encoding="utf-8")
              print('Injected v0.00.37 stylesheet')
          else:
              print('v0.00.37 stylesheet already present')

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          assert 'assets/ui-v037.css?v=0.00.37' in s
          print('UI v0.00.37 validation passed')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: apply home UI polish v0.00.37 [ui-v037]"
            git push
          fi
