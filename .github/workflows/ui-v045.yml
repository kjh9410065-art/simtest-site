name: Apply v0.00.45 final responsive home UI

on:
  push:
    branches: [main]
    paths:
      - 'assets/ui-v045.css'
      - 'assets/ui-v045.js'
      - '.github/workflows/ui-v045.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Inject final home UI assets
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css = '<link rel="stylesheet" href="assets/ui-v045.css?v=0.00.45">'
          js = '<script src="assets/ui-v045.js?v=0.00.45"></script>'

          # CSS는 head 안에 넣어 기존 스타일보다 마지막에 적용되게 한다.
          if css not in text:
              text = text.replace('</head>', css + '\n</head>', 1)

          # JS는 body 끝에 넣어 기존 테스트 데이터가 준비된 뒤 실행되게 한다.
          if js not in text:
              text = text.replace('</body>', js + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate final UI assets
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('assets/ui-v045.css').read_text(encoding='utf-8')
          js = Path('assets/ui-v045.js').read_text(encoding='utf-8')

          assert 'assets/ui-v045.css?v=0.00.45' in html
          assert 'assets/ui-v045.js?v=0.00.45' in html
          assert 'assets/tests_nonhuman/love-art.jpg' in js
          assert 'assets/ui/quick-lucky.svg' in js
          assert 'orientation:landscape' in css
          assert 'min-width:1200px' in css

          # 이미지나 코드에 이모지 및 장식용 유니코드 기호가 들어가지 않도록 검사한다.
          forbidden = re.compile(r'[\U0001F000-\U0001FFFF\u2190-\u21FF\u2200-\u22FF\u2300-\u23FF\u25A0-\u25FF\u2600-\u27BF\u2900-\u297F\u2B00-\u2BFF]')
          assert not forbidden.search(css)
          assert not forbidden.search(js)

      - name: Commit final UI injection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: apply final responsive home UI v0.00.45 [skip ci]'
          git push
