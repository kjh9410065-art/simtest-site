name: Homepage visual polish

on:
  push:
    branches: [main]

jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply homepage visual design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* 레퍼런스 이미지 기준의 최종 홈 디자인입니다. */'
          if marker not in s:
              css = r'''
              /* 레퍼런스 이미지 기준의 최종 홈 디자인입니다. */
              :root{--ink:#20213b;--navy:#111a49;--navy2:#222b68;--purple:#7656df;--purple2:#a98cf4;--pink:#d86caa;--bg:#f4f5fa;--muted:#777b92;--line:#e5e6ee;--shadow:0 16px 42px rgba(22,27,67,.08)}
              body{background:#f5f6fa;color:var(--ink);letter-spacing:-.02em}
              .site{max-width:none;background:#f5f6fa}
              .header{height:68px;padding:0 max(22px,calc((100vw - 1240px)/2));gap:34px;background:#121a4a;border-bottom:1px solid rgba(255,255,255,.06)}
              .brand strong{font-size:17px}.brand small{font-size:8px;margin-top:2px}
              .nav{gap:30px}.nav button{font-size:12px}.head-actions button{width:38px;height:38px;border-radius:11px}
              .home-hero{background:linear-gradient(118deg,#11194b 0%,#202a69 56%,#4a3d7d 100%)}
              .hero-inner{max-width:1240px;min-height:450px;padding:44px 28px 58px;grid-template-columns:minmax(350px,.9fr) minmax(430px,1.1fr);gap:56px}
              .eyebrow{font-size:10px;letter-spacing:1.8px;margin-bottom:13px}
              .hero h1{font-size:clamp(39px,4.3vw,58px);line-height:1.13;letter-spacing:-3.4px;margin-bottom:16px}
              .hero p{max-width:470px;font-size:13px;line-height:1.75;margin-bottom:23px}
              .primary-btn,.secondary-btn{height:46px;border-radius:12px;padding:0 20px;font-size:12px}
              .hero-art img{border-radius:28px;box-shadow:0 24px 58px rgba(5,7,31,.3)}
              .quick{max-width:1240px;margin:-20px auto 0;padding:0 28px}
              .quick-grid{grid-template-columns:repeat(4,1fr);gap:12px}
              .quick-card{border-radius:18px;box-shadow:0 14px 35px rgba(24,25,65,.08)}
              .quick-card img{height:128px}.quick-copy{padding:15px}.quick-copy strong{font-size:14px;margin-bottom:5px}.quick-copy span{font-size:10px;min-height:30px}.quick-copy .card-action{height:35px;margin-top:10px;font-size:10px;border-radius:10px}
              .section{max-width:1240px;padding:48px 28px}.section-title{margin-bottom:16px}.section-title h2{font-size:22px}.section-title p{font-size:11px}
              .fortune-cards{gap:12px}.fortune-card{border-radius:17px;padding:17px;gap:14px}.fortune-card .date-art{width:112px;height:78px;flex-basis:112px;border-radius:12px}.fortune-card h3{font-size:14px}.fortune-card p{font-size:11px}
              .test-grid{gap:12px}.test-card{border-radius:17px}.test-card img{height:145px}.test-body{padding:14px}.test-body h3{font-size:14px}.test-body p{font-size:10px;margin-bottom:12px}.test-body button{height:34px;font-size:10px}
              .lucky-banner{border-radius:20px;min-height:150px;grid-template-columns:1fr 230px}.lucky-banner .lucky-copy{padding:26px}.lucky-banner h3{font-size:19px}.lucky-banner p{font-size:11px}
              .footer{padding:28px 20px}
              @media (max-width:1050px){.header{padding:0 22px}.nav{gap:17px}.hero-inner{grid-template-columns:1fr 1fr;gap:28px}.quick{padding:0 22px}.quick-grid{grid-template-columns:repeat(2,1fr)}.section{padding-left:22px;padding-right:22px}.test-grid{grid-template-columns:repeat(2,1fr)}}
              @media (max-width:720px){.header{height:62px;padding:0 16px}.brand strong{font-size:16px}.brand small{display:none}.nav{display:none}.head-actions{margin-left:auto}.home-hero{min-height:auto}.hero-inner{min-height:0;padding:34px 18px 42px;display:flex;flex-direction:column;align-items:stretch;gap:25px}.hero h1{font-size:39px;letter-spacing:-2.7px}.hero p{font-size:12px;line-height:1.75}.hero-art{order:2}.hero-art img{border-radius:22px}.quick{margin:-13px auto 0;padding:0 16px}.quick-grid{grid-template-columns:repeat(2,1fr);gap:9px}.quick-card{border-radius:15px}.quick-card img{height:105px}.quick-copy{padding:12px}.quick-copy strong{font-size:13px}.quick-copy span{font-size:9px;min-height:28px}.quick-copy .card-action{height:32px;margin-top:8px;font-size:9px}.section{padding:38px 16px}.section-title h2{font-size:19px}.fortune-cards{grid-template-columns:1fr}.fortune-card .date-art{width:100px;flex-basis:100px}.test-grid{grid-template-columns:1fr 1fr}.test-card img{height:125px}.lucky-banner{grid-template-columns:1fr}.lucky-banner img{display:none}}
              @media (max-width:390px){.hero h1{font-size:34px}.quick-grid,.test-grid{grid-template-columns:1fr}.quick-card img{height:130px}.test-card img{height:160px}}
              @media (max-width:900px) and (orientation:landscape) and (max-height:600px){.hero-inner{padding-top:24px;padding-bottom:30px;grid-template-columns:1fr 1fr;display:grid;min-height:350px}.hero h1{font-size:34px}.hero-art img{max-height:280px;object-fit:cover}.quick-card img{height:92px}.section{padding-top:34px;padding-bottom:34px}}
              @media (min-width:1400px){.hero-inner{min-height:480px}.quick-card img{height:138px}.section{padding-top:58px;padding-bottom:58px}}
              '''
              s = s.replace('</style>', css + '\n</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'style: refine homepage to reference design'
          git push
