name: Apply v0.00.39 quick menu fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject v0.00.39 quick menu stylesheet
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          tag = '<link rel="stylesheet" href="assets/ui-v039.css?v=0.00.39">'

          # 같은 스타일이 여러 번 들어가지 않도록 기존 v0.00.39 연결을 먼저 제거합니다.
          text = re.sub(r'\n?<link[^>]+assets/ui-v039\\.css[^>]*>', '', text)

          # 최신 보정 CSS를 head 마지막에 한 번 연결합니다.
          if '</head>' in text:
              text = text.replace('</head>', tag + '\n</head>', 1)
          else:
              text += '\n' + tag

          index.write_text(text, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "fix: apply quick menu artwork v0.00.39 [skip ci]"
          git push
