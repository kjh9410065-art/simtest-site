name: Generate result-matched artwork v0.00.36

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  result-art:
    if: "!contains(github.event.head_commit.message, '[result-images-v036]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate result-matched illustrations and update result references
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          out = Path('assets/results')
          out.mkdir(parents=True, exist_ok=True)

          # 결과 유형별로 장면을 완전히 다르게 구성한다.
          # 모두 정사각형 SVG라서 결과 화면에서 이미지 비율이 흔들리지 않는다.
          scenes = {
            'love': [
              ('#32132f','#ff5a9d','heart','rose'),
              ('#24152f','#d98cff','couple','hands'),
              ('#17233d','#ffb66b','sunset','path'),
              ('#1d1838','#8db6ff','home','window'),
            ],
            'personality': [
              ('#121b35','#8c7cff','book','analysis'),
              ('#20312e','#6dd8c7','people','warm'),
              ('#132d3a','#70c8ff','mountain','explore'),
              ('#2a173b','#e49cff','crown','spark'),
            ],
            'stress': [
              ('#28172f','#ff668f','storm','cloud'),
              ('#13263a','#74bfff','room','moon'),
              ('#18332c','#62e0b2','running','wind'),
              ('#2b2140','#c39cff','journal','flower'),
            ],
            'soulmate': [
              ('#32162f','#ff8fc6','stars','two'),
              ('#20213d','#9c9cff','puzzle','fit'),
              ('#321d32','#ffb46e','moon','path'),
              ('#1b2940','#87d9ff','coffee','calm'),
            ],
            'leadership': [
              ('#2b2115','#ffca67','flag','peak'),
              ('#172238','#7fb5ff','chess','plan'),
              ('#24202e','#c49aff','compass','strategy'),
              ('#1d302d','#73dfc1','circle','team'),
            ],
            'first': [
              ('#3a2024','#ff9caa','flower','soft'),
              ('#171b3b','#9c9fff','moon','mystery'),
              ('#24332d','#b7e5a1','rabbit','pure'),
              ('#252034','#d2b5ff','glasses','smart'),
            ],
          }

          def svg_for(bg, accent, object_type, detail):
              # 카테고리와 결과 성향에 맞는 간단한 일러스트를 SVG 도형으로 만든다.
              common = f'''<rect width="800" height="800" rx="64" fill="{bg}"/>
              <circle cx="400" cy="340" r="300" fill="{accent}" opacity=".10"/>
              <circle cx="120" cy="130" r="6" fill="{accent}" opacity=".8"/>
              <circle cx="670" cy="180" r="4" fill="{accent}" opacity=".65"/>
              <circle cx="610" cy="650" r="7" fill="{accent}" opacity=".55"/>'''

              drawings = {
                'heart': f'''<path d="M400 585 C350 535 205 445 205 315 C205 245 260 205 325 205 C365 205 392 228 400 268 C408 228 435 205 475 205 C540 205 595 245 595 315 C595 445 450 535 400 585Z" fill="{accent}"/>
                <path d="M285 320 C325 275 370 290 400 325" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" opacity=".55"/>''',
                'couple': f'''<circle cx="330" cy="300" r="70" fill="{accent}"/><circle cx="470" cy="300" r="70" fill="{accent}" opacity=".72"/><path d="M250 530 Q330 405 400 500 Q470 405 550 530" fill="none" stroke="{accent}" stroke-width="55" stroke-linecap="round"/><path d="M370 455 L400 480 L430 455" fill="none" stroke="#fff" stroke-width="14" opacity=".7"/>''',
                'sunset': f'''<circle cx="400" cy="395" r="115" fill="{accent}"/><path d="M110 540 Q400 420 690 540" fill="none" stroke="#fff" stroke-width="20" opacity=".35"/><path d="M140 650 L330 470 L400 540 L520 430 L670 650Z" fill="{accent}" opacity=".35"/><circle cx="190" cy="570" r="22" fill="{accent}"/>''',
                'home': f'''<path d="M185 420 L400 230 L615 420 V610 H185Z" fill="{accent}" opacity=".8"/><path d="M320 610 V475 H480 V610" fill="{bg}"/><rect x="255" y="410" width="70" height="70" rx="8" fill="#fff" opacity=".75"/><rect x="475" y="410" width="70" height="70" rx="8" fill="#fff" opacity=".75"/><path d="M215 410 L400 245 L585 410" fill="none" stroke="#fff" stroke-width="18" opacity=".6"/>''',
                'book': f'''<path d="M180 245 Q290 210 400 275 V610 Q290 545 180 575Z" fill="{accent}" opacity=".8"/><path d="M400 275 Q510 210 620 245 V575 Q510 545 400 610Z" fill="{accent}" opacity=".55"/><path d="M225 315 Q300 295 365 330 M225 375 Q300 355 365 390 M435 330 Q500 295 575 315 M435 390 Q500 355 575 375" fill="none" stroke="#fff" stroke-width="13" opacity=".7"/>''',
                'people': f'''<circle cx="400" cy="255" r="65" fill="{accent}"/><circle cx="250" cy="315" r="52" fill="{accent}" opacity=".7"/><circle cx="550" cy="315" r="52" fill="{accent}" opacity=".7"/><path d="M300 560 Q320 390 400 390 Q480 390 500 560" fill="{accent}"/><path d="M165 555 Q180 420 250 420 Q290 420 320 500 M635 555 Q620 420 550 420 Q510 420 480 500" fill="none" stroke="{accent}" stroke-width="48" stroke-linecap="round"/>''',
                'mountain': f'''<path d="M120 610 L330 300 L440 445 L520 340 L680 610Z" fill="{accent}" opacity=".75"/><path d="M250 610 L330 470 L400 540 L470 455 L590 610" fill="none" stroke="#fff" stroke-width="18" opacity=".65"/><circle cx="585" cy="185" r="65" fill="#fff" opacity=".8"/>''',
                'crown': f'''<path d="M190 275 L285 365 L400 220 L515 365 L610 275 L570 555 H230Z" fill="{accent}"/><path d="M245 485 H555" stroke="#fff" stroke-width="16" opacity=".65"/><circle cx="285" cy="350" r="15" fill="#fff"/><circle cx="400" cy="265" r="15" fill="#fff"/><circle cx="515" cy="350" r="15" fill="#fff"/>''',
                'storm': f'''<path d="M175 360 Q210 260 315 285 Q375 180 470 260 Q590 235 625 360 Q620 450 520 455 H255 Q175 445 175 360Z" fill="{accent}" opacity=".7"/><path d="M360 435 L320 550 H405 L370 660 L485 500 H400 L440 435Z" fill="#fff" opacity=".85"/>''',
                'room': f'''<rect x="165" y="190" width="470" height="400" rx="20" fill="{accent}" opacity=".35"/><rect x="220" y="245" width="180" height="220" rx="12" fill="#fff" opacity=".12"/><circle cx="520" cy="285" r="52" fill="#fff" opacity=".75"/><path d="M200 600 H600" stroke="{accent}" stroke-width="28" stroke-linecap="round"/><path d="M290 600 V520 H510 V600" fill="{accent}" opacity=".5"/>''',
                'running': f'''<circle cx="430" cy="245" r="58" fill="{accent}"/><path d="M405 315 L350 440 L455 465 L540 385 M350 440 L250 550 M455 465 L390 590" fill="none" stroke="{accent}" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 570 Q280 520 330 560" fill="none" stroke="#fff" stroke-width="18" opacity=".5"/>''',
                'journal': f'''<rect x="210" y="190" width="380" height="410" rx="22" fill="{accent}" opacity=".75"/><path d="M270 290 H530 M270 365 H500 M270 440 H520" stroke="#fff" stroke-width="18" stroke-linecap="round" opacity=".75"/><circle cx="570" cy="585" r="55" fill="#fff" opacity=".18"/><path d="M560 555 C530 510 485 560 510 595 C540 635 585 590 560 555Z" fill="#fff" opacity=".75"/>''',
                'stars': f'''<path d="M400 160 L435 300 L575 335 L435 370 L400 510 L365 370 L225 335 L365 300Z" fill="{accent}"/><circle cx="270" cy="560" r="16" fill="#fff"/><circle cx="530" cy="230" r="11" fill="#fff"/><circle cx="620" cy="500" r="8" fill="#fff"/><path d="M300 610 Q400 520 500 610" fill="none" stroke="#fff" stroke-width="18" opacity=".5"/>''',
                'puzzle': f'''<path d="M205 270 H350 C325 215 390 180 420 230 C440 260 420 285 400 300 H595 V470 C535 445 500 510 545 545 C570 565 590 550 595 530 V610 H400 V545 C350 575 295 520 330 475 C350 450 375 460 400 475 V300 H205Z" fill="{accent}" opacity=".8"/>''',
                'moon': f'''<path d="M510 190 A220 220 0 1 0 535 575 A175 175 0 1 1 510 190Z" fill="{accent}"/><path d="M220 590 Q400 475 580 590" fill="none" stroke="#fff" stroke-width="18" opacity=".45"/><circle cx="260" cy="250" r="10" fill="#fff"/><circle cx="610" cy="300" r="7" fill="#fff"/>''',
                'coffee': f'''<path d="M235 365 H545 V475 Q545 560 390 560 Q235 560 235 475Z" fill="{accent}" opacity=".8"/><path d="M545 395 H595 Q650 395 650 455 Q650 515 545 510" fill="none" stroke="{accent}" stroke-width="35"/><path d="M300 300 Q270 255 305 220 M390 300 Q360 250 395 210 M480 300 Q450 255 485 220" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" opacity=".55"/><path d="M210 585 H570" stroke="#fff" stroke-width="16" opacity=".5"/>''',
                'flag': f'''<path d="M270 620 V205" stroke="#fff" stroke-width="24" opacity=".75"/><path d="M285 225 H590 L510 320 L590 415 H285Z" fill="{accent}"/><path d="M225 620 H315" stroke="{accent}" stroke-width="35" stroke-linecap="round"/>''',
                'chess': f'''<path d="M210 500 L590 500 L530 610 H270Z" fill="{accent}" opacity=".75"/><path d="M310 455 H490 L455 500 H345Z" fill="{accent}"/><path d="M345 455 L365 350 H435 L455 455Z" fill="{accent}"/><path d="M350 350 Q400 300 450 350" fill="none" stroke="#fff" stroke-width="18" opacity=".7"/><path d="M330 250 H470" stroke="#fff" stroke-width="18" opacity=".5"/>''',
                'compass': f'''<circle cx="400" cy="390" r="190" fill="none" stroke="{accent}" stroke-width="35"/><path d="M500 285 L435 435 L300 500 L365 350Z" fill="{accent}"/><circle cx="400" cy="390" r="28" fill="#fff" opacity=".8"/><path d="M400 175 V220 M400 560 V605 M185 390 H230 M570 390 H615" stroke="#fff" stroke-width="14" opacity=".5"/>''',
                'circle': f'''<circle cx="400" cy="390" r="180" fill="{accent}" opacity=".25"/><circle cx="300" cy="390" r="95" fill="none" stroke="{accent}" stroke-width="28"/><circle cx="500" cy="390" r="95" fill="none" stroke="{accent}" stroke-width="28"/><circle cx="400" cy="300" r="55" fill="#fff" opacity=".18"/><path d="M250 575 Q400 470 550 575" fill="none" stroke="#fff" stroke-width="18" opacity=".5"/>''',
                'flower': f'''<path d="M400 580 V400" stroke="#8be0a0" stroke-width="24" stroke-linecap="round"/><path d="M400 500 Q330 445 275 480 Q330 535 400 520 M400 465 Q475 420 525 460 Q480 515 400 505" fill="none" stroke="#8be0a0" stroke-width="24" stroke-linecap="round"/><circle cx="400" cy="320" r="70" fill="{accent}"/><circle cx="320" cy="350" r="65" fill="{accent}" opacity=".8"/><circle cx="480" cy="350" r="65" fill="{accent}" opacity=".8"/><circle cx="400" cy="245" r="65" fill="{accent}" opacity=".8"/>''',
                'rabbit': f'''<ellipse cx="400" cy="450" rx="170" ry="125" fill="{accent}"/><ellipse cx="330" cy="260" rx="45" ry="120" fill="#fff" opacity=".9"/><ellipse cx="470" cy="260" rx="45" ry="120" fill="#fff" opacity=".9"/><circle cx="350" cy="420" r="13" fill="#222"/><circle cx="450" cy="420" r="13" fill="#222"/><path d="M385 465 Q400 480 415 465" fill="none" stroke="#222" stroke-width="12" stroke-linecap="round"/>''',
                'glasses': f'''<rect x="185" y="330" width="175" height="125" rx="50" fill="none" stroke="{accent}" stroke-width="30"/><rect x="440" y="330" width="175" height="125" rx="50" fill="none" stroke="{accent}" stroke-width="30"/><path d="M360 365 H440" stroke="{accent}" stroke-width="28"/><path d="M230 515 Q400 590 570 515" fill="none" stroke="#fff" stroke-width="18" opacity=".45"/><circle cx="275" cy="390" r="28" fill="#fff" opacity=".12"/><circle cx="525" cy="390" r="28" fill="#fff" opacity=".12"/>''',
              }
              return common + drawings[object_type]

          for cat, variants in scenes.items():
              for idx, (bg, accent, obj, detail) in enumerate(variants, 1):
                  svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="{bg}"/><stop offset="1" stop-color="#090b22"/></linearGradient>
            <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
          </defs>
          <rect width="800" height="800" rx="64" fill="url(#bg)"/>
          <ellipse cx="400" cy="650" rx="245" ry="55" fill="#000" opacity=".25" filter="url(#shadow)"/>
          {svg_for(bg, accent, obj, detail)}
          <circle cx="400" cy="400" r="325" fill="none" stroke="{accent}" stroke-width="3" opacity=".18"/>
          </svg>'''
                  (out / f'{cat}-{idx}.svg').write_text(svg, encoding='utf-8')

          # 기존 결과 이미지 참조는 새 SVG로 교체해 브라우저 캐시도 확실히 갱신한다.
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          html = re.sub(r'assets/results/([a-z]+-\d+)\.jpg\?v=[^\'" )]+', r'assets/results/\1.svg?v=0.00.36', html)

          # 결과 설명 제목에 남아 있던 이모지는 모두 제거한다.
          start = html.find('const profiles={')
          end = html.find('\n  };', start)
          if start >= 0 and end > start:
              head = html[:start]
              prof = html[start:end]
              tail = html[end:]
              prof = re.sub(r'[\U0001F300-\U0001FAFF\u2600-\u27BF]', '', prof)
              html = head + prof + tail

          p.write_text(html, encoding='utf-8')
          PY

      - name: Validate result artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          out = Path('assets/results')
          files = list(out.glob('*.svg'))
          if len(files) < 24:
              raise SystemExit(f'expected 24 result SVGs, found {len(files)}')
          html = Path('index.html').read_text(encoding='utf-8')
          if 'assets/results/love-1.svg?v=0.00.36' not in html:
              raise SystemExit('result image references were not updated')
          if re.search(r'[\U0001F300-\U0001FAFF\u2600-\u27BF]', html[html.find('const profiles={'):html.find('\n  };')]):
              raise SystemExit('emoji remains in result profile section')
          print('24 result-matched artworks and references validated')
          PY

      - name: Commit result artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/results/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: apply result-matched artwork v0.00.36 [result-images-v036]"
          git pull --rebase origin main
          git push
