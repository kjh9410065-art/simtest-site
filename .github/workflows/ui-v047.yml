name: Apply v0.00.47 clean responsive baseline

on:
  push:
    branches: [main]
    paths:
      - 'assets/ui-v047.css'
      - 'assets/ui-v047.js'
      - '.github/workflows/ui-v047.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Clean old UI links and malformed source text
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # 과거 UI 패치가 남긴 스타일과 스크립트 연결을 제거한다.
          text = re.sub(r'\n?<link[^>]*assets/ui-v0?(?:\.00\.)?(?:37|38|39|40|41|43|44|45|46)\.css[^>]*>', '', text)
          text = re.sub(r'\n?<script[^>]*assets/ui-v0?(?:\.00\.)?(?:37|38|39|40|41|43|44|45|46)\.js[^>]*></script>', '', text)
          text = re.sub(r'\n?<script[^>]*assets/ui-v(?:037|038|039|040|041|043|044|045|046)\.js[^>]*></script>', '', text)
          text = re.sub(r'\n?<link[^>]*assets/ui-v(?:037|038|039|040|041|043|044|045|046)\.css[^>]*>', '', text)

          # 잘못 삽입된 버전 문자열이 화면에 일반 텍스트로 노출되지 않게 제거한다.
          text = re.sub(r'0\.00\.3[7-9]\/>|0\.00\.4[0-6]\/>', '', text)

          # 이모지와 장식용 기호는 이미지 자산으로 대체하는 원칙에 맞춰 기존 HTML 텍스트에서 제거한다.
          blocked = re.compile(r'[\U0001F000-\U0001FFFF\u2190-\u21FF\u2200-\u22FF\u2300-\u23FF\u25A0-\u25FF\u2600-\u27BF\u2900-\u297F\u2B00-\u2BFF]')
          text = blocked.sub('', text)
          text = text.replace('×','')

          # 최신 v0.00.47 자산은 head와 body에 각각 한 번만 연결한다.
          css = '<link rel="stylesheet" href="assets/ui-v047.css?v=0.00.47">'
          js = '<script defer src="assets/ui-v047.js?v=0.00.47"></script>'
          if css not in text:
              text = text.replace('</head>', css + '\n</head>', 1)
          if js not in text:
              text = text.replace('</body>', js + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate clean baseline
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('assets/ui-v047.css').read_text(encoding='utf-8')
          js = Path('assets/ui-v047.js').read_text(encoding='utf-8')

          assert html.count('assets/ui-v047.css?v=0.00.47') == 1
          assert html.count('assets/ui-v047.js?v=0.00.47') == 1
          assert 'min(340px,84vw)' in css
          assert 'min-width:1200px' in css
          assert 'orientation:landscape' in css

          # UI 소스에는 이모지나 장식용 유니코드 기호를 허용하지 않는다.
          blocked = re.compile(r'[\U0001F000-\U0001FFFF\u2190-\u21FF\u2200-\u22FF\u2300-\u23FF\u25A0-\u25FF\u2600-\u27BF\u2900-\u297F\u2B00-\u2BFF]')
          assert not blocked.search(html)
          assert not blocked.search(css)
          assert not blocked.search(js)

      - name: Commit cleaned index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes needed'
            exit 0
          fi
          git commit -m 'feat: apply clean responsive UI baseline v0.00.47 [skip ci]'
          git push
