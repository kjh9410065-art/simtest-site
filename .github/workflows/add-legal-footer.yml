name: Add legal footer

on:
  workflow_run:
    workflows: ["Decorate fortune portal"]
    types: [completed]

permissions:
  contents: write

jobs:
  footer:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Add footer and legal links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          # 기존 패치가 다시 실행되어도 푸터가 중복되지 않도록 먼저 제거한다.
          html=re.sub(r'<style>\s*/\* FLICK_LEGAL_FOOTER \*/.*?</style>','',html,flags=re.S)
          html=re.sub(r'<div class="flick-legal-footer".*?</div>','',html,flags=re.S)
          css='''<style>\n/* FLICK_LEGAL_FOOTER */\n.flick-legal-footer{margin-top:18px;padding:20px 14px 24px;border-top:1px solid #ddd8cc;text-align:center;background:#f7f4eb}.flick-legal-brand{font-size:15px;font-weight:950;color:#173d30}.flick-legal-links{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:10px 0 8px}.flick-legal-links a{color:#69766e;text-decoration:none;font-size:10px;font-weight:700}.flick-legal-links a:hover{color:#315e4b}.flick-legal-copy{font-size:9px;color:#969c96}@media(max-width:760px){.flick-legal-footer{margin-top:14px;padding:16px 10px 20px}.flick-legal-links{gap:10px}}</style>'''
          footer='''<div class="flick-legal-footer"><div class="flick-legal-brand">운세·심리테스트</div><div class="flick-legal-links"><a href="legal.html#terms">이용약관</a><a href="legal.html#privacy">개인정보처리방침</a><a href="legal.html#contact">문의하기</a><a href="legal.html#disclaimer">면책사항</a></div><div class="flick-legal-copy">© 2026 운세·심리테스트. All rights reserved.</div></div>'''
          html=html.replace('</head>',css+'</head>',1)
          html=html.replace('</body>',footer+'</body>',1)
          p.write_text(html,encoding='utf-8')
          PY
      - name: Commit legal footer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No legal footer changes"
          else
            git commit -m "Add legal links and disclaimer footer"
            git push
          fi
