name: Add legal footer

on:
  workflow_run:
    workflows: ["Decorate fortune portal"]
    types: [completed]

permissions:
  contents: write

jobs:
  footer:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Add footer and legal links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          # 기존 푸터를 제거해 재실행 시 중복되지 않게 한다.
          html=re.sub(r'<style>\s*/\* MIRA_LEGAL_FOOTER \*/.*?</style>','',html,flags=re.S)
          html=re.sub(r'<footer class="mira-legal-footer">.*?</footer>','',html,flags=re.S)
          html=re.sub(r'<div class="flick-legal-footer".*?</div>','',html,flags=re.S)
          css='''<style>\n/* MIRA_LEGAL_FOOTER */\n.mira-legal-footer{margin-top:28px;padding:26px 16px 30px;border-top:1px solid #ddd8cc;text-align:center;background:#f7f4eb}.mira-legal-brand{font-size:15px;font-weight:950;color:#173d30}.mira-legal-links{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:11px 0 9px}.mira-legal-links a{color:#69766e;text-decoration:none;font-size:10px;font-weight:700}.mira-legal-links a:hover{color:#315e4b}.mira-legal-email{display:inline-block;color:#477c63;text-decoration:none;font-size:10px;font-weight:700;margin-bottom:8px}.mira-legal-copy{font-size:9px;color:#969c96}@media(max-width:760px){.mira-legal-footer{margin-top:20px;padding:21px 10px 24px}.mira-legal-links{gap:9px 12px}}\n</style>'''
          footer='''<footer class="mira-legal-footer"><div class="mira-legal-brand">운세·심리테스트</div><nav class="mira-legal-links"><a href="legal.html#terms">이용약관</a><a href="legal.html#privacy">개인정보처리방침</a><a href="legal.html#contact">문의하기</a><a href="legal.html#disclaimer">면책사항</a></nav><a class="mira-legal-email" href="mailto:kjh9410065@gmail.com">문의: kjh9410065@gmail.com</a><div class="mira-legal-copy">© 2026 운세·심리테스트. All rights reserved.</div></footer>'''
          html=html.replace('</head>',css+'</head>',1)
          html=html.replace('</body>',footer+'</body>',1)
          p.write_text(html,encoding='utf-8')
          PY
      - name: Commit legal footer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No legal footer changes"
          else
            git commit -m "Refine Mira legal footer"
            git push
          fi
