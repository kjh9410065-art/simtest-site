name: AI image integrity check

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check worker.js
          node --check ai-images.js

      - name: Validate Wrangler configuration
        run: npx --yes wrangler@latest deploy --dry-run
