name: Apply v0.00.49 compact home

on:
  push:
    branches: [main]
    paths:
      - 'assets/ui-v049.css'
      - 'assets/ui-v049.js'
      - '.github/workflows/ui-v049.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Attach v0.00.49 assets
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # 이전 UI 버전의 링크가 남아 있어도 최신 버전이 마지막에 적용되도록 정리한다.
          text = re.sub(r'\n?<link[^>]*assets/ui-v0?(?:\.00\.)?(?:47|48|49)\.css[^>]*>', '', text)
          text = re.sub(r'\n?<script[^>]*assets/ui-v(?:047|048|049)\.js[^>]*></script>', '', text)
          text = re.sub(r'\n?<script[^>]*assets/ui-v0?(?:\.00\.)?(?:47|48|49)\.js[^>]*></script>', '', text)

          css = '<link rel="stylesheet" href="assets/ui-v049.css?v=0.00.49">'
          js = '<script defer src="assets/ui-v049.js?v=0.00.49"></script>'

          # 최신 CSS는 head 마지막에, 최신 JS는 body 마지막에 연결한다.
          text = text.replace('</head>', css + '\n</head>', 1)
          text = text.replace('</body>', js + '\n</body>', 1)
          path.write_text(text, encoding='utf-8')

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('assets/ui-v049.css').read_text(encoding='utf-8')
          js = Path('assets/ui-v049.js').read_text(encoding='utf-8')

          assert html.count('assets/ui-v049.css?v=0.00.49') == 1
          assert html.count('assets/ui-v049.js?v=0.00.49') == 1
          assert 'minmax(0,1fr)' in css
          assert 'min-width:600px' in css
          assert 'orientation:landscape' in css
          assert 'assets/tests_nonhuman/love-art.jpg' in js
          assert 'assets/ui/quick-lucky.svg' in js

          # 이 프로젝트는 이모지와 장식용 유니코드 기호를 사용하지 않는다.
          blocked = re.compile(r'[\U0001F000-\U0001FFFF\u2190-\u21FF\u2200-\u22FF\u2300-\u23FF\u25A0-\u25FF\u2600-\u27BF\u2900-\u297F\u2B00-\u2BFF]')
          assert not blocked.search(css)
          assert not blocked.search(js)

      - name: Commit index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: apply compact home v0.00.49 [skip ci]'
          git push
