name: Compact card layout

on:
  workflow_run:
    workflows: ["Add static card illustrations"]
    types: [completed]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Tighten layout and enlarge illustrations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(r'<style>\s*/\* FLICK_COMPACT_CARD_LAYOUT \*/.*?</style>', '', html, flags=re.S)
          css = r'''<style>
          /* FLICK_COMPACT_CARD_LAYOUT */
          /* 불필요하게 넓은 여백을 줄이고 화면 안에 더 많은 콘텐츠가 보이도록 압축합니다. */
          .flick-fortune-wrap{padding-top:10px!important;padding-bottom:12px!important}
          .fortune-heading{padding-bottom:6px!important;margin-bottom:5px!important}
          .fortune-main{gap:5px!important;margin-bottom:5px!important}
          .fortune-summary,.fortune-luck{min-height:118px!important;padding:12px 14px!important}
          .fortune-summary h2{font-size:20px!important;margin:3px 0!important}
          .fortune-summary p{line-height:1.4!important;margin:3px 0!important}
          .fortune-score{margin-top:5px!important}
          .fortune-section-title{margin:7px 0 4px!important}
          .fortune-metrics{gap:4px!important}
          .metric{padding:8px!important;border-radius:10px!important}
          .metric b{font-size:11px!important}
          .quick-grid{gap:5px!important}
          .quick-card{min-height:88px!important;padding:9px!important;border-radius:12px!important}
          .quick-card strong{font-size:12px!important}
          .quick-card span{font-size:7.5px!important}
          .quick-card .card-action{height:22px!important;margin-top:3px!important}
          .zodiac-panel{padding:6px!important;gap:1px!important}
          .zodiac-item{padding:3px 1px!important;min-height:64px!important}
          .zodiac-item b{font-size:12px!important}
          .keyword-panel{gap:4px!important}
          .keyword{padding:4px 7px!important}
          .test-grid{gap:5px!important}
          .test-card{min-height:118px!important;padding:10px!important}
          .section{padding-top:18px!important;padding-bottom:18px!important}
          .section-head{margin-bottom:6px!important}
          .section-head h2{font-size:18px!important}
          .fortune-grid{gap:5px!important}
          .fortune-card{min-height:112px!important;padding:12px!important}
          .lucky-banner{padding:14px!important}
          .flick-psychology-rich{padding:15px 20px 18px!important}
          .psych-rich-head{padding-bottom:7px!important}
          .psych-rich-grid{gap:6px!important}
          .psych-rich-card{min-height:108px!important;padding:10px!important}
          .psych-no{margin-bottom:9px!important}
          .psych-rich-card b{font-size:12px!important;margin-bottom:3px!important}
          .psych-rich-card small{font-size:8px!important;line-height:1.35!important}
          .psych-rich-card em{margin-top:6px!important}

          /* 카드 전체에 그림이 확실히 보이도록 크기를 키우고 텍스트 영역과 자연스럽게 겹칩니다. */
          .quick-card::before{right:-2px!important;top:2px!important;width:105px!important;height:78px!important;background-size:cover!important;opacity:.92!important}
          .psych-rich-card::before{right:-4px!important;bottom:-2px!important;width:108px!important;height:76px!important;background-size:cover!important;opacity:.9!important}
          .fortune-card::before{right:-5px!important;bottom:-4px!important;width:120px!important;height:82px!important;background-size:cover!important;opacity:.9!important}
          .test-card::before{right:-4px!important;top:-3px!important;width:108px!important;height:78px!important;background-size:cover!important;opacity:.9!important}
          .metric::before{right:-2px!important;bottom:-2px!important;width:55px!important;height:55px!important;opacity:.65!important}
          .luck-item::before{right:-2px!important;bottom:-2px!important;width:52px!important;height:52px!important;opacity:.65!important}
          .zodiac-item::before{right:-3px!important;bottom:-3px!important;width:54px!important;height:48px!important;opacity:.4!important}
          .quick-card,.psych-rich-card,.fortune-card,.test-card,.metric,.luck-item,.zodiac-item{overflow:hidden!important}

          @media(max-width:760px){
            .flick-fortune-wrap{padding:9px 10px 11px!important}
            .fortune-heading{padding-bottom:5px!important;margin-bottom:4px!important}
            .fortune-main{gap:4px!important}
            .fortune-summary,.fortune-luck{padding:10px 11px!important}
            .fortune-summary h2{font-size:17px!important}
            .fortune-summary p{font-size:10px!important}
            .quick-grid{gap:4px!important}
            .quick-card{min-height:78px!important;padding:8px!important}
            .quick-card strong{font-size:11px!important}
            .quick-card span{font-size:7px!important}
            .zodiac-item{min-height:57px!important}
            .zodiac-item b{font-size:11px!important}
            .section{padding-top:13px!important;padding-bottom:13px!important}
            .flick-psychology-rich{padding:12px 10px 15px!important}
            .psych-rich-grid{gap:4px!important}
            .psych-rich-card{min-height:98px!important;padding:8px!important}
            .psych-rich-card b{font-size:11px!important}
            .psych-rich-card small{font-size:7px!important}
            .quick-card::before{width:82px!important;height:62px!important}
            .psych-rich-card::before{width:86px!important;height:62px!important}
            .fortune-card::before{width:94px!important;height:65px!important}
            .test-card::before{width:86px!important;height:62px!important}
            .metric::before{width:44px!important;height:44px!important}
            .luck-item::before{width:42px!important;height:42px!important}
            .zodiac-item::before{width:44px!important;height:39px!important}
          }
          </style>'''
          html = html.replace('</head>', css + '</head>', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit compact layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No layout changes"
          else
            git commit -m "Compact homepage and enlarge illustrations"
            git push
          fi
