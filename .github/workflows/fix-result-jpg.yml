name: Fix result image paths

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-result-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Replace every deleted result SVG reference
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # 결과 이미지와 테스트 질문 이미지에 남아 있는 모든 SVG 경로를
          # 같은 파일명의 기존 JPG 경로로 변경한다.
          # 쿼리 문자열이 붙은 경우도 함께 처리한다.
          fixed = re.sub(
              r'(assets/results/[^"\'\s?]+)\.svg',
              r'\1.jpg',
              text,
              flags=re.IGNORECASE,
          )

          if fixed != text:
              path.write_text(fixed, encoding='utf-8')
              print('index.html: all result SVG references were replaced with JPG references')
          else:
              print('index.html: no result SVG references remain')

      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No source change required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: replace all deleted result SVG references with JPG assets [skip ci]"
          git push
