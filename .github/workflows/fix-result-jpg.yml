name: Fix result image paths

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-result-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate and normalize result paths
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # 실제로 존재하는 결과 JPG에 대해서만 SVG 경로를 JPG로 바꾼다.
          def replace_svg(match):
              base = match.group(1)
              candidate = Path(base + '.jpg')
              return base + '.jpg' if candidate.exists() else match.group(0)

          fixed = re.sub(
              r'(assets/results/(?!result-main\.)[^"\'\s?]+)\.svg',
              replace_svg,
              text,
              flags=re.IGNORECASE,
          )

          # 현재 결과 런타임 버전을 index.html에 연결해 브라우저 캐시를 갱신한다.
          fixed = re.sub(r'assets/ui-v052\.css\?v=[0-9.]+', 'assets/ui-v052.css?v=0.00.64', fixed)
          fixed = re.sub(r'assets/ui-v052\.js\?v=[0-9.]+', 'assets/ui-v052.js?v=0.00.64', fixed)

          path.write_text(fixed, encoding='utf-8')

      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No source change required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: normalize result asset paths and cache version [skip ci]"
          git push
