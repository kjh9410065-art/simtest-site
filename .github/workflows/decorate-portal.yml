name: Decorate fortune portal

on:
  workflow_run:
    workflows: ["Compact card layout"]
    types: [completed]

permissions:
  contents: write

jobs:
  decorate:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Refine Mira portal visuals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          # 기존 장식 패치를 제거해 새 디자인이 중복되지 않도록 한다.
          html=re.sub(r'<style>\s*/\* MIRA_PORTAL_POLISH \*/.*?</style>','',html,flags=re.S)
          html=re.sub(r'<script>\s*/\* MIRA_PORTAL_POLISH_JS \*/.*?</script>','',html,flags=re.S)
          # 화면에 보이는 FLiCK 브랜드 문구는 이 사이트에서 사용하지 않는다.
          html=html.replace('FLICK FORTUNE GUIDE','FORTUNE GUIDE')
          html=html.replace('FLiCK 오늘의 운세','오늘의 운세')
          css=r'''<style>
          /* MIRA_PORTAL_POLISH */
          :root{--mira-ink:#193d30;--mira-green:#4f856b;--mira-soft:#edf4ee;--mira-cream:#fffdf7;--mira-line:#ded8ca}
          body{background:#f6f2e8!important;color:var(--mira-ink)!important}
          .header{height:64px!important;background:rgba(255,253,247,.97)!important;border-bottom:1px solid #ddd7c9!important}
          .brand strong{color:var(--mira-ink)!important;font-size:17px!important}.brand small{color:#89958c!important}
          .nav{gap:20px!important}.nav button{color:#7d877f!important;font-size:11px!important}.nav button.active{color:var(--mira-ink)!important;border-bottom-color:var(--mira-green)!important}
          .head-actions button{background:#fffdf8!important;border-color:var(--mira-line)!important;width:38px!important;height:38px!important}
          .hero{background:linear-gradient(135deg,#f0f5ed,#eaf2eb 55%,#faf4e7)!important}
          .hero-inner{min-height:380px!important;padding:42px 28px 48px!important;gap:38px!important}
          .hero h1{color:var(--mira-ink)!important;font-size:clamp(38px,4.7vw,58px)!important;letter-spacing:-3.5px!important;margin-bottom:14px!important}
          .hero h1 em{color:var(--mira-green)!important}.hero p{color:#6e7972!important;font-size:13px!important;line-height:1.7!important;margin-bottom:21px!important}
          .primary{background:#356d54!important;box-shadow:0 9px 20px rgba(53,109,84,.15)!important}.secondary{background:#fffdf8!important;color:#315a48!important;border-color:#d7e1d9!important}
          .hero-art{height:270px!important;border-radius:24px!important;box-shadow:0 12px 30px rgba(53,75,60,.08)!important}
          .flick-fortune-wrap{background:linear-gradient(180deg,#faf7ef,#f6f2e8)!important}
          .fortune-heading{border-bottom-color:var(--mira-line)!important}.fortune-heading h1{color:var(--mira-ink)!important}
          .fortune-date{background:var(--mira-soft)!important;border-color:#d4e2d8!important;color:#4d8067!important}
          .fortune-summary,.fortune-luck{background:var(--mira-cream)!important;border:1px solid var(--mira-line)!important;border-radius:15px!important;box-shadow:0 7px 20px rgba(56,70,59,.055)!important}
          .fortune-summary:after{display:none!important}.fortune-summary h2,.fortune-luck h3{color:var(--mira-ink)!important}.fortune-summary p{color:#6c7870!important}.score-ring{border-color:#cbded0!important;color:#356d54!important}
          .metric{background:#f5f7f1!important;border-color:#e0ddd2!important}.metric b{color:#356d54!important}.metric i{color:#9a8a69!important}
          .quick-card{background:#fffdf8!important;border:1px solid #ddd8cb!important;border-radius:14px!important;box-shadow:0 7px 16px rgba(55,70,58,.045)!important}
          .quick-card:hover{border-color:#b9d2c1!important;transform:translateY(-2px)!important}.quick-card strong{color:var(--mira-ink)!important}.quick-card span{color:#7b857e!important}
          .quick-card .card-action{height:25px!important;background:#edf4ee!important;color:#477b62!important;border:1px solid #d4e3d9!important;border-radius:8px!important;font-weight:800!important}
          .zodiac-panel{background:#fffdf8!important;border:1px solid #ddd8cb!important;border-radius:14px!important;box-shadow:0 7px 16px rgba(55,70,58,.04)!important}.zodiac-item b{color:#356d54!important}
          .keyword-panel{border-top-color:#ddd8cb!important}.keyword{background:#eef4ef!important;border-color:#d9e5dc!important;color:#527b67!important}
          .flick-psychology-rich{background:#faf7ef!important;border-top:1px solid #dfd9cc!important;border-bottom:1px solid #dfd9cc!important}
          .psych-rich-head h2{color:var(--mira-ink)!important}.psych-rich-head p{color:#7c857e!important}.psych-count{background:#f2ead9!important;border-color:#dfd2b8!important;color:#846f43!important}
          .psych-category-tabs button{background:#fffdf8!important;border-color:#ddd8cc!important;color:#7d857e!important}.psych-category-tabs button.active{background:#edf4ee!important;border-color:#cfe1d5!important;color:#3d765c!important}
          .psych-rich-card{background:#fffdf8!important;border-color:#ded9cd!important;border-radius:14px!important;box-shadow:0 7px 17px rgba(55,70,58,.045)!important}.psych-rich-card:hover{border-color:#bfd5c7!important}.psych-rich-card b{color:var(--mira-ink)!important}.psych-rich-card small{color:#7b847d!important}.psych-rich-card em{color:#4f856b!important}
          .psych-rich-card::after{display:none!important}
          .psych-rich-card::before{opacity:.14!important;filter:saturate(.75)!important}
          .flick-visual-divider{margin:7px auto!important}.flick-visual-divider>div{background:#eff5ef!important;border-color:#d5e2d8!important;box-shadow:0 7px 17px rgba(50,72,57,.05)!important}.flick-visual-divider b{color:#28533f!important}
          .flick-static-visual .visual-frame{border-color:#d5e1d8!important;box-shadow:0 9px 22px rgba(50,72,57,.06)!important}
          @media(max-width:760px){.header{height:58px!important;padding:0 12px!important}.brand strong{font-size:15px!important}.brand small{font-size:7px!important}.nav{gap:9px!important}.nav button{font-size:9px!important}.head-actions button{width:34px!important;height:34px!important}.hero-inner{display:block!important;min-height:0!important;padding:28px 14px 30px!important}.hero h1{font-size:35px!important;letter-spacing:-2.5px!important}.hero p{font-size:11px!important;line-height:1.6!important}.primary,.secondary{height:42px!important;padding:0 16px!important;border-radius:11px!important;font-size:10px!important}.hero-art{height:190px!important;margin-top:18px!important;border-radius:18px!important}.flick-visual-divider{padding:0 10px!important}.flick-visual-divider>div{height:62px!important}.psych-rich-card{min-height:116px!important}.quick-card{min-height:92px!important}}
          </style>'''
          js=r'''<script>
          /* MIRA_PORTAL_POLISH_JS */
          document.addEventListener('DOMContentLoaded',()=>{
            // 장식용 텍스트가 브랜드명처럼 보이지 않도록 일반 사이트 안내 문구로 통일한다.
            document.querySelectorAll('.flick-visual-divider small').forEach(x=>x.textContent='FORTUNE GUIDE');
          });
          </script>'''
          html=html.replace('</head>',css+'</head>',1).replace('</body>',js+'</body>',1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Commit Mira polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No Mira polish changes"
          else
            git commit -m "Refine Mira fortune portal visuals"
            git push
          fi
