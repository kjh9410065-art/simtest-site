name: Clean legacy UI symbols

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Remove blocked symbols from text source
        shell: python
        run: |
          from pathlib import Path
          import re

          blocked = re.compile(r'[\U0001F000-\U0001FFFF\u2190-\u21FF\u2200-\u22FF\u2300-\u23FF\u25A0-\u25FF\u2600-\u27BF\u2900-\u297F\u2B00-\u2BFF]')
          allowed = {'.html','.css','.js','.json','.jsonc','.md','.yml','.yaml','.txt'}

          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              cleaned = blocked.sub('', text)
              if cleaned != text:
                  path.write_text(cleaned, encoding='utf-8')

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No blocked symbols found."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'chore: remove legacy emoji-like symbols [skip ci]'
          git push
