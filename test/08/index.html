<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결정 스타일 테스트</title><style>body{margin:0;background:#f5f0e4;color:#244638;font-family:sans-serif}.w{max-width:620px;margin:auto;padding:28px 18px}.b{background:#fffdf8;padding:24px;border:1px solid #ddd6c7;border-radius:18px}.c{display:grid;gap:8px}.c button,.n button{padding:13px;border:1px solid #ddd6c7;border-radius:10px;background:#fffef9;text-align:left}.n{display:flex;gap:8px;margin-top:14px}.n button{flex:1;text-align:center}.go{background:#5c8d71!important;color:white!important}.pr{color:#aa8f59;font-weight:bold}.q{font-size:18px;line-height:1.6}.p{color:#7d877f;line-height:1.8}.hide{display:none}a{color:#507960;text-decoration:none}</style><body><main class="w"><a href="/">← 메인으로</a><div class="b"><h1>결정 스타일 테스트</h1><p class="p">선택의 순간, 당신은 직감파일까요 분석파일까요?</p><section id="quiz"><div class="pr" id="p"></div><h2 class="q" id="q"></h2><div class="c" id="c"></div><div class="n"><button id="b">이전</button><button class="go" id="n">다음</button></div></section><section id="r" class="hide"></section></div></main><script>const Q=[['메뉴를 고를 때','늘 먹던 것','친구에게 묻기','끌리는 것','메뉴 비교'],['여행지를 정할 때','안전한 곳','함께 정함','그날 정함','조건 비교'],['큰돈을 쓸 때','시간을 둔다','의견을 듣는다','마음이 끌리면','가격 비교'],['갑작스러운 기회','생각해본다','주변에 묻는다','잡는다','조건 확인'],['실수 가능성이 있으면','더 생각','조언','일단 시도','체크리스트'],['두 선택이 비슷하면','익숙한 쪽','사람이 좋은 쪽','재미있는 쪽','이득이 큰 쪽'],['결정 후에는','다시 생각','공유','바로 실행','검토'],['친구의 선택을 보면','존중','응원','따라가기도','이유가 궁금'],['시간이 부족하면','하나 고른다','상대와 정한다','직감','기준 하나'],['내 선택의 기준','안정','관계','설렘','합리성']];let i=0,a=[],$=x=>document.getElementById(x);function d(){$('p').textContent=`${i+1} / 10`;$('q').textContent=Q[i][0];$('c').innerHTML=Q[i].slice(1).map((x,j)=>`<button data-j="${j}">${x}</button>`).join('');$('b').disabled=!i;$('n').textContent=i===9?'결과 보기':'다음'}$('c').onclick=e=>{if(e.target.dataset.j!==undefined){a[i]=+e.target.dataset.j;e.target.style.borderColor='#5c8d71'}};$('b').onclick=()=>{if(i)i--;d()};$('n').onclick=()=>{if(a[i]==null)return alert('답을 골라주세요.');if(i<9){i++;d()}else{let s=[0,0,0,0];a.forEach(x=>s[x]++);let k=s.indexOf(Math.max(...s)),r=[['신중 안정형','충분히 생각한 뒤 후회가 적은 선택을 만드는 타입이에요.'],['관계 참고형','혼자 결정하기보다 신뢰하는 사람의 관점을 활용해요.'],['직감 실행형','결정 속도가 빠르고 경험을 통해 답을 찾는 타입이에요.'],['분석 비교형','조건과 결과를 비교해 가장 합리적인 선택을 찾는 타입이에요.']][k];$('quiz').classList.add('hide');$('r').classList.remove('hide');$('r').innerHTML=`<div class="pr">YOUR DECISION TYPE</div><h2>${r[0]}</h2><p class="p">${r[1]}</p><p class="p"><b>반전 포인트</b><br>당신에게 맞는 정답은 항상 가장 완벽한 선택이 아니라 가장 후회가 적은 선택일 수 있어요.</p><p><a href="/test/08/">다시 하기</a>　<a href="/">다른 테스트</a></p>`}}d()</script></body></html>
