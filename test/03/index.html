<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스트레스 유형 테스트</title><style>body{margin:0;background:#f5f0e4;color:#244638;font-family:sans-serif}.w{max-width:620px;margin:auto;padding:28px 18px}.b{background:#fffdf8;padding:24px;border:1px solid #ddd6c7;border-radius:18px}h1{font-size:28px}.p{color:#7d877f}.q{font-size:18px;line-height:1.6}.c{display:grid;gap:8px}.c button,.nav button{padding:13px;border:1px solid #ddd6c7;border-radius:10px;background:#fffef9;text-align:left}.nav{display:flex;gap:8px;margin-top:14px}.nav button{flex:1;text-align:center}.go{background:#5c8d71!important;color:white!important}.pr{color:#aa8f59;font-weight:bold}.hide{display:none}a{color:#507960;text-decoration:none}.r p{line-height:1.8;color:#6f7b73}.box{background:#edf4ee;padding:12px;border-radius:10px;margin:10px 0}</style></head><body><main class="w"><a href="/">← 메인으로</a><div class="b"><h1>스트레스 유형 테스트</h1><p class="p">힘들 때 무의식적으로 선택하는 행동으로 나의 회복 방식을 찾아봐요.</p><section id="quiz"><div class="pr" id="pr"></div><p class="q" id="q"></p><div class="c" id="c"></div><div class="nav"><button id="prev">이전</button><button class="go" id="next">다음</button></div></section><section id="r" class="r hide"></section></div></main><script>const qs=['갑자기 일이 몰리면?','기분이 안 좋을 때 가장 먼저?','잠이 부족하면?','실수했을 때?','사람 때문에 지치면?','계획이 꼬이면?','압박감이 커질수록?','휴일에 가장 끌리는 것은?','속상한 일을 겪으면?','스트레스가 풀리는 순간은?'];const cs=[['하나씩 정리','누군가와 이야기','일단 처리','혼자 숨 돌리기'],['혼자 있는다','친구에게 말한다','다른 일에 몰입','원인을 생각한다'],['조용히 쉬기','사람을 찾기','카페인과 버티기','일정을 줄이기'],['원인 분석','누군가에게 털어놓기','빨리 잊기','재발 방지하기'],['거리를 둔다','대화한다','다른 활동을 한다','혼자 정리한다'],['순서를 다시 짠다','주변에 도움 요청','일단 해본다','잠시 멈춘다'],['더 집중한다','말이 많아진다','속도를 높인다','혼자 있고 싶다'],['집에서 쉰다','좋은 사람 만난다','밖으로 나간다','정리하거나 취미를 한다'],['곱씹어 본다','누군가에게 말한다','다른 재미를 찾는다','교훈을 정리한다'],['할 일을 끝냈을 때','마음이 통하는 대화를 했을 때','재미있는 일을 했을 때','혼자 평온해졌을 때']];let i=0,a=[],$=x=>document.getElementById(x);function draw(){$('pr').textContent=`${i+1} / 10`;$('q').textContent=qs[i];$('c').innerHTML=cs[i].map((x,j)=>`<button data-j="${j}">${x}</button>`).join('');$('prev').disabled=!i;$('next').textContent=i===9?'결과 보기':'다음';if(a[i]!=null)document.querySelector(`[data-j="${a[i]}"]`).style.borderColor='#5c8d71'}$('c').onclick=e=>{if(e.target.dataset.j!==undefined){a[i]=+e.target.dataset.j;draw()}};$('prev').onclick=()=>{if(i){i--;draw()}};$('next').onclick=()=>{if(a[i]==null)return alert('답을 골라주세요.');if(i<9){i++;draw()}else show()};function show(){let s=[0,0,0,0];a.forEach(x=>s[x]++);let k=s.indexOf(Math.max(...s)),r=[['정리 회복형','문제를 구조화하면서 스트레스를 낮추는 타입이에요. 해결할 수 있다는 감각이 생기면 빠르게 안정됩니다.','모든 것을 혼자 해결하려 하면 피로가 오래갈 수 있어요.'],['교감 회복형','사람과 대화하며 감정을 정리하는 타입이에요. 마음이 통하는 한 사람만 있어도 회복 속도가 빨라집니다.','상대가 내 마음을 알아주길 기다리기보다 필요한 것을 말해보세요.'],['행동 회복형','가만히 고민하기보다 움직이면서 스트레스를 털어내는 타입이에요. 새로운 자극이 기분 전환에 도움이 됩니다.','쉬어야 할 때까지 계속 달리는 습관은 조심하세요.'],['고요 회복형','혼자만의 시간과 자극이 적은 환경에서 에너지를 되찾는 타입이에요.','혼자 있는 것이 회피가 되지 않도록 가까운 사람에게 상태를 알려주세요.']][k];$('quiz').classList.add('hide');$('r').classList.remove('hide');$('r').innerHTML=`<div class="pr">YOUR STRESS TYPE</div><h2>${r[0]}</h2><p>${r[1]}</p><div class="box"><b>주의할 패턴</b><br>${r[2]}</div><div class="box"><b>오늘의 회복법</b><br>지금 가장 피곤하게 만드는 일 하나를 잠시 내려놓아 보세요.</div><p><a href="/test/03/">다시 하기</a>　<a href="/">다른 테스트</a></p>`}draw()</script></body></html>
