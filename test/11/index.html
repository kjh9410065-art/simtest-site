<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자존감 테스트</title><style>body{margin:0;background:#f5f0e4;color:#244638;font-family:sans-serif}.w{max-width:620px;margin:auto;padding:28px 18px}.b{background:#fffdf8;padding:24px;border:1px solid #ddd6c7;border-radius:18px}.c{display:grid;gap:8px}.c button,.n button{padding:13px;border:1px solid #ddd6c7;border-radius:10px;background:#fffef9;text-align:left}.n{display:flex;gap:8px;margin-top:14px}.n button{flex:1;text-align:center}.go{background:#5c8d71!important;color:#fff!important}.pr{color:#aa8f59;font-weight:bold}.q{font-size:18px;line-height:1.6}.p{color:#7d877f;line-height:1.8}.hide{display:none}a{color:#507960;text-decoration:none}</style><body><main class="w"><a href="/">← 메인으로</a><div class="b"><h1>자존감 테스트</h1><p class="p">나는 나 자신을 얼마나 믿고 있을까요?</p><section id="quiz"><div class="pr" id="p"></div><h2 class="q" id="q"></h2><div class="c" id="c"></div><div class="n"><button id="b">이전</button><button class="go" id="n">다음</button></div></section><section id="r" class="hide"></section></div></main><script>const Q=[['실수했을 때','괜찮다','누군가에게 말한다','빨리 잊는다','왜 했는지 본다'],['칭찬을 받으면','믿는다','고맙다','더 해낸다','생각해본다'],['비판을 들으면','참고한다','감정을 확인','반박한다','근거를 본다'],['새로운 일을 시작할 때','가능성을 본다','응원을 구한다','도전한다','준비한다'],['비교하게 될 때','내 기준','대화','경쟁','성장 포인트'],['실패가 걱정되면','작게 시작','응원받기','일단 도전','계획 세우기'],['좋은 결과가 나오면','내 노력','함께한 사람','다음 목표','과정을 돌아봄'],['힘든 날에는','쉬어간다','사람을 찾는다','딴 일을 한다','원인을 정리'],['내 장점을 묻는다면','차분함','배려','용기','성실함'],['나에게 가장 필요한 말','괜찮아','네 편이야','할 수 있어','천천히 해도 돼']];let i=0,a=[],$=x=>document.getElementById(x);function d(){$('p').textContent=`${i+1} / 10`;$('q').textContent=Q[i][0];$('c').innerHTML=Q[i].slice(1).map((x,j)=>`<button data-j="${j}">${x}</button>`).join('');$('b').disabled=!i;$('n').textContent=i===9?'결과 보기':'다음'}$('c').onclick=e=>{if(e.target.dataset.j!==undefined){a[i]=+e.target.dataset.j;e.target.style.borderColor='#5c8d71'}};$('b').onclick=()=>{if(i)i--;d()};$('n').onclick=()=>{if(a[i]==null)return alert('답을 골라주세요.');if(i<9){i++;d()}else{let s=[0,0,0,0];a.forEach(x=>s[x]++);let k=s.indexOf(Math.max(...s)),r=[['단단한 자기신뢰형','실수와 평가를 나와 분리해서 바라보는 힘이 있는 편이에요.'],['관계 속 성장형','좋은 관계와 응원을 통해 자신감을 키우는 타입이에요.'],['도전형 자신감','부딪혀보며 스스로의 가능성을 확인하는 타입이에요.'],['현실적 안정형','작은 성취를 쌓으며 자신에 대한 믿음을 키우는 타입이에요.']][k];$('quiz').classList.add('hide');$('r').classList.remove('hide');$('r').innerHTML=`<div class="pr">YOUR SELF TYPE</div><h2>${r[0]}</h2><p class="p">${r[1]}</p><p class="p"><b>숨은 약점</b><br>남의 기준을 너무 오래 들여다보면 자신의 장점을 놓칠 수 있어요.</p><p><a href="/test/11/">다시 하기</a>　<a href="/">다른 테스트</a></p>`}}d()</script></body></html>
