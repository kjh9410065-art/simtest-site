<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>직장 성향 테스트</title><style>body{margin:0;background:#f5f0e4;color:#244638;font-family:sans-serif}.w{max-width:620px;margin:auto;padding:28px 18px}.b{background:#fffdf8;padding:24px;border:1px solid #ddd6c7;border-radius:18px}.c{display:grid;gap:8px}.c button,.n button{padding:13px;border:1px solid #ddd6c7;border-radius:10px;background:#fffef9;text-align:left}.n{display:flex;gap:8px;margin-top:14px}.n button{flex:1;text-align:center}.go{background:#5c8d71!important;color:#fff!important}.pr{color:#aa8f59;font-weight:bold}.q{font-size:18px;line-height:1.6}.p{color:#7d877f;line-height:1.8}.hide{display:none}a{color:#507960;text-decoration:none}</style><body><main class="w"><a href="/">← 메인으로</a><div class="b"><h1>직장 성향 테스트</h1><p class="p">일할 때 나도 모르게 드러나는 업무 스타일을 알아봐요.</p><section id="quiz"><div class="pr" id="p"></div><h2 class="q" id="q"></h2><div class="c" id="c"></div><div class="n"><button id="b">이전</button><button class="go" id="n">다음</button></div></section><section id="r" class="hide"></section></div></main><script>const Q=[['업무를 시작할 때','자료부터','동료와 이야기','일단 시작','계획 작성'],['마감이 다가오면','차분히 진행','도움 요청','속도 높임','일정 재조정'],['회의에서는','듣는다','의견 조율','아이디어 낸다','결론 정리'],['새 업무가 오면','이해부터','질문한다','바로 해본다','절차 확인'],['실수하면','원인 분석','상황 공유','다시 시도','체크 강화'],['동료와 의견이 다르면','근거 확인','대화','토론','기준 비교'],['일이 잘 풀릴 때','안정감','팀워크','속도','성과'],['가장 싫은 업무 환경','혼란','차가운 분위기','반복','불명확한 기준'],['칭찬받고 싶은 부분','정확성','협업','성과','책임감'],['내 업무 스타일','차분함','협력','추진력','체계적']];let i=0,a=[],$=x=>document.getElementById(x);function d(){$('p').textContent=`${i+1} / 10`;$('q').textContent=Q[i][0];$('c').innerHTML=Q[i].slice(1).map((x,j)=>`<button data-j="${j}">${x}</button>`).join('');$('b').disabled=!i;$('n').textContent=i===9?'결과 보기':'다음'}$('c').onclick=e=>{if(e.target.dataset.j!==undefined){a[i]=+e.target.dataset.j;e.target.style.borderColor='#5c8d71'}};$('b').onclick=()=>{if(i)i--;d()};$('n').onclick=()=>{if(a[i]==null)return alert('답을 골라주세요.');if(i<9){i++;d()}else{let s=[0,0,0,0];a.forEach(x=>s[x]++);let k=s.indexOf(Math.max(...s)),r=[['분석형 실무자','자료와 근거를 바탕으로 정확한 결과를 만드는 타입이에요.'],['협업형 플레이어','사람과의 소통을 통해 팀 전체의 결과를 끌어올리는 타입이에요.'],['돌파형 실행가','빠르게 움직이며 직접 결과를 만들어내는 타입이에요.'],['체계형 관리자','일정과 기준을 정리해 업무가 흔들리지 않게 만드는 타입이에요.']][k];$('quiz').classList.add('hide');$('r').classList.remove('hide');$('r').innerHTML=`<div class="pr">YOUR WORK TYPE</div><h2>${r[0]}</h2><p class="p">${r[1]}</p><p class="p"><b>업무 강점</b><br>${['정확한 판단','원활한 소통','빠른 실행','안정적인 관리'][k]}</p><p><a href="/test/10/">다시 하기</a>　<a href="/">다른 테스트</a></p>`}}d()</script></body></html>
