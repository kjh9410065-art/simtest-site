<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>친구 관계 테스트</title><style>body{margin:0;background:#f5f0e4;color:#244638;font-family:sans-serif}.w{max-width:620px;margin:auto;padding:28px 18px}.b{background:#fffdf8;padding:24px;border:1px solid #ddd6c7;border-radius:18px}.c{display:grid;gap:8px}.c button,.n button{padding:13px;border:1px solid #ddd6c7;border-radius:10px;background:#fffef9;text-align:left}.n{display:flex;gap:8px;margin-top:14px}.n button{flex:1;text-align:center}.go{background:#5c8d71!important;color:#fff!important}.pr{color:#aa8f59;font-weight:bold}.q{font-size:18px;line-height:1.6}.p{color:#7d877f;line-height:1.8}.hide{display:none}a{color:#507960;text-decoration:none}</style><body><main class="w"><a href="/">← 메인으로</a><div class="b"><h1>친구 관계 테스트</h1><p class="p">나는 어떤 친구이고, 어떤 사람과 가장 잘 맞을까요?</p><section id="quiz"><div class="pr" id="p"></div><h2 class="q" id="q"></h2><div class="c" id="c"></div><div class="n"><button id="b">이전</button><button class="go" id="n">다음</button></div></section><section id="r" class="hide"></section></div></main><script>const Q=[['친구가 고민을 말하면','끝까지 듣기','공감하기','해결책 찾기','현실적인 조언'],['친구와 약속을 잡을 때','조용한 곳','맛집','재미있는 곳','시간과 장소 확정'],['친구가 약속을 취소하면','괜찮다고 함','이유를 물음','다른 약속 찾음','다음 일정을 잡음'],['친구가 힘들어하면','옆에 있기','연락하기','밖으로 데려가기','도움 방법 찾기'],['친구와 의견이 다르면','생각을 듣기','감정을 살피기','토론하기','기준 비교'],['단체 채팅에서','읽고 있다','반응한다','대화를 이끈다','정보를 정리한다'],['친구에게 서운하면','혼자 생각','솔직히 말함','바로 풀기','상황을 설명'],['오래된 친구에게 바라는 것','편안함','공감','재미','신뢰'],['새 친구가 생기면','천천히 친해짐','자주 연락','함께 놀기','약속을 지킴'],['내가 좋은 친구라고 느끼는 순간','말없이 있어도 편할 때','마음이 통할 때','같이 웃을 때','서로 믿을 때']];let i=0,a=[],$=x=>document.getElementById(x);function d(){$('p').textContent=`${i+1} / 10`;$('q').textContent=Q[i][0];$('c').innerHTML=Q[i].slice(1).map((x,j)=>`<button data-j="${j}">${x}</button>`).join('');$('b').disabled=!i;$('n').textContent=i===9?'결과 보기':'다음'}$('c').onclick=e=>{if(e.target.dataset.j!==undefined){a[i]=+e.target.dataset.j;e.target.style.borderColor='#5c8d71'}};$('b').onclick=()=>{if(i)i--;d()};$('n').onclick=()=>{if(a[i]==null)return alert('답을 골라주세요.');if(i<9){i++;d()}else{let s=[0,0,0,0];a.forEach(x=>s[x]++);let k=s.indexOf(Math.max(...s)),r=[['조용한 버팀목','말보다 행동으로 친구를 지켜주는 타입. 오래 볼수록 믿음이 커져요.'],['따뜻한 공감자','친구의 감정을 빠르게 알아차리고 마음을 편하게 해주는 타입.'],['즐거운 분위기 메이커','함께 있을 때 웃음과 활기를 만들어내는 타입.'],['든든한 현실 파트너','약속과 신뢰를 중요하게 여기며 필요할 때 확실히 돕는 타입.']][k];$('quiz').classList.add('hide');$('r').classList.remove('hide');$('r').innerHTML=`<div class="pr">YOUR FRIEND TYPE</div><h2>${r[0]}</h2><p class="p">${r[1]}</p><p class="p"><b>잘 맞는 친구</b><br>${['말이 많지 않아도 편한 사람','감정을 솔직하게 나누는 사람','새로운 경험을 좋아하는 사람','약속과 신뢰를 중요하게 생각하는 사람'][k]}</p><p><a href="/test/05/">다시 하기</a>　<a href="/">다른 테스트</a></p>`}}d()</script></body></html>
