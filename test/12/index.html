<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>소비 성향 테스트</title><style>body{margin:0;background:#f5f0e4;color:#244638;font-family:sans-serif}.w{max-width:620px;margin:auto;padding:28px 18px}.b{background:#fffdf8;padding:24px;border:1px solid #ddd6c7;border-radius:18px}.c{display:grid;gap:8px}.c button,.n button{padding:13px;border:1px solid #ddd6c7;border-radius:10px;background:#fffef9;text-align:left}.n{display:flex;gap:8px;margin-top:14px}.n button{flex:1;text-align:center}.go{background:#5c8d71!important;color:#fff!important}.pr{color:#aa8f59;font-weight:bold}.q{font-size:18px;line-height:1.6}.p{color:#7d877f;line-height:1.8}.hide{display:none}a{color:#507960;text-decoration:none}</style><body><main class="w"><a href="/">← 메인으로</a><div class="b"><h1>소비 성향 테스트</h1><p class="p">돈을 쓸 때 드러나는 나만의 선택 기준을 알아봐요.</p><section id="quiz"><div class="pr" id="p"></div><h2 class="q" id="q"></h2><div class="c" id="c"></div><div class="n"><button id="b">이전</button><button class="go" id="n">다음</button></div></section><section id="r" class="hide"></section></div></main><script>const Q=[['사고 싶은 물건을 발견하면','며칠 생각','후기 확인','바로 구매','가격 비교'],['세일을 보면','필요한지 생각','친구에게 물음','끌리면 산다','할인율 계산'],['카페에서','익숙한 메뉴','추천 메뉴','신메뉴','가성비 메뉴'],['큰 지출은','미룬다','상의한다','원하면 산다','비교한다'],['구독 서비스는','필요할 때만','친구와 공유','새로운 것 시도','혜택 비교'],['옷을 살 때','기본템','주변 반응','개성','활용도'],['여행 중 쇼핑은','최소화','선물 위주','기념품','필요품'],['예산이 남으면','저축','사람과 사용','즐긴다','다음 달로 넘김'],['돈을 쓴 뒤','만족 확인','함께한 기억','재미를 떠올림','효율을 따짐'],['소비에서 중요한 것','필요','만족','즐거움','가치']];let i=0,a=[],$=x=>document.getElementById(x);function d(){$('p').textContent=`${i+1} / 10`;$('q').textContent=Q[i][0];$('c').innerHTML=Q[i].slice(1).map((x,j)=>`<button data-j="${j}">${x}</button>`).join('');$('b').disabled=!i;$('n').textContent=i===9?'결과 보기':'다음'}$('c').onclick=e=>{if(e.target.dataset.j!==undefined){a[i]=+e.target.dataset.j;e.target.style.borderColor='#5c8d71'}};$('b').onclick=()=>{if(i)i--;d()};$('n').onclick=()=>{if(a[i]==null)return alert('답을 골라주세요.');if(i<9){i++;d()}else{let s=[0,0,0,0];a.forEach(x=>s[x]++);let k=s.indexOf(Math.max(...s)),r=[['필요 중심 절약형','정말 필요한지 먼저 생각하고 충동을 잘 막는 편이에요.'],['관계 중심 소비형','사람과 함께하는 경험과 만족에 돈을 쓰는 편이에요.'],['즐거움 우선형','새로운 경험과 즉각적인 만족을 중요하게 생각해요.'],['가치 분석형','가격과 활용도를 비교해 납득되는 소비를 하는 타입이에요.']][k];$('quiz').classList.add('hide');$('r').classList.remove('hide');$('r').innerHTML=`<div class="pr">YOUR CONSUMER TYPE</div><h2>${r[0]}</h2><p class="p">${r[1]}</p><p class="p"><b>소비 팁</b><br>결제 전 10초만 멈추고 “지금도 사고 싶은가?”를 확인해보세요.</p><p><a href="/test/12/">다시 하기</a>　<a href="/">다른 테스트</a></p>`}}d()</script></body></html>
