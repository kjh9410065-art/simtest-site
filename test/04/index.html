<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>첫인상 테스트</title><style>body{margin:0;background:#f5f0e4;color:#244638;font-family:sans-serif}.w{max-width:620px;margin:auto;padding:28px 18px}.b{background:#fffdf8;padding:24px;border:1px solid #ddd6c7;border-radius:18px}.c{display:grid;gap:8px}.c button,.nav button{padding:13px;border:1px solid #ddd6c7;border-radius:10px;background:#fffef9;text-align:left}.nav{display:flex;gap:8px;margin-top:14px}.nav button{flex:1;text-align:center}.go{background:#5c8d71!important;color:#fff!important}.pr{color:#aa8f59;font-weight:bold}.q{font-size:18px;line-height:1.6}.p{color:#7d877f;line-height:1.7}.hide{display:none}a{color:#507960;text-decoration:none}</style><body><main class="w"><a href="/">← 메인으로</a><div class="b"><h1>첫인상 테스트</h1><p class="p">사람들이 처음 만났을 때 느끼기 쉬운 나의 분위기를 알아봐요.</p><section id="q"><div class="pr" id="p"></div><h2 class="q" id="t"></h2><div class="c" id="c"></div><div class="nav"><button id="b">이전</button><button class="go" id="n">다음</button></div></section><section id="r" class="hide"></section></div></main><script>const Q=[['처음 만난 자리에서','주변을 살핀다','먼저 웃으며 인사','자연스럽게 농담','필요한 일을 챙긴다'],['옷을 고를 때','편안함','깔끔함','개성','단정함'],['말할 때 나는','천천히','밝게','재치 있게','또박또박'],['사진을 찍을 때','자연스럽게','미소','포즈','정면'],['낯선 사람이 말을 걸면','조심스럽게','반갑게','재미있게','예의 있게'],['모임에서','관찰자','분위기 메이커','활동가','정리자'],['칭찬을 들으면','살짝 웃음','고맙다고 말함','농담으로 넘김','차분히 감사'],['내 표정은','차분함','부드러움','생동감','진지함'],['친구가 소개할 때','조용한 사람','다정한 사람','재미있는 사람','믿음직한 사람'],['가장 듣고 싶은 첫인상','신뢰감','편안함','매력','센스']];let i=0,a=[],$=x=>document.getElementById(x);function d(){$('p').textContent=`${i+1} / 10`;$('t').textContent=Q[i][0];$('c').innerHTML=Q[i].slice(1).map((x,j)=>`<button data-j="${j}">${x}</button>`).join('');$('b').disabled=!i;$('n').textContent=i===9?'결과 보기':'다음'}$('c').onclick=e=>{if(e.target.dataset.j!==undefined){a[i]=+e.target.dataset.j;document.querySelectorAll('#c button').forEach(x=>x.style.borderColor='');e.target.style.borderColor='#5c8d71'}};$('b').onclick=()=>{if(i)i--;d()};$('n').onclick=()=>{if(a[i]==null)return alert('답을 골라주세요.');if(i<9){i++;d()}else{let s=[0,0,0,0];a.forEach(x=>s[x]++),k=s.indexOf(Math.max(...s)),r=[['신뢰감 있는 관찰자','차분하고 안정적인 분위기로 기억되기 쉬워요. 가까워질수록 섬세함이 드러납니다.'],['편안한 호감형','말을 걸기 편하고 따뜻한 사람이라는 인상을 남겨요.'],['매력적인 분위기형','표정과 말투에서 생동감이 느껴져 기억에 남는 편이에요.'],['든든한 정돈형','예의 바르고 믿을 만하다는 인상을 주기 쉬워요.']][k];$('q').classList.add('hide');$('r').classList.remove('hide');$('r').innerHTML=`<div class="pr">YOUR FIRST IMPRESSION</div><h2>${r[0]}</h2><p class="p">${r[1]}</p><p class="p"><b>반전 포인트</b><br>처음의 이미지와 실제 성격 사이에 의외의 차이가 매력으로 느껴질 수 있어요.</p><p><a href="/test/04/">다시 하기</a>　<a href="/">다른 테스트</a></p>`}}d()</script></body></html>
