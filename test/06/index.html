<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리더십 테스트</title><style>body{margin:0;background:#f5f0e4;color:#244638;font-family:sans-serif}.w{max-width:620px;margin:auto;padding:28px 18px}.b{background:#fffdf8;padding:24px;border:1px solid #ddd6c7;border-radius:18px}.c{display:grid;gap:8px}.c button,.n button{padding:13px;border:1px solid #ddd6c7;border-radius:10px;background:#fffef9;text-align:left}.n{display:flex;gap:8px;margin-top:14px}.n button{flex:1;text-align:center}.go{background:#5c8d71!important;color:white!important}.pr{color:#aa8f59;font-weight:bold}.q{font-size:18px;line-height:1.6}.p{color:#7d877f;line-height:1.8}.hide{display:none}a{color:#507960;text-decoration:none}</style><body><main class="w"><a href="/">← 메인으로</a><div class="b"><h1>리더십 테스트</h1><p class="p">팀을 이끌 때 나는 어떤 리더에 가까울까요?</p><section id="quiz"><div class="pr" id="p"></div><h2 class="q" id="q"></h2><div class="c" id="c"></div><div class="n"><button id="b">이전</button><button class="go" id="n">다음</button></div></section><section id="r" class="hide"></section></div></main><script>const Q=[['팀에 문제가 생기면','원인 파악','의견 듣기','바로 지시','역할 재분배'],['회의에서','경청','분위기 조율','결론 제시','일정 관리'],['팀원이 실수하면','함께 분석','위로','다시 시도','재발 방지'],['시간이 부족하면','우선순위','팀과 협의','속도 올리기','역할 나누기'],['의견 충돌이 나면','자료 확인','중재','결정','기준 설정'],['새 프로젝트라면','계획','사람 구성','먼저 시작','목표와 일정'],['팀 분위기가 처지면','원인 찾기','대화','새로운 자극','작은 목표'],['칭찬할 때','구체적으로','따뜻하게','공개적으로','성과 중심'],['내가 원하는 팀','차분한 팀','서로 존중','빠른 팀','체계적인 팀'],['리더에게 중요한 것','판단','공감','추진력','책임감']];let i=0,a=[],$=x=>document.getElementById(x);function d(){$('p').textContent=`${i+1} / 10`;$('q').textContent=Q[i][0];$('c').innerHTML=Q[i].slice(1).map((x,j)=>`<button data-j="${j}">${x}</button>`).join('');$('b').disabled=!i;$('n').textContent=i===9?'결과 보기':'다음'}$('c').onclick=e=>{if(e.target.dataset.j!==undefined){a[i]=+e.target.dataset.j;e.target.style.borderColor='#5c8d71'}};$('b').onclick=()=>{if(i)i--;d()};$('n').onclick=()=>{if(a[i]==null)return alert('답을 골라주세요.');if(i<9){i++;d()}else{let s=[0,0,0,0];a.forEach(x=>s[x]++);let k=s.indexOf(Math.max(...s)),r=[['전략형 리더','상황을 분석하고 방향을 잡아 팀을 안정시키는 리더예요.'],['공감형 리더','사람을 이해하고 팀의 분위기를 살리는 리더예요.'],['돌파형 리더','결정과 실행이 빠르고 막힌 상황을 앞으로 밀어가는 리더예요.'],['관리형 리더','역할과 기준을 명확히 하며 팀이 흔들리지 않게 만드는 리더예요.']][k];$('quiz').classList.add('hide');$('r').classList.remove('hide');$('r').innerHTML=`<div class="pr">YOUR LEADERSHIP TYPE</div><h2>${r[0]}</h2><p class="p">${r[1]}</p><p class="p"><b>숨은 강점</b><br>${['판단력과 전략','공감과 신뢰','추진력과 용기','책임감과 정리력'][k]}</p><p><a href="/test/06/">다시 하기</a>　<a href="/">다른 테스트</a></p>`}}d()</script></body></html>
