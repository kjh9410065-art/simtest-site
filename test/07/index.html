<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>감정 표현 테스트</title><style>body{margin:0;background:#f5f0e4;color:#244638;font-family:sans-serif}.w{max-width:620px;margin:auto;padding:28px 18px}.b{background:#fffdf8;padding:24px;border:1px solid #ddd6c7;border-radius:18px}.c{display:grid;gap:8px}.c button,.n button{padding:13px;border:1px solid #ddd6c7;border-radius:10px;background:#fffef9;text-align:left}.n{display:flex;gap:8px;margin-top:14px}.n button{flex:1;text-align:center}.go{background:#5c8d71!important;color:white!important}.pr{color:#aa8f59;font-weight:bold}.q{font-size:18px;line-height:1.6}.p{color:#7d877f;line-height:1.8}.hide{display:none}a{color:#507960;text-decoration:none}</style><body><main class="w"><a href="/">← 메인으로</a><div class="b"><h1>감정 표현 테스트</h1><p class="p">기쁠 때, 서운할 때, 화날 때 나는 어떻게 표현할까요?</p><section id="quiz"><div class="pr" id="p"></div><h2 class="q" id="q"></h2><div class="c" id="c"></div><div class="n"><button id="b">이전</button><button class="go" id="n">다음</button></div></section><section id="r" class="hide"></section></div></main><script>const Q=[['기쁜 일이 생기면','혼자 즐김','누군가에게 말함','바로 표현','기록해둠'],['서운하면','참는다','돌려 말한다','솔직히 말한다','이유를 생각한다'],['화가 나면','시간을 둔다','대화한다','표출한다','정리한다'],['칭찬을 받으면','웃음','고맙다','더 크게 반응','왜 좋은지 생각'],['슬플 때','혼자 있다','친구를 찾는다','다른 일을 한다','감정을 정리'],['좋아하는 사람에게','행동으로','말로','적극적으로','천천히'],['감정이 복잡하면','생각한다','말한다','움직인다','글로 정리'],['갈등 뒤에는','시간 필요','대화 필요','빨리 풀기','원인 확인'],['표현하기 어려운 감정은','약한 모습','미안함','분노','실망'],['나의 감정 표현은','차분한 편','따뜻한 편','솔직한 편','신중한 편']];let i=0,a=[],$=x=>document.getElementById(x);function d(){$('p').textContent=`${i+1} / 10`;$('q').textContent=Q[i][0];$('c').innerHTML=Q[i].slice(1).map((x,j)=>`<button data-j="${j}">${x}</button>`).join('');$('b').disabled=!i;$('n').textContent=i===9?'결과 보기':'다음'}$('c').onclick=e=>{if(e.target.dataset.j!==undefined){a[i]=+e.target.dataset.j;e.target.style.borderColor='#5c8d71'}};$('b').onclick=()=>{if(i)i--;d()};$('n').onclick=()=>{if(a[i]==null)return alert('답을 골라주세요.');if(i<9){i++;d()}else{let s=[0,0,0,0];a.forEach(x=>s[x]++);let k=s.indexOf(Math.max(...s)),r=[['내면 정리형','감정을 바로 꺼내기보다 충분히 느끼고 정리한 뒤 표현해요.'],['공감 대화형','감정을 관계 속에서 나누며 서로 이해하는 과정을 중요하게 생각해요.'],['솔직 표현형','좋으면 좋다, 싫으면 싫다고 비교적 분명하게 표현하는 편이에요.'],['신중 해석형','감정의 원인을 먼저 이해한 뒤 말하는 안정적인 표현 방식이에요.']][k];$('quiz').classList.add('hide');$('r').classList.remove('hide');$('r').innerHTML=`<div class="pr">YOUR EMOTION TYPE</div><h2>${r[0]}</h2><p class="p">${r[1]}</p><p class="p"><b>주의할 점</b><br>감정을 너무 오래 혼자 처리하면 가까운 사람도 상태를 알아채기 어려워요.</p><p><a href="/test/07/">다시 하기</a>　<a href="/">다른 테스트</a></p>`}}d()</script></body></html>
