<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>숨겨진 성향 테스트 | 운세·심리테스트</title><style>body{margin:0;background:#f5f0e4;color:#244638;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.wrap{max-width:620px;margin:auto;padding:28px 18px}.box{background:#fffdf8;border:1px solid #ddd6c7;border-radius:18px;padding:24px;box-shadow:0 8px 24px #2a3c2f10}h1{margin:6px 0 8px;font-size:28px}.sub{color:#7d877f;font-size:13px;line-height:1.7}.progress{color:#aa8f59;font-size:12px;font-weight:800;margin:22px 0 8px}.q{font-size:18px;line-height:1.5;margin:0 0 16px}.choices{display:grid;gap:8px}button{font:inherit;cursor:pointer}.choice,.nav button{padding:13px;border:1px solid #ddd6c7;border-radius:11px;background:#fffef9;text-align:left}.choice:hover{border-color:#5c8d71;background:#edf4ee}.nav{display:flex;gap:8px;margin-top:14px}.nav button{flex:1;text-align:center}.next{background:#5c8d71!important;color:white;border-color:#5c8d71!important}.result h2{font-size:26px}.result p{color:#6f7b73;line-height:1.8}.item{padding:12px;background:#edf4ee;border-radius:10px;margin:9px 0}.hide{display:none}a{color:#507960;text-decoration:none;font-weight:800}.top{margin-bottom:18px}</style></head><body><main class="wrap"><a href="/">← 메인으로</a><div class="box" id="app"><div class="top"><div class="progress" id="progress"></div><h1>숨겨진 성향 테스트</h1><div class="sub">평소에는 잘 드러나지 않는 나의 반응과 선택을 알아봐요. 10개의 질문으로 가장 가까운 성향을 찾아봅니다.</div></div><section id="quiz"><p class="q" id="question"></p><div class="choices" id="choices"></div><div class="nav"><button id="prev">이전</button><button class="next" id="next">다음</button></div></section><section id="result" class="result hide"></section></div></main><script>const data={questions:['갑자기 하루가 완전히 비었다면 가장 먼저?','낯선 모임에서 나는?','계획에 없던 제안이 들어오면?','친구가 나를 오해했다면?','실수한 뒤 가장 먼저 드는 생각은?','혼자만의 시간이 길어지면?','칭찬을 들었을 때 나는?','갈등 상황에서 나는?','새로운 환경에 들어가면?','요즘 나를 가장 잘 설명하는 말은?'],choices:[['혼자 쉬기','친한 사람 만나기','새로운 곳 가기','밀린 일 정리하기'],['분위기 관찰','먼저 인사','재미있는 사람 찾기','필요한 일 챙기기'],['충분히 생각','주변에 물어보기','일단 해보기','장단점 정리'],['왜 그렇게 느꼈는지 생각','바로 대화','일단 풀어보기','사실관계 정리'],['원인을 분석','누군가에게 말하기','빨리 털기','다음엔 안 하게 정리'],['편안하다','조금 외롭다','새로운 걸 찾는다','생활을 정돈한다'],['쑥스럽다','고맙다고 말한다','더 해보고 싶다','내가 한 일을 돌아본다'],['조용히 상황을 본다','상대와 이야기한다','직접 해결한다','기준을 세운다'],['천천히 적응','사람부터 사귄다','바로 탐색','규칙과 구조 파악'],['차분함','따뜻함','호기심','꼼꼼함']]};let n=0,ans=[];const $=id=>document.getElementById(id);function render(){ $('progress').textContent=`${n+1} / 10`;$('question').textContent=data.questions[n];$('choices').innerHTML=data.choices[n].map((x,i)=>`<button class="choice" data-i="${i}">${x}</button>`).join('');$('prev').disabled=n===0;$('next').textContent=n===9?'결과 보기':'다음';if(ans[n]!=null)document.querySelector(`[data-i="${ans[n]}"]`).style.borderColor='#5c8d71'}$('choices').onclick=e=>{if(e.target.dataset.i){ans[n]=+e.target.dataset.i;render()}};$('prev').onclick=()=>{if(n)n--;render()};$('next').onclick=()=>{if(ans[n]==null)return alert('답을 골라주세요.');if(n<9){n++;render()}else result()};function result(){let s=[0,0,0,0];ans.forEach(x=>s[x]++);let m=s.indexOf(Math.max(...s));let r=[['차분한 관찰자','겉으로는 조용해 보여도 상황의 작은 변화와 사람의 감정을 빠르게 읽는 편이에요. 혼자 생각할 시간이 있어야 판단이 선명해집니다.','사람을 배려하느라 내 선택을 뒤로 미루는 순간이 약점이 될 수 있어요.'],['따뜻한 연결자','관계의 온도에 민감하고 사람 사이의 분위기를 부드럽게 만드는 능력이 있어요. 신뢰가 쌓이면 생각보다 깊은 모습을 보여줍니다.','상대의 감정을 내 책임처럼 떠안지 않는 연습이 필요해요.'],['자유로운 개척자','호기심이 강하고 새로운 경험에서 에너지를 얻어요. 정해진 답보다 직접 부딪혀 얻는 경험을 믿는 타입입니다.','재미가 줄어든 일은 너무 빨리 포기하지 않는 게 좋아요.'],['든든한 설계자','흐름을 정리하고 현실적인 방법을 찾는 능력이 강해요. 갑작스러운 상황에서도 결국 기준을 세워 해결하는 편입니다.','완벽하게 준비될 때까지 기다리면 좋은 기회를 놓칠 수 있어요.']][m];$('quiz').classList.add('hide');$('result').classList.remove('hide');$('result').innerHTML=`<div class="progress">YOUR TYPE</div><h2>${r[0]}</h2><p>${r[1]}</p><div class="item"><b>숨겨진 약점</b><br>${r[2]}</div><div class="item"><b>오늘의 행동</b><br>평소와 다른 작은 선택 하나를 해보세요.</div><p><a href="/test/01/">다시 하기</a>　<a href="/">다른 테스트 보기</a></p>`}render();</script></body></html>
