<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여행 성향 테스트</title><style>body{margin:0;background:#f5f0e4;color:#244638;font-family:sans-serif}.w{max-width:620px;margin:auto;padding:28px 18px}.b{background:#fffdf8;padding:24px;border:1px solid #ddd6c7;border-radius:18px}.c{display:grid;gap:8px}.c button,.n button{padding:13px;border:1px solid #ddd6c7;border-radius:10px;background:#fffef9;text-align:left}.n{display:flex;gap:8px;margin-top:14px}.n button{flex:1;text-align:center}.go{background:#5c8d71!important;color:white!important}.pr{color:#aa8f59;font-weight:bold}.q{font-size:18px;line-height:1.6}.p{color:#7d877f;line-height:1.8}.hide{display:none}a{color:#507960;text-decoration:none}</style><body><main class="w"><a href="/">← 메인으로</a><div class="b"><h1>여행 성향 테스트</h1><p class="p">여행에서 진짜 중요하게 생각하는 것은 무엇일까요?</p><section id="quiz"><div class="pr" id="p"></div><h2 class="q" id="q"></h2><div class="c" id="c"></div><div class="n"><button id="b">이전</button><button class="go" id="n">다음</button></div></section><section id="r" class="hide"></section></div></main><script>const Q=[['여행지를 고를 때','휴식','맛집','명소','계획'],['숙소는','조용함','분위기','위치','가성비'],['하루 일정은','느슨하게','함께 정하기','즉흥적으로','촘촘하게'],['현지에서 가장 하고 싶은 것','쉬기','사람 만나기','새로운 경험','많이 보기'],['길을 잃으면','천천히 찾기','사람에게 묻기','탐험','지도 확인'],['기념품은','작은 것','사람에게 줄 것','재미있는 것','실용적인 것'],['여행 중 피곤하면','숙소로','같이 쉬기','계속 즐기기','일정 조정'],['사진은','풍경','사람','재미있는 장면','기록용'],['여행 동행자에게 원하는 것','편안함','배려','모험심','시간 약속'],['여행이 끝난 뒤 가장 남는 것','휴식','추억','새로운 경험','사진과 기록']];let i=0,a=[],$=x=>document.getElementById(x);function d(){$('p').textContent=`${i+1} / 10`;$('q').textContent=Q[i][0];$('c').innerHTML=Q[i].slice(1).map((x,j)=>`<button data-j="${j}">${x}</button>`).join('');$('b').disabled=!i;$('n').textContent=i===9?'결과 보기':'다음'}$('c').onclick=e=>{if(e.target.dataset.j!==undefined){a[i]=+e.target.dataset.j;e.target.style.borderColor='#5c8d71'}};$('b').onclick=()=>{if(i)i--;d()};$('n').onclick=()=>{if(a[i]==null)return alert('답을 골라주세요.');if(i<9){i++;d()}else{let s=[0,0,0,0];a.forEach(x=>s[x]++);let k=s.indexOf(Math.max(...s)),r=[['느긋한 힐링 여행자','일상에서 벗어나 몸과 마음을 쉬게 하는 여행을 좋아해요.'],['관계 중심 여행자','누구와 무엇을 나누느냐가 여행의 기억을 결정하는 타입이에요.'],['모험형 여행자','새로운 장소와 예상 밖의 사건에서 여행의 재미를 찾는 타입이에요.'],['알찬 탐험가','계획과 기록을 통해 여행의 만족도를 높이는 타입이에요.']][k];$('quiz').classList.add('hide');$('r').classList.remove('hide');$('r').innerHTML=`<div class="pr">YOUR TRAVEL TYPE</div><h2>${r[0]}</h2><p class="p">${r[1]}</p><p class="p"><b>당신에게 맞는 여행</b><br>${['숙소에서 여유를 즐기고 산책하는 여행','맛집과 대화를 중심으로 하는 여행','새로운 체험을 가득 넣은 여행','동선과 명소를 알차게 채운 여행'][k]}</p><p><a href="/test/09/">다시 하기</a>　<a href="/">다른 테스트</a></p>`}}d()</script></body></html>
