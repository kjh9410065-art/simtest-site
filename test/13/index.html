<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>휴식 성향 테스트</title><style>body{margin:0;background:#f5f0e4;color:#244638;font-family:sans-serif}.w{max-width:620px;margin:auto;padding:28px 18px}.b{background:#fffdf8;padding:24px;border:1px solid #ddd6c7;border-radius:18px}.c{display:grid;gap:8px}.c button,.n button{padding:13px;border:1px solid #ddd6c7;border-radius:10px;background:#fffef9;text-align:left}.n{display:flex;gap:8px;margin-top:14px}.n button{flex:1;text-align:center}.go{background:#5c8d71!important;color:#fff!important}.pr{color:#aa8f59;font-weight:bold}.q{font-size:18px;line-height:1.6}.p{color:#7d877f;line-height:1.8}.hide{display:none}a{color:#507960;text-decoration:none}</style><body><main class="w"><a href="/">← 메인으로</a><div class="b"><h1>휴식 성향 테스트</h1><p class="p">쉬는 날에도 각자 충전하는 방식은 다릅니다.</p><section id="quiz"><div class="pr" id="p"></div><h2 class="q" id="q"></h2><div class="c" id="c"></div><div class="n"><button id="b">이전</button><button class="go" id="n">다음</button></div></section><section id="r" class="hide"></section></div></main><script>const Q=[['퇴근 후','집에서 쉼','친구 만남','취미','정리'],['주말 아침','늦잠','약속','외출','집안일'],['피곤할 때','조용히','대화','움직이기','정돈'],['스트레스가 풀리는 것은','혼자 있기','사람과 웃기','새로운 경험','깔끔한 공간'],['휴일 계획','없음','약속 하나','즉흥','일정표'],['집에서 쉬면','영상','통화','게임/취미','정리'],['여행 뒤에는','숙소 휴식','친구 만나기','다른 곳 탐방','짐 정리'],['잠들기 전','멍때림','대화','콘텐츠','내일 준비'],['내 방의 이상적인 상태','편안함','사람이 머무는 곳','취미 공간','깔끔함'],['진짜 휴식이란','아무것도 안 하기','마음 나누기','재미 찾기','질서 회복']];let i=0,a=[],$=x=>document.getElementById(x);function d(){$('p').textContent=`${i+1} / 10`;$('q').textContent=Q[i][0];$('c').innerHTML=Q[i].slice(1).map((x,j)=>`<button data-j="${j}">${x}</button>`).join('');$('b').disabled=!i;$('n').textContent=i===9?'결과 보기':'다음'}$('c').onclick=e=>{if(e.target.dataset.j!==undefined){a[i]=+e.target.dataset.j;e.target.style.borderColor='#5c8d71'}};$('b').onclick=()=>{if(i)i--;d()};$('n').onclick=()=>{if(a[i]==null)return alert('답을 골라주세요.');if(i<9){i++;d()}else{let s=[0,0,0,0];a.forEach(x=>s[x]++);let k=s.indexOf(Math.max(...s)),r=[['고요 충전형','자극을 줄이고 혼자만의 시간을 가져야 진짜로 회복되는 타입이에요.'],['관계 충전형','좋은 사람과 대화하고 웃는 시간이 가장 강력한 충전법이에요.'],['활동 충전형','새로운 경험과 취미처럼 몸과 마음을 움직이는 것이 회복에 도움이 돼요.'],['정돈 충전형','주변을 정리하고 내 생활의 질서를 되찾을 때 마음이 편안해져요.']][k];$('quiz').classList.add('hide');$('r').classList.remove('hide');$('r').innerHTML=`<div class="pr">YOUR REST TYPE</div><h2>${r[0]}</h2><p class="p">${r[1]}</p><p class="p"><b>오늘의 휴식 처방</b><br>${['알림을 잠시 끄고 조용한 시간을 가져보세요.','좋아하는 사람과 편한 대화를 나눠보세요.','평소 안 하던 작은 취미를 해보세요.','눈에 보이는 곳 하나만 정리해보세요.'][k]}</p><p><a href="/test/13/">다시 하기</a>　<a href="/">다른 테스트</a></p>`}}d()</script></body></html>
