<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연애 스타일 테스트</title><style>body{margin:0;background:#f5f0e4;color:#244638;font-family:sans-serif}.w{max-width:620px;margin:auto;padding:28px 18px}.b{background:#fffdf8;padding:24px;border:1px solid #ddd6c7;border-radius:18px}h1{font-size:28px}.p{color:#7d877f}.q{font-size:18px;line-height:1.6}.c{display:grid;gap:8px}.c button,.nav button{padding:13px;border:1px solid #ddd6c7;border-radius:10px;background:#fffef9;text-align:left}.nav{display:flex;gap:8px;margin-top:14px}.nav button{flex:1;text-align:center}.go{background:#5c8d71!important;color:white!important}.pr{color:#aa8f59;font-weight:bold}a{color:#507960;text-decoration:none}.hide{display:none}.r p{line-height:1.8;color:#6f7b73}.box{background:#edf4ee;padding:12px;border-radius:10px;margin:10px 0}</style></head><body><main class="w"><a href="/">← 메인으로</a><div class="b"><h1>연애 스타일 테스트</h1><p class="p">사랑할 때 나도 몰랐던 행동 패턴을 알아봐요.</p><section id="quiz"><div class="pr" id="pr"></div><p class="q" id="q"></p><div class="c" id="c"></div><div class="nav"><button id="prev">이전</button><button class="go" id="next">다음</button></div></section><section id="r" class="r hide"></section></div></main><script>const qs=[['호감 가는 사람이 생기면?','먼저 지켜본다','자연스럽게 말을 건다','적극적으로 다가간다','상대의 반응부터 확인한다'],['연락이 늦어지면?','기다린다','안부를 묻는다','왜 늦는지 궁금하다','나도 내 시간을 보낸다'],['데이트는?','조용한 카페','맛집과 대화','즉흥적인 곳','새로운 체험'],['상대가 힘들어하면?','곁에 있어준다','공감한다','해결책을 찾는다','기분 전환을 시킨다'],['질투가 날 때?','숨긴다','솔직히 말한다','티가 난다','상황을 확인한다'],['고백은?','확신이 생길 때','분위기를 보며','마음 가는 대로','상대의 신호를 기다린다'],['연애에서 가장 중요한 것은?','편안함','애정 표현','설렘','신뢰'],['싸우면?','시간을 둔다','바로 이야기한다','감정을 털어놓는다','원인을 정리한다'],['기념일에는?','작은 선물','함께 시간 보내기','특별한 이벤트','실용적인 선물'],['이별 후에는?','혼자 정리한다','친구에게 털어놓는다','새로운 활동을 한다','왜 끝났는지 분석한다']];let i=0,a=[];const $=x=>document.getElementById(x);function draw(){ $('pr').textContent=`${i+1} / 10`; $('q').textContent=qs[i][0];$('c').innerHTML=qs[i].slice(1).map((x,j)=>`<button data-j="${j}">${x}</button>`).join('');$('prev').disabled=!i;$('next').textContent=i===9?'결과 보기':'다음';if(a[i]!=null)document.querySelector(`[data-j="${a[i]}"]`).style.borderColor='#5c8d71'}$('c').onclick=e=>{if(e.target.dataset.j!==undefined){a[i]=+e.target.dataset.j;draw()}};$('prev').onclick=()=>{if(i){i--;draw()}};$('next').onclick=()=>{if(a[i]==null)return alert('답을 골라주세요.');if(i<9){i++;draw()}else show()};function show(){let s=[0,0,0,0];a.forEach(x=>s[x]++);let k=s.indexOf(Math.max(...s));let r=[['천천히 깊어지는 연애형','쉽게 마음을 열지는 않지만 한 번 믿으면 오래 사랑해요.','표현을 아끼면 상대가 마음을 읽기 어려울 수 있어요.'],['다정한 교감형','상대의 감정과 분위기를 세심하게 살피는 따뜻한 연애를 해요.','상대의 기분을 지나치게 책임지지 마세요.'],['직진 설렘형','좋아하면 행동으로 보여주는 에너지 넘치는 연애 스타일이에요.','감정이 뜨거울수록 상대의 속도도 확인해보세요.'],['신뢰 확인형','말보다 행동과 일관성을 중요하게 보는 안정적인 연애를 해요.','확신을 얻기 전까지 너무 많은 신호를 해석하지 마세요.']][k];$('quiz').classList.add('hide');$('r').classList.remove('hide');$('r').innerHTML=`<div class="pr">YOUR LOVE TYPE</div><h2>${r[0]}</h2><p>${r[1]}</p><div class="box"><b>연애에서의 약점</b><br>${r[2]}</div><div class="box"><b>오늘의 연애 팁</b><br>좋아하는 사람에게 작은 관심 표현을 먼저 건네보세요.</div><p><a href="/test/02/">다시 하기</a>　<a href="/">다른 테스트</a></p>`}draw()</script></body></html>
