<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="오늘의 띠별·별자리 운세 상세 결과"><title>오늘의 운세 상세 | 운세·심리테스트</title><style>:root{--bg:#f5f0e4;--paper:#fffdf8;--green:#5c8d71;--deep:#244638;--soft:#eaf2eb;--gold:#aa8f59;--line:#ddd6c7;--muted:#7d877f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--deep);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}.wrap{width:min(760px,calc(100% - 28px));margin:auto}.top{padding:20px 0}.back{display:inline-flex;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:12px;font-weight:900;color:#63736a}.hero{padding:28px 0 18px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--green);font-weight:900}.title{display:flex;align-items:center;gap:14px;margin-top:12px}.icon{width:58px;height:58px;border:1px solid #d7cdbb;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#f7f2e7;font:normal 25px Georgia,serif;color:#5b806b}.title h1{font:700 34px/1.2 Georgia,"Noto Serif KR",serif;margin:0}.type{font-size:11px;color:#9a8a65;margin-top:5px}.score-card,.item,.tip{background:var(--paper);border:1px solid var(--line);border-radius:16px}.score-card{padding:20px}.score{font-size:48px;font-weight:900;color:var(--green)}.grade{font-size:12px;color:#507960;background:var(--soft);padding:6px 9px;border-radius:99px;font-weight:900}.summary{font-size:14px;line-height:1.8;color:#68766e;margin:10px 0 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}.item{padding:16px}.item b{font-size:12px;color:#7b837c}.item strong{display:block;font-size:24px;margin-top:8px}.item p{font-size:11px;line-height:1.7;color:#788078;margin:5px 0 0}.tip{margin-top:10px;padding:15px;background:var(--soft);color:#587062;font-size:12px;line-height:1.8}.note{text-align:center;color:#999f98;font-size:9px;padding:18px 0 40px}@media(max-width:600px){.title h1{font-size:28px}.grid{grid-template-columns:1fr}.score-card{padding:17px}}</style></head><body><div class="wrap"><div class="top"><a class="back" href="/">← 운세 목록으로</a></div><main><div class="hero"><div class="eyebrow" id="eyebrow">TODAY'S FORTUNE</div><div class="title"><span class="icon" id="icon"></span><div><h1 id="title"></h1><div class="type" id="type"></div></div></div></div><section class="score-card"><span class="grade" id="grade"></span><div class="score" id="score"></div><p class="summary" id="summary"></p></section><div class="grid" id="grid"></div><div class="tip" id="tip"></div><div class="note">오늘의 운세는 재미와 참고를 위한 콘텐츠입니다.</div></main></div><script>const animals=[['子','쥐'],['丑','소'],['寅','호랑이'],['卯','토끼'],['辰','용'],['巳','뱀'],['午','말'],['未','양'],['申','원숭이'],['酉','닭'],['戌','개'],['亥','돼지']];const stars=[['♈','양자리'],['♉','황소자리'],['♊','쌍둥이자리'],['♋','게자리'],['♌','사자자리'],['♍','처녀자리'],['♎','천칭자리'],['♏','전갈자리'],['♐','사수자리'],['♑','염소자리'],['♒','물병자리'],['♓','물고기자리']];const params=new URLSearchParams(location.search),type=params.get('type')==='star'?'star':'animal',i=Math.max(0,Math.min(11,Number(params.get('index'))||0)),data=type==='animal'?animals:stars,x=data[i],now=new Date(),key=now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate()+'|'+x[1];let n=2166136261;for(let j=0;j<key.length;j++)n=Math.imul(n^key.charCodeAt(j),16777619)>>>0;const score=[72,76,79,83,86,89,92,74,81,87,94,78][n%12],grade=score>=90?'매우 좋음':score>=84?'좋음':score>=78?'무난':'차분',texts=['작은 변화에 유연하게 대응하면 좋은 흐름을 만들 수 있어요.','주변 사람과의 대화 속에서 생각지 못한 기회가 생길 수 있어요.','서두르기보다 지금 해야 할 일을 하나씩 정리하는 편이 좋아요.','평소보다 적극적으로 움직이면 답답했던 일이 풀릴 가능성이 있어요.'],tip=['중요한 결정은 한 번 더 확인하고 천천히 진행해보세요.','오늘은 혼자 해결하려 하기보다 주변의 의견을 가볍게 들어보세요.','작은 약속과 정리를 지키는 것이 하루 전체의 흐름을 좋게 만들어요.','미뤄둔 일 하나를 끝내면 다음 기회가 더 잘 보일 수 있어요.'];document.title=x[1]+' 오늘의 운세 | 운세·심리테스트';document.getElementById('icon').textContent=x[0];document.getElementById('title').textContent=x[1];document.getElementById('type').textContent=type==='animal'?'오늘의 띠별 운세':'오늘의 별자리 운세';document.getElementById('grade').textContent=grade+' · '+score+'점';document.getElementById('score').textContent=score+'점';document.getElementById('summary').textContent=texts[n%4];const vals=[['재물운',Math.max(60,score-2+(n%8)),'지출은 계획적으로, 작은 기회를 놓치지 마세요.'],['애정운',Math.max(60,score-5+((n>>>3)%11)),'솔직한 표현과 가벼운 대화가 관계에 도움이 돼요.'],['직장운',Math.max(60,score+((n>>>6)%7)),'우선순위를 정하면 생각보다 빠르게 일이 풀려요.'],['건강운',Math.max(60,score-4+((n>>>9)%10)),'무리하지 말고 수분과 휴식을 챙겨주세요.']];document.getElementById('grid').innerHTML=vals.map(v=>`<article class="item"><b>${v[0]}</b><strong>${v[1]}점</strong><p>${v[2]}</p></article>`).join('');document.getElementById('tip').textContent='오늘의 포인트 · '+tip[(n>>>12)%4];</script></body></html>
