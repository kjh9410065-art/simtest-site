['에이스','시작 · 가능성','새로운 기회가 열리는 시작점이에요.','기회를 놓치거나 시작할 힘이 분산될 수 있어요.'],
['2','선택 · 균형','두 가지 가능성 사이에서 균형을 잡는 시기예요.','결정을 미루거나 두 방향에 동시에 매달릴 수 있어요.'],
['3','확장 · 협력','혼자보다 함께할 때 결과가 커지는 흐름이에요.','협업의 균형이 깨지거나 준비가 덜 될 수 있어요.'],
['4','안정 · 기반','이미 만든 것을 안정적으로 지키는 힘이 있어요.','익숙함에 머물러 변화가 막힐 수 있어요.'],
['5','경쟁 · 충돌','경쟁이나 마찰 속에서 실력이 드러나는 시기예요.','불필요한 경쟁에 에너지를 쓰기 쉬워요.'],
['6','인정 · 전진','노력의 결과가 드러나고 한 단계 전진할 수 있어요.','인정에 지나치게 의존하거나 성과가 지연될 수 있어요.'],
['7','방어 · 점검','내 입장과 성과를 지키면서 전략을 세울 때예요.','지나치게 방어적이거나 자신감이 흔들릴 수 있어요.'],
['8','속도 · 숙련','반복과 집중이 실력을 빠르게 끌어올려요.','급하게 처리하거나 같은 문제를 반복할 수 있어요.'],
['9','완성 직전 · 인내','마지막 고비를 넘기기 위한 힘이 남아 있어요.','지치거나 혼자 모든 것을 감당하려 할 수 있어요.'],
['10','완결 · 부담','한 사이클이 끝나며 결과와 책임이 함께 나타나요.','과도한 부담을 내려놓지 못할 수 있어요.'],
['페이지','호기심 · 소식','새로운 정보와 배움이 들어오는 흐름이에요.','미숙한 판단이나 산만함을 주의해야 해요.'],
['나이트','추진 · 이동','빠르게 움직이며 경험을 쌓는 에너지가 강해요.','성급함과 충동적인 행동이 변수가 될 수 있어요.'],
['퀸','성숙 · 돌봄','자신의 영역을 안정적으로 다루는 성숙한 힘이 있어요.','감정을 혼자 감당하거나 지나치게 통제할 수 있어요.'],
['킹','주도 · 완성','경험을 바탕으로 상황을 책임지고 이끄는 힘이 있어요.','권위적이거나 지나치게 자기 방식만 고집할 수 있어요.']
];
const MINOR=[];
Object.entries(SUITS).forEach(([s,v])=>RANKS.forEach((r,i)=>MINOR.push({id:`${s}-${i}`,name:`${s} ${r[0]}`,keywords:`${r[1]} · ${v.area}`,symbol:v.symbol,suit:s,rank:r[0],upright:r[2],reversed:r[3],suitData:v,rankIndex:i})));
const DECK=[...MAJOR.map(x=>({major:true,id:x[0],name:x[1],keywords:x[2],upright:x[3],love:x[4],work:x[4],advice:x[5],reversed:x[6],revAdvice:x[7],symbol:x[8]})),...MINOR];

const THEMES={today:{label:'오늘',positions:['현재 흐름','오늘의 핵심','오늘의 조언']},love:{label:'연애',positions:['현재 관계','상대와의 흐름','연애 조언']},money:{label:'금전',positions:['현재 재정','기회의 흐름','금전 조언']},work:{label:'일',positions:['현재 업무','앞으로의 흐름','일의 조언']},rel:{label:'인간관계',positions:['현재 관계','주변의 흐름','관계 조언']}};
let theme='today',spreadCount=1,lastDraw=[];
const $=id=>document.getElementById(id);

// 주제 버튼을 만들고 선택 상태를 관리합니다.
Object.entries(THEMES).forEach(([id,v])=>{const b=document.createElement('button');b.textContent=v.label;b.dataset.theme=id;if(id===theme)b.className='on';b.onclick=()=>{theme=id;document.querySelectorAll('#themes button').forEach(x=>x.classList.remove('on'));b.classList.add('on')};$('themes').appendChild(b)});
document.querySelectorAll('.spreadBtn').forEach(b=>b.onclick=()=>{spreadCount=Number(b.dataset.spread);document.querySelectorAll('.spreadBtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderEmpty()});

function seedRandom(){// 날짜와 브라우저 저장값을 섞어 새로고침마다 같은 결과가 고정되지 않도록 합니다.
 let s=localStorage.getItem('mira_tarot_seed');if(!s){s=crypto.randomUUID?crypto.randomUUID():String(Math.random());localStorage.setItem('mira_tarot_seed',s)}let h=2166136261;for(const c of `${Date.now()}|${s}|${Math.random()}`){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(){let x=seedRandom();return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
function pickDeck(n){const r=rng(),pool=[...DECK],out=[];for(let i=0;i<n;i++){const idx=Math.floor(r()*pool.length);const card=pool.splice(idx,1)[0];out.push({...card,reversed:r()>.68})}return out}
function renderEmpty(){lastDraw=[];$('result').className='result';$('result').innerHTML='';renderSlots();}
function renderSlots(){const p=THEMES[theme].positions;$('spread').innerHTML=Array.from({length:spreadCount},(_,i)=>`<div class="slot"><div class="pos">${spreadCount===1?'오늘의 카드':p[i]}</div><div class="card" id="slotCard${i}"></div><div class="slotName" id="slotName${i}">카드를 뽑아보세요</div></div>`).join('')}
function cardText(c,field){if(c.major){if(field==='love')return c.reversed?'감정이나 관계에서 과거의 패턴이 반복되지 않도록 경계를 세우는 게 좋아요.':'상대와의 관계에서 이 카드의 핵심 주제가 강하게 드러나요.';if(field==='work')return c.reversed?'일의 방향을 다시 점검하고 무리한 통제를 줄이는 편이 좋아요.':'일에서 이 카드의 핵심 주제가 성과와 선택에 영향을 줘요.';return c.reversed?c.revAdvice:c.advice}const v=c.suitData;const rank=RANKS[c.rankIndex];if(field==='love')return c.reversed?`${v.rev} ${rank[3]} 연애에서는 감정보다 속도 조절이 중요해요.`:v.love+` ${rank[2]}`;if(field==='money')return c.reversed?`${v.rev} ${rank[3]} 현실적인 숫자와 조건을 다시 확인하세요.`:v.money+` ${rank[2]}`;if(field==='work')return c.reversed?`${v.rev} ${rank[3]} 업무에서는 한 가지 핵심부터 정리하세요.`:v.work+` ${rank[2]}`;if(field==='rel')return c.reversed?`${v.rev} ${rank[3]} 상대의 의도를 추측하기보다 확인하는 게 좋아요.`:v.rel+` ${rank[2]}`;return c.reversed?`${v.rev} ${rank[3]}`:v.upright+` ${rank[2]}`}
function label(c){return `${c.name} · ${c.reversed?'역방향':'정방향'}`}
function renderResult(){
 const first=lastDraw[0],t=theme;
 const main=first.major?(first.reversed?first.reversed:first.upright):cardText(first,t==='love'?'love':t==='money'?'money':t==='work'?'work':t==='rel'?'rel':'today');
 let html=`<div class="eyebrow">YOUR TAROT</div><h2>${THEMES[t].label} · ${label(first)}</h2><span class="orientation ${first.reversed?'rev':''}">${first.reversed?'역방향':'정방향'}</span><div class="keywords">${first.keywords.split(' · ').map(x=>`<span class="kw">${x}</span>`).join('')}</div><p class="meaning">${main}</p>`;
 html+=`<div class="detailGrid"><div class="item"><b>연애·관계</b><p>${first.major?cardText(first,'love'):cardText(first,'love')}</p></div><div class="item"><b>일·금전</b><p>${first.major?cardText(first,'work'):cardText(first,t==='money'?'money':'work')}</p></div><div class="item"><b>${THEMES[t].label}의 핵심</b><p>${first.major?(first.reversed?first.reversed:first.upright):cardText(first,'today')}</p></div><div class="item"><b>숨은 포인트</b><p>${first.reversed?(first.major?first.revAdvice:first.suitData.rev):(first.major?first.advice:first.suitData.advice)}</p></div></div>`;
 html+=`<div class="advice"><b>오늘의 조언</b><br>${first.reversed?(first.major?first.revAdvice:first.suitData.advice):first.major?first.advice:first.suitData.advice}</div>`;
 if(spreadCount===3){const [a,b,c]=lastDraw;html+=`<div class="combo"><b>3장 흐름 해석</b><p><strong>과거·원인</strong> ${cardShort(a)} → <strong>현재·핵심</strong> ${cardShort(b)} → <strong>앞으로·결과</strong> ${cardShort(c)}</p><p>${comboText(a,b,c)}</p></div>`}
 html+=`<div class="actions"><button class="action primary" onclick="draw()">다시 뽑기</button><a class="action" href="/">다른 콘텐츠 보기</a></div>`;$('result').innerHTML=html;$('result').className='result show';
}
function cardShort(c){return `${c.name}${c.reversed?' 역방향':' 정방향'}`}
function comboText(a,b,c){const r=a.reversed||c.reversed?'변화 과정에서 조정이 필요한 흐름이 보여요.':'전체적으로 자연스럽게 이어지는 흐름이에요.';return `${r} ${a.name}의 시작점이 ${b.name}에서 핵심 과제가 되고, ${c.name}의 방향으로 이어집니다. 현재 카드의 메시지를 중심으로 행동을 정하면 해석이 가장 선명해져요.`}
function draw(){lastDraw=pickDeck(spreadCount);renderSlots();lastDraw.forEach((c,i)=>{const el=$(`slotCard${i}`);el.className=`card revealed${c.reversed?' reversed':''}`;el.dataset.symbol=c.symbol;el.dataset.label=c.name+(c.reversed?' · 역':'');$(`slotName${i}`).innerHTML=`${c.name}<small>${c.reversed?'역방향':'정방향'} · ${c.keywords}</small>`});renderResult();$('result').scrollIntoView({behavior:'smooth',block:'start'})}
$('drawBtn').onclick=draw;renderEmpty();
</script>
</body>
</html>
