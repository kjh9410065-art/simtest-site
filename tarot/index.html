<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="오늘의 타로카드 한 장을 뽑아보세요. 사랑, 일, 금전, 인간관계의 흐름을 재미로 확인합니다."><title>오늘의 타로카드 | 운세·심리테스트</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3eee3;color:#263f34;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;letter-spacing:-.03em}.wrap{width:min(720px,calc(100% - 24px));margin:auto;padding:18px 0 44px}.back{color:#527961;text-decoration:none;font-size:12px;font-weight:900}.box{margin-top:12px;background:#fffdf8;border:1px solid #ddd5c6;border-radius:22px;padding:24px;box-shadow:0 12px 32px rgba(40,55,46,.07)}.eyebrow{font-size:10px;letter-spacing:2.4px;color:#aa8f59;font-weight:900}.title{font:700 34px Georgia,"Noto Serif KR",serif;margin:9px 0 6px;letter-spacing:-2px}.intro{font-size:13px;line-height:1.8;color:#768178}.draw{display:flex;justify-content:center;margin:26px 0 20px}.card{width:180px;height:280px;border-radius:16px;background:linear-gradient(145deg,#315442,#1f3d30);border:6px solid #c7aa69;box-shadow:0 16px 35px rgba(35,58,47,.2);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.card:before{content:"✦";font-size:72px;color:#d7c18b}.card:after{content:"TAROT";position:absolute;bottom:14px;font:700 11px Georgia,serif;letter-spacing:4px;color:#d7c18b}.card.revealed{background:#fffaf0;border-color:#aa8f59}.card.revealed:before{content:attr(data-symbol);font-size:70px;color:#557860}.card.revealed:after{color:#8f7747}.draw button,.again,.home{border:0;border-radius:11px;padding:13px 22px;font-weight:900;font-size:13px}.draw button{background:#5c8d71;color:#fff}.result{display:none}.result.show{display:block}.result h2{font:700 29px Georgia,"Noto Serif KR",serif;margin:8px 0}.keyword{color:#aa8f59;font-size:11px;font-weight:900;margin-bottom:15px}.meaning{font-size:14px;line-height:1.85;color:#637169}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.item{padding:15px;border:1px solid #e1d9cb;border-radius:12px;background:#fbf8f0}.item b{font-size:12px}.item p{font-size:12px;line-height:1.7;color:#758078;margin:7px 0 0}.tip{margin-top:10px;padding:15px;border-radius:12px;background:#edf4ee;color:#4f745d;font-size:12px;line-height:1.75}.buttons{display:flex;gap:8px;margin-top:14px}.again,.home{flex:1;text-align:center;text-decoration:none;background:#fffef9;border:1px solid #d8d0c3;color:#527961}.again{background:#5c8d71;color:#fff;border-color:#5c8d71}@media(max-width:600px){.box{padding:19px}.title{font-size:29px}.card{width:160px;height:245px}.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><a class="back" href="/">← 메인으로</a><div class="box"><div class="eyebrow">ONE CARD TAROT</div><h1 class="title">오늘, 한 장의 타로</h1><p class="intro">지금 마음속에 떠오르는 질문을 생각한 뒤 카드를 뽑아보세요. 오늘의 흐름을 재미로 확인할 수 있어요.</p><div class="draw"><div class="card" id="card"></div></div><div class="draw" id="drawArea"><button id="drawBtn">타로카드 뽑기</button></div><section class="result" id="result"><div class="eyebrow">YOUR CARD</div><h2 id="name"></h2><div class="keyword" id="keyword"></div><p class="meaning" id="meaning"></p><div class="grid"><div class="item"><b>사랑·관계</b><p id="love"></p></div><div class="item"><b>일·금전</b><p id="work"></p></div><div class="item"><b>오늘의 흐름</b><p id="flow"></p></div><div class="item"><b>조심할 점</b><p id="caution"></p></div></div><div class="tip"><b>오늘의 한마디</b><br><span id="tip"></span></div><div class="buttons"><button class="again" onclick="location.reload()">다시 뽑기</button><a class="home" href="/">다른 콘텐츠 보기</a></div></section></div></main><script>
// 메이저 아르카나 22장을 사용하며, 날짜와 브라우저 랜덤값으로 하루 동안 같은 카드를 유지합니다.
const cards=[
['바보','새로운 시작 · 자유 · 모험','지금까지의 틀에서 벗어나 가볍게 첫발을 내딛기 좋은 카드예요.','관계에서 솔직함이 분위기를 바꿀 수 있어요.','새로운 일이나 작은 도전에 운이 따라요.','완벽한 준비를 기다리다 기회를 놓치지 마세요.','오늘은 결과보다 첫걸음 자체를 믿어보세요.','○'],
['마법사','능력 · 실행 · 가능성','이미 필요한 재료는 갖고 있어요. 생각만 하기보다 직접 움직일 때 가능성이 현실이 됩니다.','먼저 표현하면 관계가 빠르게 가까워질 수 있어요.','아이디어를 실제 행동으로 옮기면 좋은 흐름이에요.','말만 앞서지 않도록 하나는 실제로 끝내세요.','오늘 할 수 있는 가장 작은 행동부터 시작하세요.','✦'],
['여사제','직관 · 침묵 · 내면','지금은 모든 답을 밖에서 찾기보다 자신의 감각을 믿어야 하는 때예요.','상대의 말보다 행동을 천천히 살펴보세요.','급한 결정은 미루고 정보를 더 모으는 편이 좋아요.','확신 없는 상태에서 결론을 내리지 마세요.','오늘은 조용히 생각할 시간을 가져보세요.','☾'],
['황제','질서 · 책임 · 안정','흐트러진 것을 정리하고 주도권을 잡을수록 마음이 편안해지는 흐름이에요.','관계를 분명하게 정의하면 오해가 줄어요.','계획과 기준을 세우면 성과가 따라와요.','모든 것을 통제하려는 마음은 조금 내려놓으세요.','오늘 하나의 기준을 정하고 끝까지 지켜보세요.','♜'],
['여황제','풍요 · 매력 · 성장','억지로 밀어붙이기보다 여유와 배려를 선택할 때 좋은 것이 자라는 카드예요.','따뜻한 표현이 관계에 좋은 변화를 만들어요.','사람과의 연결에서 기회가 생길 수 있어요.','상대에게 맞추느라 내 필요를 잊지 마세요.','오늘 좋아하는 것을 하나 충분히 누려보세요.','❀'],
['연인','선택 · 끌림 · 조화','마음과 현실 사이에서 중요한 선택이 생길 수 있어요. 진짜 원하는 것을 바라보세요.','호감과 대화의 운이 좋은 날이에요.','협력이나 계약에서 서로의 조건을 확인하세요.','감정만으로 중요한 결정을 서두르지 마세요.','오늘 내가 원하는 것을 한 문장으로 정리해보세요.','♡'],
['전차','추진력 · 승리 · 집중','방향을 정하고 흔들리지 않는다면 생각보다 빠르게 앞으로 나아갈 수 있어요.','적극적인 표현이 관계의 속도를 높여요.','목표 하나에 집중하면 성과가 좋아요.','여러 일을 동시에 잡지 마세요.','오늘 가장 중요한 일 하나를 먼저 끝내세요.','➤'],
['힘','용기 · 인내 · 절제','강하게 밀어붙이는 것보다 감정을 다스리는 힘이 더 큰 결과를 만드는 카드예요.','부드러운 태도가 오히려 매력을 높여요.','꾸준히 해온 일이 조금씩 힘을 발휘해요.','순간의 감정으로 말하지 않도록 주의하세요.','오늘 한 번 참을 수 있는 것을 의식적으로 참아보세요.','∞'],
['은둔자','성찰 · 탐색 · 지혜','잠시 속도를 늦추고 나에게 집중하면 답이 보이는 흐름이에요.','혼자 생각할 시간이 관계에도 도움이 돼요.','서두르기보다 방향을 점검하기 좋은 날이에요.','지나친 고립은 오히려 생각을 길게 만들어요.','오늘 휴대폰을 내려놓고 혼자 걷는 시간을 가져보세요.','⌂'],
['운명의 수레바퀴','변화 · 전환 · 기회','멈춰 있던 흐름이 움직일 수 있어요. 예상 밖의 변화도 새로운 기회가 될 수 있습니다.','우연한 만남이나 연락에 주목해보세요.','뜻밖의 기회가 들어올 수 있어요.','변화를 무조건 통제하려 하지 마세요.','오늘 평소와 다른 선택 하나를 해보세요.','◉'],
['정의','균형 · 판단 · 결과','감정보다 사실을 바라볼수록 올바른 판단에 가까워지는 카드예요.','서로의 입장을 공정하게 들어주세요.','계약·돈 문제는 숫자를 꼼꼼히 확인하세요.','내게 유리한 것만 보려 하지 마세요.','오늘 결정 하나를 장단점으로 나눠보세요.','⚖'],
['매달린 사람','관점 전환 · 기다림 · 내려놓음','지금 당장 움직이지 않는 것이 오히려 필요한 순간일 수 있어요. 다른 시선으로 상황을 바라보세요.','상대에게 답을 재촉하지 않는 게 좋아요.','잠시 멈추면 더 나은 방법이 보일 수 있어요.','억지로 결과를 당기려 하지 마세요.','오늘 하나의 문제를 반대편 시선에서 바라보세요.','◇'],
['죽음','종료 · 변화 · 재시작','무언가가 끝나는 것은 반드시 나쁜 일이 아니에요. 오래된 흐름을 정리할 때 새 기회가 들어옵니다.','지나간 관계의 패턴을 놓아줄 때예요.','불필요한 지출이나 일을 정리하기 좋아요.','변화를 두려워해 오래된 것을 붙잡지 마세요.','오늘 하나의 오래된 습관을 내려놓아보세요.','✧'],
['절제','조화 · 회복 · 균형','극단으로 가지 않고 적당한 속도를 유지할 때 가장 편안한 흐름이 만들어져요.','대화의 온도를 맞추면 관계가 안정돼요.','꾸준한 관리가 좋은 결과를 만들어요.','한 번에 너무 많은 것을 바꾸지 마세요.','오늘은 70%의 힘으로도 충분하다고 생각해보세요.','≈'],
['악마','욕망 · 집착 · 유혹','나를 붙잡고 있는 것이 무엇인지 바라볼 필요가 있어요. 원하는 것과 필요한 것을 구분해보세요.','강한 끌림이 있지만 속도를 조절하세요.','충동적인 소비와 선택을 주의하세요.','습관처럼 반복하는 행동을 그냥 넘기지 마세요.','오늘 하나의 충동을 10분만 미뤄보세요.','◆'],
['탑','급변 · 깨달음 · 재정비','예상하지 못한 변화가 오래된 문제를 한 번에 드러낼 수 있어요. 무너진 뒤 다시 세울 기회도 있습니다.','감정적으로 폭발하기보다 잠시 거리를 두세요.','계획의 변수를 하나 더 확인하세요.','갑작스러운 상황을 최악으로 단정하지 마세요.','오늘 바뀌어도 괜찮은 계획을 하나 만들어두세요.','⚡'],
['별','희망 · 회복 · 가능성','지금은 서서히 좋아지는 흐름을 믿어도 괜찮아요. 작은 희망이 다음 선택을 이끌어요.','솔직한 마음이 좋은 연결을 만들어요.','장기적으로 바라보면 긍정적인 흐름이에요.','당장 결과가 없다고 포기하지 마세요.','오늘 기대하는 미래를 하나 적어보세요.','☆'],
['달','불안 · 상상 · 숨은 감정','확실하지 않은 것을 상상으로 채우기 쉬운 날이에요. 사실과 느낌을 구분해보세요.','상대의 마음을 혼자 추측하지 마세요.','확인되지 않은 정보로 결정을 내리지 마세요.','불안이 사실처럼 느껴질 수 있어요.','오늘 걱정 하나를 사실과 추측으로 나눠보세요.','☽'],
['태양','성공 · 기쁨 · 자신감','분위기가 밝아지고 자신 있게 움직일수록 좋은 결과를 끌어오는 카드예요.','즐거운 만남과 솔직한 표현에 좋은 운이 있어요.','성과를 드러내고 인정받기 좋은 흐름이에요.','좋은 분위기에 들떠 중요한 부분을 놓치지 마세요.','오늘 잘한 일을 하나 스스로 인정해주세요.','☀'],
['심판','각성 · 결단 · 재출발','미뤄두었던 문제를 다시 바라보고 새로운 결정을 내릴 수 있는 시점이에요.','과거의 오해를 풀 기회가 있어요.','지난 경험을 활용하면 좋은 선택이 됩니다.','후회만 반복하지 말고 배운 점을 가져가세요.','오늘 다시 시작하고 싶은 일을 하나 골라보세요.','♢'],
['세계','완성 · 성취 · 다음 단계','하나의 사이클이 완성되고 다음 단계로 넘어갈 준비가 된 카드예요.','관계가 한 단계 깊어질 수 있어요.','지금까지의 노력이 결과로 연결될 가능성이 높아요.','끝났다고 방심하지 말고 다음 계획을 준비하세요.','오늘 완료한 일을 하나 확실하게 표시해보세요.','◎'],
['달','직관 · 감정 · 숨은 흐름','겉으로 보이는 것만으로 판단하기보다 내면의 신호를 살펴야 하는 카드예요.','말하지 않은 감정이 있을 수 있어요.','결정 전 한 번 더 확인하면 좋아요.','혼자 상상으로 결론을 만들지 마세요.','오늘 마음에 걸리는 것을 글로 적어보세요.','☾']
];
const now=new Date();const key=now.getFullYear()+'.'+(now.getMonth()+1)+'.'+now.getDate();let seed=localStorage.getItem('mira_tarot_seed');if(!seed){seed=crypto.randomUUID?crypto.randomUUID():String(Math.random());localStorage.setItem('mira_tarot_seed',seed)}let h=0;for(const c of key+'|'+seed)h=(Math.imul(h,31)+c.charCodeAt(0))>>>0;const idx=h%22;document.getElementById('drawBtn').onclick=()=>{const c=cards[idx];const el=document.getElementById('card');el.classList.add('revealed');el.dataset.symbol=c[7];document.getElementById('drawArea').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('name').textContent=c[0];document.getElementById('keyword').textContent=c[1];document.getElementById('meaning').textContent=c[2];document.getElementById('love').textContent=c[3];document.getElementById('work').textContent=c[4];document.getElementById('flow').textContent=c[5];document.getElementById('caution').textContent=c[6];document.getElementById('tip').textContent=c[5]+' '+c[6]};
</script></body></html>
