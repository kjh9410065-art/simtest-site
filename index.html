<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>오늘의 운세 &amp; 심리테스트</title>
<style>
:root{--navy:#070b36;--navy2:#10145b;--purple:#7b35ff;--pink:#f12aa9;--ink:#17183d;--muted:#777895;--line:#e8e7f1;--bg:#f7f6fb;--card:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#020318;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}.app{width:100%;max-width:620px;margin:auto;min-height:100vh;background:var(--bg);overflow:hidden;position:relative}.top{height:62px;background:#080d4b;color:#fff;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:0 10px;position:sticky;top:0;z-index:50;box-shadow:0 4px 18px #0003}.top button{font-size:27px;color:#fff;line-height:1}.brand{text-align:center;font-size:17px;font-weight:900;letter-spacing:-.8px;white-space:nowrap}.page{padding-bottom:88px}.view{display:none}.view.on{display:block}
.hero{position:relative;min-height:485px;overflow:hidden;background:#0a0d4d;color:#fff}.hero-bg{position:absolute;inset:0;background:radial-gradient(circle at 72% 24%,#6738bd 0,#31258e 32%,#10155c 65%,#080b3c 100%)}.hero-bg:after{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:92px 83px;opacity:.42}.hero-character{position:absolute;right:-18px;top:20px;width:58%;height:390px;object-fit:cover;object-position:center top;mix-blend-mode:screen;filter:saturate(1.08) contrast(1.04);mask-image:linear-gradient(to left,black 68%,transparent 100%),linear-gradient(to top,black 70%,transparent 100%);z-index:1}.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,#080b3ddd 0%,#080b3d9c 38%,transparent 72%),linear-gradient(0deg,#080b3d 0%,transparent 48%);z-index:2}.hero-content{position:relative;z-index:3;padding:30px 24px 26px;min-height:485px;display:flex;flex-direction:column;justify-content:flex-end}.kicker{font-size:13px;font-weight:800;margin-bottom:auto;padding-top:4px}.hero h1{font-size:34px;line-height:1.18;margin:0 0 18px;letter-spacing:-2px}.hero h1 em{font-style:normal;color:#ff47c3}.hero p{font-size:15px;line-height:1.7;margin:0 0 22px;color:#e6e7ff}.cta{width:100%;height:58px;border-radius:30px;background:linear-gradient(90deg,#8438ff,#f329a8);color:#fff;font-weight:900;font-size:18px;box-shadow:0 12px 30px #9b31e855}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;background:#080b3d}.quick button{min-height:105px;border:1px solid #a974ff88;border-radius:20px;background:linear-gradient(145deg,#151b69,#16114f);color:#fff;box-shadow:inset 0 1px #fff1,0 8px 20px #0003;display:flex;align-items:center;gap:12px;padding:15px;font-weight:900;text-align:left}.quick .ico{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff8,#fff0 30%),linear-gradient(145deg,#7f43ff,#e92cab);font-size:38px;flex:0 0 64px}.quick span:last-child{font-size:16px;line-height:1.25}
.section{padding:20px 14px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 12px}.section h2{font-size:22px;margin:0;letter-spacing:-1.4px}.more{color:#777;font-size:13px;font-weight:800}.ad{height:96px;margin:2px 14px 8px;border:1px dashed #cfcde0;border-radius:18px;background:#fff;display:grid;place-items:center;color:#aaa7ba;font-size:14px}
.test-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.test-card{background:#fff;border:1px solid #e6e3ef;border-radius:18px;overflow:hidden;box-shadow:0 7px 18px #1a155514;cursor:pointer}.art{height:150px;background:#171553;overflow:hidden}.art img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}.test-body{padding:12px}.test-body h3{font-size:16px;margin:0 0 5px;letter-spacing:-.8px}.test-body p{font-size:12px;color:#77798e;line-height:1.45;margin:0 0 9px;min-height:34px}.start-link{font-size:13px;font-weight:900;color:#6932d9}
.luck{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#f0ecff;padding:10px;border-radius:20px}.luck-card{background:#fff;border-radius:17px;padding:13px;border:1px solid #e7e3f0}.luck-top{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px}.score{font-size:22px;font-weight:950;color:#6734dc;margin:8px 0 3px}.mini{height:7px;border-radius:8px;background:#eee;overflow:hidden}.mini i{display:block;height:100%;background:linear-gradient(90deg,#7134ef,#f12aa9);border-radius:8px}.luck-card p{font-size:11px;color:#777;margin:5px 0 0}
.promo{margin:4px 14px 20px;min-height:205px;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(120deg,#10164e,#53209b 60%,#d12aa7)}.promo img{position:absolute;right:0;top:0;width:62%;height:100%;object-fit:cover;object-position:center;opacity:.9}.promo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#10164ef0 0%,#10164ebb 34%,transparent 78%)}
</style>
</head>
