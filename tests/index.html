<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="운세·심리테스트 전체 심리테스트 목록"><title>전체 심리테스트 | 운세·심리테스트</title><link rel="stylesheet" href="/assets/test-page.css"><style>.list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}.item{display:block;padding:15px;border:1px solid #ddd6c7;border-radius:12px;background:#fbf8f0;text-decoration:none;color:#244638}.item b{display:block;font-size:16px;margin-bottom:6px}.item small{color:#7d877f}@media(max-width:600px){.list{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a class="back" href="/">← 메인으로</a><div class="box"><div class="cat">PSYCHOLOGY</div><h1 class="title">전체 심리테스트</h1><p class="intro">현재 25개의 독립 심리테스트를 준비했습니다. 각 테스트는 10개의 고유 질문으로 구성됩니다.</p><div class="list" id="list"></div></div></main><script>const T=[['01','숨겨진 성향'],['02','연애 스타일'],['03','스트레스 유형'],['04','첫인상'],['05','친구 관계'],['06','리더십'],['07','감정 표현'],['08','결정 스타일'],['09','여행 성향'],['10','직장 성향'],['11','자존감'],['12','소비 성향'],['13','휴식 성향'],['14','나의 이상형'],['15','썸에서 드러나는 행동'],['16','감정적으로 힘들 때 나는?'],['17','번아웃 신호'],['18','협업 성향'],['19','나의 업무 스타일'],['20','나의 하루 루틴'],['21','미루기 성향'],['22','질투 성향'],['23','갈등 대처 스타일'],['24','나의 숨은 매력'],['25','휴일 사용법']];document.getElementById('list').innerHTML=T.map(x=>`<a class="item" href="/test/${x[0]}/"><b>${x[1]}</b><small>${x[0]} · 10문제</small></a>`).join('');</script></body></html>
